{n:9,g:"B",d:"mid",tech:"Canvas charts · localStorage",
 vi:{t:"Sổ chi tiêu + biểu đồ",p:"Tiền cá nhân 'thất thoát' không phải vì khoản lớn mà vì hàng trăm khoản nhỏ không ai ghi lại. App ngân hàng thì chỉ liệt kê giao dịch, không trả lời câu hỏi 'tháng này tôi đốt bao nhiêu cho ăn uống so với tháng trước'. Một sổ chi tiêu gọn, ghi trong ba giây, vẽ lại thành biểu đồ là đủ để nhìn thấy sự thật.",
 f:["Ghi khoản chi/thu trong vài giây: số tiền, nhóm, ghi chú","Nhóm chi tiêu tuỳ biến: ăn uống, đi lại, nhà ở, giải trí…","Biểu đồ cột theo tháng và biểu đồ tròn theo nhóm","Xem danh sách theo tháng, sửa/xoá khoản ghi nhầm","Tổng kết đầu tháng: tháng này so với tháng trước; xuất/nhập sao lưu"],
 w:"Dữ liệu là danh sách các khoản nhỏ dạng chữ — localStorage giữ vài năm chi tiêu dễ dàng. Biểu đồ là Canvas thuần. Mọi thứ ở một máy một người, đúng bản chất riêng tư của dữ liệu tài chính cá nhân.",
 a:"Màn hình chính chia hai: form ghi nhanh ở trên, biểu đồ và danh sách tháng hiện tại ở dưới. Mỗi khoản là {ngày, số tiền, nhóm, loại chi/thu, ghi chú}. Tổng hợp tháng là hàm tính lại từ danh sách mỗi khi có thay đổi.",
 ai:["Khung: form ghi nhanh và vùng biểu đồ tĩnh với dữ liệu mẫu một tháng. Kiểm tra form có ghi được bằng một tay trên điện thoại không.","Cốt lõi: ghi/sửa/xoá khoản, tổng tháng tính đúng tách chi và thu. Kiểm thử khoản ghi ngày cuối tháng và đầu tháng.","Lưu trữ: lưu vào localStorage, chuyển tháng xem lại dữ liệu cũ; Xuất/Nhập sao lưu và qua phép thử vòng tròn.","Đánh bóng: biểu đồ tròn theo nhóm, so sánh hai tháng, nhóm chi tiêu tuỳ biến, đặt hạn mức cho từng nhóm."],
 x:"Cạm bẫy: ghi chép đứt quãng làm biểu đồ nói dối — hãy thiết kế form ghi nhanh tới mức không có lý do lười. Cạm bẫy hai: số tiền âm/dương lẫn lộn giữa chi và thu; dùng trường 'loại' riêng thay vì dấu âm. Nâng cấp: ngân sách theo nhóm kèm cảnh báo khi vượt, nhập nhanh bằng mẫu câu (dán tin nhắn biến động số dư để AI gợi ý cách tách trường — vẫn xử lý tại chỗ)."},
 en:{t:"Expense tracker + charts",p:"Personal money doesn't leak through big purchases but through hundreds of small ones nobody records. Banking apps only list transactions; they don't answer 'how much did I burn on food this month versus last month?'. A lean expense log — three seconds to record, drawn back as charts — is enough to see the truth.",
 f:["Record an expense/income in seconds: amount, category, note","Custom categories: food, transport, housing, fun…","Bar chart by month and pie chart by category","Browse each month's list; edit/delete mistaken entries","Month summary: this month vs last month; export/import backup"],
 w:"The data is a list of small text records — localStorage holds years of spending easily. Charts are plain Canvas. Everything is one person, one machine, matching the private nature of personal finance data.",
 a:"The main screen splits in two: a quick-entry form on top, charts and the current month's list below. Each record is {date, amount, category, expense/income type, note}. Monthly summaries are a function recomputed from the list on every change.",
 ai:["Frame: quick-entry form and a static chart area with one sample month. Check the form works one-handed on a phone.","Core: add/edit/delete records with correct monthly totals separating expense and income. Test entries on month boundaries.","Storage: save to localStorage; browse older months; Export/Import and pass the full-circle test.","Polish: pie chart by category, two-month comparison, custom categories, per-category budget limits."],
 x:"Pitfall: intermittent recording makes charts lie — design the entry form so fast there's no excuse for laziness. Pitfall two: mixing up negative/positive between expenses and income; use a separate 'type' field instead of signs. Upgrades: per-category budgets with overspend warnings, quick entry templates."}},

{n:10,g:"B",d:"hard",tech:"Web Crypto · localStorage",
 vi:{t:"Nhật ký có khoá",p:"Nhật ký giấy sợ người khác đọc trộm; nhật ký trên app đám mây sợ rò rỉ và sợ chính nhà cung cấp. Người viết nhật ký nghiêm túc cần một nơi viết mà ngay cả người cầm được máy cũng không đọc nổi khi chưa có mật khẩu — và không phụ thuộc bất kỳ dịch vụ nào còn sống bao lâu.",
 f:["Đặt mật khẩu; toàn bộ nội dung được mã hoá trước khi lưu","Viết bài theo ngày, mở lại đúng ngày để đọc và viết tiếp","Danh sách ngày đã viết dạng lịch tháng; tìm kiếm trong các bài đã mở khoá","Xuất bản sao lưu đã mã hoá để cất nơi khác","Tự khoá khi đóng tab hoặc sau vài phút không viết"],
 w:"Web Crypto mã hoá nội dung bằng khoá dẫn xuất từ mật khẩu của bạn; bản đã mã hoá nằm trong localStorage. Không máy chủ nghĩa là không ai khác giữ chìa khóa hộ — đó vừa là điểm mạnh vừa là trách nhiệm, và công cụ phải nói rõ.",
 a:"Luồng giống Ý 7: mở khoá bằng mật khẩu → giải mã toàn bộ nhật ký vào bộ nhớ → viết/đọc → mã hoá lại khi lưu → khoá thì xoá dữ liệu rõ khỏi bộ nhớ. Mỗi bài là {ngày, nội dung}, toàn bộ nằm trong một khối mã hoá duy nhất để đơn giản và an toàn.",
 ai:["Khung: màn hình đặt/mở mật khẩu và trang viết mẫu một ngày. Kiểm tra cảm giác 'trang giấy' có đủ yên tĩnh để viết không.","Cốt lõi: viết, lưu, mở lại đúng ngày; lịch tháng đánh dấu ngày đã viết. Kiểm thử nhập sai mật khẩu và ngày chưa có bài.","Lưu trữ: nối mã hoá Web Crypto cho toàn bộ dữ liệu; xuất/nhập bản sao lưu đã mã hoá; tự thử tình huống quên mật khẩu.","Đánh bóng: đếm từ mỗi bài, chế độ viết tập trung, nhắc nhẹ 'bạn đã viết 5 ngày liên tiếp', giao diện tối dịu."],
 x:"Nói thẳng từ đầu: quên mật khẩu là mất nhật ký vĩnh viễn — hãy bắt người dùng (kể cả chính bạn) xuất bản sao lưu đã mã hoá ngay sau tuần đầu tiên. Cạm bẫy hai: mã hoá từng bài riêng lẻ làm lộ siêu dữ liệu (ngày nào viết, dài bao nhiêu) — mã hoá cả khối là lựa chọn an toàn hơn cho quy mô này. Nâng cấp: gắn tâm trạng cho từng ngày và xem biểu đồ tâm trạng theo tháng, sau khi đã mở khoá."},
 en:{t:"Locked journal",p:"A paper journal fears snooping housemates; a cloud journal app fears leaks and the provider itself. Serious journalers need a place to write that even someone holding the machine cannot read without the password — and that depends on no service's lifespan.",
 f:["Set a password; all content is encrypted before storage","Write entries by day; reopen a day to read and continue","A month-calendar list of written days; search within unlocked entries","Export an encrypted backup to keep elsewhere","Auto-lock when the tab closes or after a few idle minutes"],
 w:"Web Crypto encrypts content with a key derived from your password; the ciphertext sits in localStorage. No server means nobody else holds a spare key — both the strength and the responsibility, and the tool must say so clearly.",
 a:"The flow mirrors Idea 7: unlock with the password → decrypt the whole journal into memory → read/write → re-encrypt on save → on lock, wipe plaintext from memory. Each entry is {date, content}; everything lives inside one single encrypted blob for simplicity and safety.",
 ai:["Frame: set/unlock password screens and a one-day sample writing page. Check the 'sheet of paper' feeling is calm enough to write in.","Core: write, save, reopen the right day; a month calendar marking written days. Test a wrong password and a day with no entry.","Storage: wire Web Crypto encryption over all data; export/import the encrypted backup; rehearse the forgotten-password outcome.","Polish: per-entry word count, a focus writing mode, a gentle '5-day streak' note, a soft dark theme."],
 x:"Say it up front: a forgotten password means the journal is gone forever — make the user (including yourself) export an encrypted backup right after the first week. Pitfall two: encrypting entries individually leaks metadata (which days, how long) — one encrypted blob is the safer choice at this scale. Upgrades: a mood tag per day with a monthly mood chart, visible only after unlocking."}},

{n:11,g:"B",d:"mid",tech:"localStorage · list merging",
 vi:{t:"Kế hoạch bữa ăn + đi chợ",p:"Câu hỏi 'tối nay ăn gì' và cảnh đứng giữa chợ quên mất cần mua gì là hai nỗi phiền kinh điển của mọi gia đình. Một bảng kế hoạch bữa theo tuần, tự gộp nguyên liệu thành danh sách đi chợ, giải quyết cả hai trong một lần mở.",
 f:["Lên thực đơn 7 ngày × bữa (trưa/tối), chọn món từ kho món của gia đình","Mỗi món gắn sẵn nguyên liệu và định lượng cho số người ăn","Tự gộp nguyên liệu trùng giữa các món thành danh sách đi chợ duy nhất","Danh sách đi chợ dạng tích chọn, dùng ngay trên điện thoại ở chợ","Thêm món mới vào kho; xuất/nhập sao lưu kho món"],
 w:"Dữ liệu là danh sách món và thực đơn tuần — nhỏ, có cấu trúc rõ, hợp localStorage. Việc 'gộp nguyên liệu' là thuật toán cộng dồn đơn giản theo tên và đơn vị. Không cần chia sẻ thời gian thực: xuất danh sách đi chợ thành ảnh hoặc in ra giấy là đủ cho người đi chợ khác.",
 a:"Ba màn hình: Kho món (món + nguyên liệu), Bảng tuần (lưới 7 ngày × 2 bữa, chọn món từ kho), Danh sách chợ (kết quả gộp, tích chọn khi mua). Định lượng chuẩn hoá theo 'khẩu phần' và nhân theo số người ăn khai báo.",
 ai:["Khung: lưới tuần tĩnh và kho món mẫu 5 món. Kiểm tra lưới tuần trên điện thoại có chật không.","Cốt lõi: chọn món vào ô ngày/bữa; gộp nguyên liệu ra danh sách chợ đúng số lượng. Kiểm thử hai món dùng chung một nguyên liệu khác định lượng.","Lưu trữ: lưu kho món và thực đơn tuần vào localStorage; Xuất/Nhập để mang kho món sang máy khác.","Đánh bóng: tích chọn khi đi chợ, nút 'tuần mẫu' áp một thực đơn có sẵn, in danh sách chợ, gợi ý món lâu chưa ăn."],
 x:"Cạm bẫy: đơn vị không thống nhất (gram vs quả vs bó) làm phép gộp vô nghĩa — hãy chuẩn hoá đơn vị ngay trong kho món. Cạm bẫy hai: định lượng theo người ăn thay đổi mà quên nhân. Nâng cấp: đánh dấu nguyên liệu còn sẵn ở nhà để trừ khỏi danh sách chợ, ước tính chi phí theo giá tham khảo bạn tự nhập."},
 en:{t:"Meal planner + shopping list",p:"'What are we eating tonight?' and standing in the market having forgotten half the list are two classic household annoyances. A weekly meal board that automatically merges ingredients into one shopping list solves both in a single open.",
 f:["Plan 7 days × meals (lunch/dinner), picking dishes from the family dish library","Each dish carries its ingredients and quantities per serving","Auto-merge duplicate ingredients across dishes into one shopping list","A tick-off shopping list, usable on the phone right in the market","Add new dishes to the library; export/import backup of the library"],
 w:"The data — a dish list and a weekly plan — is small and well-structured, a natural fit for localStorage. 'Merging ingredients' is simple addition by name and unit. No real-time sharing needed: export the shopping list as an image or print it for whoever does the shopping.",
 a:"Three screens: Dish library (dish + ingredients), Week board (7 days × 2 meals grid, pick from the library), Shopping list (the merged result, ticked off while buying). Quantities are normalised per serving and multiplied by the declared number of eaters.",
 ai:["Frame: a static week grid and a 5-dish sample library. Check the week grid isn't cramped on a phone.","Core: place dishes into day/meal cells; merge ingredients into the shopping list with correct quantities. Test two dishes sharing one ingredient at different amounts.","Storage: save library and weekly plan to localStorage; Export/Import to carry the library to another machine.","Polish: tick-off shopping mode, a 'template week' button applying a saved menu, printable shopping list, 'not eaten in a while' dish suggestions."],
 x:"Pitfall: inconsistent units (grams vs pieces vs bunches) make merging meaningless — normalise units inside the dish library. Pitfall two: quantities per eater changing without the multiplier being applied. Upgrades: mark ingredients already at home to subtract them from the list, cost estimates from prices you enter yourself."}},

{n:12,g:"B",d:"mid",tech:"Canvas line charts · localStorage",
 vi:{t:"Theo dõi sức khoẻ cá nhân",p:"Cân nặng, huyết áp, giờ ngủ, số bước chân — những con số sức khoẻ ghi rải rác trong sổ tay, app đồng hồ và trí nhớ thì không bao giờ thành xu hướng để nhìn. Một bảng theo dõi đơn giản, tự vẽ đường xu hướng, giúp bạn (và bác sĩ của bạn) thấy điều mà từng con số riêng lẻ không nói được.",
 f:["Ghi nhanh các chỉ số theo ngày: cân nặng, huyết áp, nhịp tim, giờ ngủ… (chọn chỉ số bạn cần)","Biểu đồ đường theo thời gian cho từng chỉ số, chọn khoảng 7/30/90 ngày","Đánh dấu sự kiện lên biểu đồ: bắt đầu tập, đổi thuốc, ốm","Xuất bảng số liệu CSV để mang đi khám hoặc tự phân tích","Dữ liệu chỉ nằm trên máy; xuất/nhập sao lưu"],
 w:"Số liệu là chuỗi thời gian đơn giản, lượng nhỏ — localStorage thừa sức cho nhiều năm ghi chép một người. Biểu đồ đường là việc cơ bản của Canvas. Tính riêng tư của dữ liệu sức khoẻ làm cho kiến trúc một-file, không-máy-chủ trở thành ưu điểm thật sự.",
 a:"Mỗi bản ghi là {ngày, loại chỉ số, giá trị}. Màn hình chính: bộ chọn chỉ số + biểu đồ đường; form ghi nhanh ở dưới. Sự kiện là danh sách riêng {ngày, nhãn} được vẽ thành các vạch đứng trên cùng biểu đồ. Mọi tổng hợp tính lại từ dữ liệu thô mỗi lần hiển thị.",
 ai:["Khung: biểu đồ đường tĩnh với dữ liệu cân nặng mẫu 30 ngày và form ghi nhanh. Kiểm tra trục thời gian có dễ đọc không.","Cốt lõi: ghi số mới thì biểu đồ cập nhật đúng; đổi khoảng ngày và đổi chỉ số. Kiểm thử ngày ghi hai lần và ngày bỏ trống.","Lưu trữ: lưu toàn bộ bản ghi vào localStorage; xuất CSV và mở thử bằng Excel; Xuất/Nhập sao lưu đầy đủ.","Đánh bóng: vạch sự kiện trên biểu đồ, đường trung bình động, khoảng tham chiếu bạn tự đặt cho từng chỉ số."],
 x:"Cạm bẫy về trách nhiệm: công cụ theo dõi không phải thiết bị y tế — hãy ghi rõ trong giao diện 'chỉ để theo dõi cá nhân, không thay thế chẩn đoán'. Cạm bẫy dữ liệu: ghi trùng hai bản ghi một ngày làm biểu đồ nhảy loạn; chốt quy tắc 'bản ghi sau ghi đè bản ghi trước cùng ngày'. Nâng cấp: nhắc ghi số vào giờ cố định bằng màn hình tổng kết khi mở app, chia sẻ biểu đồ dạng ảnh cho bác sĩ."},
 en:{t:"Personal health tracker",p:"Weight, blood pressure, sleep hours, step counts — health numbers scattered across notebooks, watch apps and memory never become a visible trend. A simple tracker that draws its own trend lines helps you (and your doctor) see what individual numbers never say.",
 f:["Quickly log daily metrics: weight, blood pressure, heart rate, sleep… (choose the ones you need)","A time-series line chart per metric, with 7/30/90-day ranges","Annotate events onto the chart: started training, changed medication, was ill","Export the data table as CSV to take to appointments or analyse yourself","Data lives only on the machine; export/import backup"],
 w:"The data is a simple, small time series — localStorage easily covers years of one person's logging. Line charts are basic Canvas work. The privacy of health data makes the one-file, no-server architecture a genuine advantage.",
 a:"Each record is {date, metric type, value}. Main screen: a metric picker plus the line chart, with the quick-entry form below. Events are a separate list {date, label} drawn as vertical markers on the same chart. All summaries recompute from the raw data on every display.",
 ai:["Frame: a static line chart with 30 days of sample weight data and the quick-entry form. Check the time axis is readable.","Core: logging a new value updates the chart correctly; switch ranges and metrics. Test a day logged twice and skipped days.","Storage: save all records to localStorage; export CSV and open it in Excel to verify; full Export/Import backup.","Polish: event markers on the chart, a moving-average line, per-metric reference ranges you set yourself."],
 x:"The responsibility pitfall: a tracker is not a medical device — state plainly in the UI 'for personal tracking only, not a substitute for diagnosis'. The data pitfall: two records on one day make charts jump erratically; settle the rule 'the later record overwrites the earlier one for that day'. Upgrades: a fixed-time logging nudge via the opening summary screen, sharing the chart as an image for your doctor."}},

{n:13,g:"B",d:"easy",tech:"localStorage · date math",
 vi:{t:"Đếm ngược sự kiện & kỷ niệm",p:"Sinh nhật mẹ, kỷ niệm ngày cưới, hạn nộp hồ sơ, chuyến đi mơ ước — những mốc dễ quên nhất lại là những mốc đáng nhớ nhất. Một trang đếm ngược đẹp, mở lên là thấy 'còn 23 ngày', biến việc nhớ thành việc không cần nhớ.",
 f:["Thêm sự kiện: tên, ngày, loại (sinh nhật / kỷ niệm / hạn chót / chuyến đi)","Thẻ đếm ngược lớn: còn bao nhiêu ngày, sự kiện nào gần nhất lên đầu","Sự kiện lặp hằng năm tự lăn sang năm sau sau khi qua ngày","Đánh dấu sự kiện đã qua vào mục lưu trữ kỷ niệm","Lưu trên máy; xuất/nhập sao lưu danh sách sự kiện"],
 w:"Toàn bộ bài toán là phép trừ ngày tháng — nhẹ nhất trong các năng lực trình duyệt. Dữ liệu là vài chục sự kiện dạng chữ, localStorage là quá đủ. Không cần thông báo đẩy vì giá trị của công cụ nằm ở khoảnh khắc mở lên ngắm, và có thể đặt nó làm trang chủ trình duyệt.",
 a:"Danh sách sự kiện được sắp xếp lại theo số ngày còn lại mỗi lần mở. Mỗi sự kiện {tên, ngày gốc, lặp hằng năm hay không, loại}. Với sự kiện lặp, ngày hiệu lực được tính lăn tới lần kế tiếp chưa qua. Thẻ gần nhất hiển thị cỡ lớn ở đầu trang.",
 ai:["Khung: một thẻ đếm ngược lớn và danh sách sự kiện mẫu. Kiểm tra thẻ chính có đủ 'đã' trên màn hình điện thoại.","Cốt lõi: thêm sự kiện thì thứ tự sắp xếp và số ngày đúng, kể cả sự kiện hôm nay và sự kiện đã qua hôm qua.","Lưu trữ: lưu danh sách vào localStorage; sự kiện lặp tự lăn năm khi mở lại sau ngày sự kiện.","Đánh bóng: màu theo loại sự kiện, đếm ngược chi tiết tới giờ cho sự kiện trong 48 giờ tới, nền ảnh nhẹ cho thẻ chính."],
 x:"Cạm bẫy ngày tháng kinh điển: múi giờ làm 'hôm nay' lệch một ngày nếu tính bằng mốc 0 giờ UTC — hãy tính theo ngày địa phương và kiểm thử vào buổi tối muộn. Cạm bẫy hai: năm nhuận với sinh nhật 29/2; chốt quy tắc hiển thị (28/2 hay 1/3) và nói rõ trong giao diện. Nâng cấp: xuất các sự kiện ra file .ics để đưa vào lịch điện thoại — đó mới là nơi nhắc nhở thật sự sống."},
 en:{t:"Event & anniversary countdown",p:"Mother's birthday, the wedding anniversary, the application deadline, the dream trip — the easiest dates to forget are the ones most worth remembering. A beautiful countdown page that opens with '23 days to go' turns remembering into something you don't have to do.",
 f:["Add events: name, date, type (birthday / anniversary / deadline / trip)","Large countdown cards: days remaining, nearest event first","Yearly recurring events roll automatically into next year","Past events move into a memories archive","Stored on the machine; export/import backup of the event list"],
 w:"The whole problem is date subtraction — the lightest of browser capabilities. Data is a few dozen text events; localStorage is more than enough. No push notifications needed: the tool's value is in the moment you open and look at it, and it can be set as the browser's homepage.",
 a:"The event list re-sorts by days remaining on every open. Each event is {name, original date, yearly-or-not, type}. For recurring events, the effective date rolls forward to the next occurrence not yet passed. The nearest card displays extra large at the top.",
 ai:["Frame: one large countdown card and a sample event list. Check the hero card feels satisfying on a phone screen.","Core: adding an event yields correct ordering and day counts, including an event today and one that passed yesterday.","Storage: save the list to localStorage; recurring events roll their year when reopened after the date.","Polish: colours per event type, hour-level countdown for events within 48 hours, a light photo background for the hero card."],
 x:"The classic date pitfall: time zones shift 'today' by a day if computed from UTC midnight — compute in local dates and test late in the evening. Pitfall two: leap-year birthdays on 29 Feb; settle the display rule (28 Feb or 1 Mar) and state it in the UI. Upgrade: export events to an .ics file for the phone calendar — where real reminders live."}},

{n:14,g:"B",d:"mid",tech:"localStorage · import/export",
 vi:{t:"Danh bạ / CRM cá nhân",p:"Mạng lưới quan hệ cá nhân — đối tác cũ, bạn học, nhà cung cấp từng cứu bạn một lần — thường nằm trong trí nhớ và danh bạ điện thoại trần trụi: có số nhưng không có ngữ cảnh 'người này là ai, lần cuối nói chuyện khi nào, đã hứa gì'. Một CRM cá nhân nhẹ bổ sung đúng lớp ngữ cảnh đó.",
 f:["Thêm liên hệ: tên, vai trò/công ty, điện thoại, email, nhóm quan hệ","Ghi chú ngữ cảnh: quen qua đâu, lần cuối liên lạc, việc đã hứa","Nhắc 'đã lâu chưa liên lạc' cho các liên hệ được ghim quan trọng","Tìm kiếm theo tên, công ty, thẻ; lọc theo nhóm","Xuất/nhập danh bạ (JSON/CSV) để sao lưu và chuyển máy"],
 w:"Dữ liệu là vài trăm liên hệ có cấu trúc đơn giản, hoàn toàn cá nhân — localStorage và kiến trúc không-máy-chủ là lựa chọn đúng về riêng tư. Việc nhập/xuất CSV giúp đi lại với các công cụ khác mà không cần tích hợp phức tạp.",
 a:"Mẫu 'danh sách + chi tiết': cột trái là danh sách liên hệ có ô tìm kiếm, bên phải là chi tiết người đang chọn để xem/sửa. Nhắc liên lạc là một trường suy ra: hôm nay trừ ngày liên lạc cuối, so với chu kỳ bạn đặt cho từng nhóm.",
 ai:["Khung: hai cột danh sách/chi tiết với 5 liên hệ mẫu. Kiểm tra trên điện thoại: danh sách và chi tiết chuyển nhau ra sao.","Cốt lõi: thêm/sửa/tìm kiếm liên hệ; ghi nhận liên lạc mới thì bộ đếm 'ngày chưa liên lạc' đặt lại đúng.","Lưu trữ: lưu vào localStorage; nhập CSV danh bạ có sẵn của bạn để kiểm thử dữ liệu thật; Xuất/Nhập sao lưu.","Đánh bóng: ghim quan trọng, lọc 'quá hạn liên lạc', sinh nhật sắp tới trong 30 ngày, chạm để gọi trên điện thoại."],
 x:"Cạm bẫy: tham biến CRM cá nhân thành phần mềm bán hàng — càng nhiều trường càng ít cập nhật; giữ tối đa khoảng 8 trường cốt lõi. Cạm bẫy riêng tư: danh bạ là dữ liệu nhạy cảm về người khác, đừng đưa công cụ chứa dữ liệu thật lên host công khai. Nâng cấp: nhập danh bạ từ file vCard của điện thoại, ghi nhanh biên bản sau mỗi cuộc gọi."},
 en:{t:"Personal contacts / CRM",p:"Your personal network — former partners, classmates, the supplier who once saved you — usually lives in memory and a bare phone address book: numbers without the context of 'who is this, when did we last talk, what did I promise'. A light personal CRM adds exactly that context layer.",
 f:["Add contacts: name, role/company, phone, email, relationship group","Context notes: how you met, last contact, promises made","'Long time no contact' nudges for pinned-important contacts","Search by name, company, tag; filter by group","Export/import the address book (JSON/CSV) for backup and machine moves"],
 w:"The data is a few hundred simply-structured contacts, entirely personal — localStorage and a no-server architecture are the right call for privacy. CSV import/export lets it travel to other tools without complex integration.",
 a:"The 'list + detail' pattern: the left column is the contact list with a search box; the right shows the selected person's details for viewing/editing. The contact reminder is a derived value: today minus last-contact date, compared against the cycle you set per group.",
 ai:["Frame: two columns, list/detail, with 5 sample contacts. On a phone, check how list and detail switch.","Core: add/edit/search contacts; logging a new contact resets the 'days since contact' counter correctly.","Storage: save to localStorage; import your real CSV address book to test with genuine data; Export/Import backup.","Polish: pinned-important contacts, an 'overdue for contact' filter, birthdays within 30 days, tap-to-call on phones."],
 x:"Pitfall: trying to turn a personal CRM into sales software — the more fields, the less you'll update it; cap it at about 8 core fields. The privacy pitfall: an address book is sensitive data about other people — never put a tool containing real data on a public host. Upgrades: import contacts from the phone's vCard file, quick call notes after each conversation."}},

{n:15,g:"B",d:"easy",tech:"localStorage · day grid",
 vi:{t:"Theo dõi thói quen (streak)",p:"Thói quen tốt chết vì một lý do đơn giản: chuỗi ngày liên tiếp bị đứt mà không ai nhìn thấy nó đang dài lên. Tâm lý 'đừng phá chuỗi' là động lực rẻ và mạnh — một lưới ngày xinh xắn, tích mỗi ngày làm được, biến động lực đó thành thứ nhìn thấy được.",
 f:["Tạo thói quen: tên, mục tiêu số ngày mỗi tuần","Lưới tháng: chạm vào ô ngày để đánh dấu đã làm","Chuỗi hiện tại (streak) và chuỗi dài nhất hiển thị nổi bật","Nhiều thói quen trên cùng một lưới tổng quan","Nhắc nhẹ khi mở vào buổi tối mà hôm nay chưa tích; xuất/nhập sao lưu"],
 w:"Dữ liệu chỉ là tập hợp các ngày đã tích cho từng thói quen — nhỏ tới mức localStorage giữ nhiều năm không đáng kể. Lưới tháng là HTML/CSS thuần, không cần đồ hoạ phức tạp. Giá trị nằm ở tâm lý học, không nằm ở công nghệ.",
 a:"Mỗi thói quen {tên, màu, mục tiêu tuần}; mỗi lần tích là một mục {thói quen, ngày}. Streak tính bằng cách đếm ngược từ hôm nay qua các ngày liên tiếp có tích (theo quy tắc bạn chọn cho ngày nghỉ). Màn hình chính là lưới tháng của tháng hiện tại kèm dải tổng quan các thói quen.",
 ai:["Khung: lưới tháng tĩnh và hai thói quen mẫu. Kiểm tra ô ngày có đủ lớn để chạm trên điện thoại không.","Cốt lõi: chạm để tích/bỏ tích, streak tính đúng qua ranh giới tuần và tháng. Kiểm thử tích hôm nay, bỏ hôm qua.","Lưu trữ: lưu vào localStorage, chuyển tháng xem lại lịch sử; Xuất/Nhập sao lưu.","Đánh bóng: màu riêng mỗi thói quen, huy hiệu mốc 7/30/100 ngày, chế độ 'ngày nghỉ hợp lệ' không phá chuỗi."],
 x:"Cạm bẫy tâm lý: công cụ trừng phạt quá tay khi đứt chuỗi sẽ bị bỏ ngay — hãy thiết kế khoảnh khắc đứt chuỗi thật nhẹ nhàng ('bắt đầu chuỗi mới hôm nay?'). Cạm bẫy kỹ thuật: tính streak qua biên tháng và múi giờ; tính theo ngày địa phương. Nâng cấp: thống kê tỉ lệ hoàn thành theo tháng, đặt thói quen 'cặp' (làm A thì tích luôn B)."},
 en:{t:"Habit tracker (streaks)",p:"Good habits die for one simple reason: the streak breaks invisibly, before anyone notices how long it had grown. The 'don't break the chain' psychology is cheap, powerful motivation — a neat day grid you tick each day turns that motivation into something visible.",
 f:["Create habits: name, target days per week","Month grid: tap a day cell to mark it done","Current streak and longest streak displayed prominently","Multiple habits on one overview grid","A gentle evening nudge when today isn't ticked yet; export/import backup"],
 w:"The data is just the set of ticked days per habit — so small that localStorage holds years of it trivially. The month grid is plain HTML/CSS, no fancy graphics needed. The value is in the psychology, not the technology.",
 a:"Each habit is {name, colour, weekly target}; each tick is a record {habit, date}. The streak counts backwards from today through consecutive ticked days (under the rest-day rule you choose). The main screen is the current month grid plus a habits overview strip.",
 ai:["Frame: a static month grid and two sample habits. Check day cells are big enough to tap on a phone.","Core: tap to tick/untick; streaks compute correctly across week and month boundaries. Test ticking today, skipping yesterday.","Storage: save to localStorage; browse past months; Export/Import backup.","Polish: a colour per habit, 7/30/100-day milestone badges, a 'legit rest day' mode that doesn't break the chain."],
 x:"The psychology pitfall: a tool that punishes a broken streak too harshly gets abandoned immediately — design the broken-streak moment gently ('start a new chain today?'). The technical pitfall: streak maths across month boundaries and time zones; compute in local dates. Upgrades: monthly completion-rate stats, 'paired' habits (doing A also ticks B)."}},

{n:16,g:"B",d:"mid",tech:"localStorage / IndexedDB · images",
 vi:{t:"Tủ sưu tập cá nhân",p:"Người sưu tập — tem, sách, mô hình, đĩa nhạc, cây cảnh — thường quản lý bộ sưu tập bằng trí nhớ và vài tấm ảnh rời trong điện thoại: không biết mình có tổng cộng bao nhiêu món, món nào mua khi nào, giá bao nhiêu. Một 'tủ' số gọn gàng biến thú vui thành một bộ hồ sơ đáng ngắm.",
 f:["Thêm món: tên, ảnh, nhóm, năm/giá mua, tình trạng, ghi chú","Xem dạng lưới ảnh để ngắm, hoặc dạng danh sách để tra cứu","Tìm kiếm và lọc theo nhóm, theo tình trạng","Thống kê nhẹ: tổng số món, tổng giá trị ước tính, món mới nhất","Sao lưu kèm ảnh ra file; nhập lại đầy đủ trên máy khác"],
 w:"Phần chữ của bộ sưu tập rất nhỏ; phần nặng là ảnh. Thu nhỏ ảnh ngay khi nạp (vẽ qua Canvas về kích thước vừa phải) rồi lưu vào IndexedDB là công thức đúng: đủ nét để ngắm và tra cứu, không phình tới mức phá vỡ giới hạn lưu trữ.",
 a:"Mẫu 'danh sách + chi tiết' với lưới ảnh làm mặt tiền. Mỗi món {tên, ảnh đã thu nhỏ dạng blob, nhóm, năm, giá, tình trạng, ghi chú}. Khi người dùng chọn ảnh, công cụ vẽ nó qua Canvas về cạnh dài khoảng 800 px rồi mới lưu — bước này phải có ngay từ giai đoạn Cốt lõi.",
 ai:["Khung: lưới ảnh mẫu 6 món và trang chi tiết tĩnh. Kiểm tra lưới trên điện thoại: 2 cột có đẹp không.","Cốt lõi: thêm món kèm ảnh chụp thật; kiểm tra ảnh được thu nhỏ trước khi lưu bằng cách thử với ảnh 10 MB.","Lưu trữ: chuyển sang IndexedDB cho cả chữ và ảnh; xuất/nhập bản sao lưu kèm ảnh và qua phép thử chuyển máy.","Đánh bóng: lọc theo nhóm, sắp xếp theo năm/giá, chế độ trình chiếu toàn màn hình để 'ngắm tủ'."],
 x:"Cạm bẫy chí mạng: lưu ảnh nguyên bản vào localStorage — vài tấm ảnh điện thoại là tràn 5 MB và mất dữ liệu âm thầm. Thu nhỏ ảnh + IndexedDB là điều kiện bắt buộc, không phải nâng cấp. Cạm bẫy hai: quên sao lưu kèm ảnh, tới khi đổi máy chỉ còn phần chữ. Nâng cấp: gắn mã QR cho từng món đồ thật, ghi lịch sử 'đã từng sở hữu' cho món đã bán/tặng."},
 en:{t:"Personal collection cabinet",p:"Collectors — stamps, books, models, records, plants — usually manage their collection from memory plus scattered photos on the phone: no idea how many items they own, when each was bought, or for how much. A tidy digital 'cabinet' turns the hobby into a browsable archive.",
 f:["Add items: name, photo, category, year/purchase price, condition, notes","Browse as a photo grid for pleasure, or a list for lookup","Search and filter by category and condition","Light stats: total items, estimated total value, newest item","Back up including photos to a file; restore fully on another machine"],
 w:"The text side of a collection is tiny; the heavy side is photos. Shrinking each photo on import (drawn through Canvas to a modest size) and storing in IndexedDB is the right formula: sharp enough to enjoy and search, without ballooning past storage limits.",
 a:"The 'list + detail' pattern with a photo grid as the storefront. Each item is {name, shrunken photo blob, category, year, price, condition, notes}. When the user picks a photo, the tool draws it through Canvas down to roughly 800 px on the long edge before saving — this step belongs in the Core stage, not later.",
 ai:["Frame: a 6-item sample photo grid and a static detail page. On a phone, check whether a 2-column grid looks good.","Core: add an item with a real photo; verify the photo is shrunk before saving by testing with a 10 MB image.","Storage: move to IndexedDB for both text and photos; export/import a backup including photos and pass the machine-move test.","Polish: category filters, sorting by year/price, a fullscreen slideshow mode for 'admiring the cabinet'."],
 x:"The fatal pitfall: storing original photos in localStorage — a few phone photos overflow 5 MB and data vanishes silently. Photo shrinking + IndexedDB is mandatory, not an upgrade. Pitfall two: backups that forget the photos, leaving only text after a machine move. Upgrades: a QR code per physical item, a 'previously owned' history for items sold or gifted."}}
];

{n:17,g:"C",d:"mid",tech:"localStorage · review schedule",
 vi:{t:"Flashcard lặp lại ngắt quãng",p:"Học từ vựng, thuật ngữ chuyên ngành hay mặt nạ mạng con (subnet) bằng cách đọc lại ngẫu nhiên thì quên nhanh theo đúng đường cong lãng quên. Phương pháp lặp lại ngắt quãng — ôn lại đúng lúc sắp quên, giãn dần theo mức nhớ — là cách học có bằng chứng mạnh nhất, và một bộ flashcard tự xếp lịch ôn là đủ để áp dụng nó.",
 f:["Tạo bộ thẻ: mặt trước (câu hỏi) / mặt sau (đáp án), gắn bộ môn","Học theo phiên: xem thẻ, tự chấm 'nhớ / mơ hồ / quên', thẻ được xếp lịch ôn lại theo mức","Hàng đợi hôm nay: chỉ hiện những thẻ đến hạn ôn","Thống kê: số thẻ đã thuộc, thẻ đến hạn ngày mai, chuỗi ngày học","Nhập bộ thẻ từ file CSV/JSON; xuất/nhập sao lưu"],
 w:"Thuật toán lặp ngắt quãng ở mức cá nhân chỉ là vài phép tính ngày tháng trên mỗi thẻ: mức nhớ + ngày ôn kế tiếp. Dữ liệu là chữ thuần, vài nghìn thẻ vẫn nhẹ với localStorage. Không cần tài khoản hay đồng bộ — lịch học là việc của một người.",
 a:"Mỗi thẻ {trước, sau, mức hộp (1–5), ngày ôn kế tiếp}. Phiên học lấy các thẻ có ngày ôn ≤ hôm nay; trả lời 'quên' đưa thẻ về hộp 1 (ôn ngày mai), trả lời 'nhớ' nâng hộp và giãn ngày theo cấp số (1, 2, 4, 7, 15 ngày…). Màn hình học từng thẻ một, lật thẻ bằng chạm/bấm.",
 ai:["Khung: màn hình học một thẻ mẫu với nút lật và ba nút chấm. Kiểm tra thẻ lật có mượt và chữ đủ to không.","Cốt lõi: chấm mức thì ngày ôn kế tiếp thay đổi đúng quy tắc hộp; hàng đợi hôm nay lọc đúng thẻ đến hạn. Kiểm thử bằng cách giả lập đổi ngày.","Lưu trữ: lưu bộ thẻ và tiến độ vào localStorage; nhập bộ thẻ từ CSV; Xuất/Nhập sao lưu.","Đánh bóng: thống kê chuỗi ngày học, chế độ chỉ ôn thẻ 'quên' nhiều lần, trộn thứ tự trong phiên, giao diện tối."],
 x:"Cạm bẫy: tự chấm quá dễ dãi làm lịch ôn giãn nhanh giả tạo — hãy để nút 'mơ hồ' là lựa chọn trung thực mặc định ở giữa. Cạm bẫy hai: tạo bộ thẻ khổng lồ rồi không học; công cụ nên giới hạn thẻ mới mỗi ngày (ví dụ 20) để hàng đợi không phát nổ. Nâng cấp: thẻ có ảnh và âm thanh phát âm, chia sẻ bộ thẻ qua file cho lớp học."},
 en:{t:"Spaced-repetition flashcards",p:"Learning vocabulary, technical terminology or subnet masks by random re-reading means forgetting right on schedule with the forgetting curve. Spaced repetition — reviewing just before you'd forget, with intervals growing by recall strength — is the best-evidenced study method there is, and a flashcard deck that schedules its own reviews is all it takes to apply it.",
 f:["Create decks: front (question) / back (answer), tagged by subject","Study sessions: view a card, self-grade 'remember / fuzzy / forgot'; the card is rescheduled by grade","Today's queue: only cards due for review appear","Stats: mastered cards, cards due tomorrow, study-day streak","Import decks from CSV/JSON files; export/import backup"],
 w:"A personal spaced-repetition algorithm is just a few date calculations per card: memory level + next review date. Data is plain text; a few thousand cards stay light in localStorage. No account or sync needed — a study schedule belongs to one person.",
 a:"Each card is {front, back, box level (1–5), next review date}. A session takes cards due today or earlier; 'forgot' returns the card to box 1 (review tomorrow), 'remember' raises the box and stretches the interval (1, 2, 4, 7, 15 days…). The study screen shows one card at a time, flipped by tap/click.",
 ai:["Frame: a study screen with one sample card, a flip button and three grading buttons. Check the flip is smooth and text is big enough.","Core: grading changes the next review date by the box rules; today's queue filters due cards correctly. Test by simulating date changes.","Storage: save decks and progress to localStorage; import a deck from CSV; Export/Import backup.","Polish: study-streak stats, a mode reviewing only repeatedly-forgotten cards, shuffled session order, dark theme."],
 x:"Pitfall: grading too generously stretches intervals on false confidence — make 'fuzzy' the honest default middle option. Pitfall two: creating a giant deck and never studying; cap new cards per day (e.g. 20) so the queue never explodes. Upgrades: cards with images and pronunciation audio, sharing decks by file for a class."}},

{n:18,g:"C",d:"mid",tech:"localStorage · JSON import",
 vi:{t:"Trình tạo & làm quiz",p:"Giáo viên và phụ huynh cần quiz nhanh cho lớp hoặc cho con, nhưng các nền tảng quiz trực tuyến đòi tài khoản, quảng cáo, và học sinh phải có mạng. Một trình quiz hai-trong-một — soạn đề ở một chế độ, làm bài ở chế độ khác, chấm điểm tại chỗ — chạy được cả khi mất mạng.",
 f:["Chế độ soạn: thêm câu hỏi trắc nghiệm (4 lựa chọn, một đáp án đúng) và lời giải thích","Nhập đề từ file JSON/CSV có sẵn; xuất đề ra file để chia sẻ","Chế độ làm bài: từng câu một hoặc cả trang, bấm nộp là chấm ngay","Trang kết quả: điểm, câu sai kèm giải thích, nút làm lại chỉ phần sai","Lưu các bộ đề trên máy; xuất/nhập sao lưu"],
 w:"Đề thi là dữ liệu có cấu trúc nhỏ; phần chấm điểm là phép so sánh đáp án thuần tuý. Hai chế độ soạn/làm là mẫu kinh điển của một file. Mọi thứ chạy offline, rất hợp lớp học vùng mạng yếu.",
 a:"Bộ đề là {tên, danh sách câu {hỏi, 4 lựa chọn, đáp án đúng, giải thích}}. Chế độ soạn là form theo danh sách; chế độ làm bài là một trạng thái phiên {đề, các đáp án đã chọn, đã nộp hay chưa}. Kết quả tính bằng cách đối chiếu đáp án khi nộp, không để lộ đáp án đúng trong lúc làm.",
 ai:["Khung: hai chế độ tĩnh — form soạn một câu và màn hình làm một câu. Kiểm tra nút chuyển chế độ có rõ ràng để học sinh không lạc vào chế độ soạn.","Cốt lõi: làm bài và chấm đúng, kể cả câu bỏ trống; trang kết quả chỉ rõ câu sai và giải thích. Kiểm thử bằng đáp án đúng kỳ vọng làm sẵn.","Lưu trữ: lưu nhiều bộ đề vào localStorage; nhập đề từ JSON và báo lỗi rõ nếu file sai định dạng.","Đánh bóng: trộn câu và trộn lựa chọn mỗi lần làm, đếm giờ làm bài, chế độ in đề ra giấy kèm đáp án riêng cho giáo viên."],
 x:"Cạm bẫy: đáp án đúng bị lộ qua thứ tự cố định (toàn câu A) — trộn lựa chọn là bắt buộc. Cạm bẫy hai: học sinh mở chế độ soạn xem đáp án — nếu dùng cho kiểm tra thật, hãy tách file 'chỉ làm bài' khi xuất bản (AI tạo được bản rút gọn không kèm đáp án trong giao diện). Nâng cấp: nhiều dạng câu (đúng/sai, điền khuyết), ngân hàng câu hỏi chọn ngẫu nhiên mỗi lần ra đề."},
 en:{t:"Quiz builder & player",p:"Teachers and parents need quick quizzes for a class or a child, but online quiz platforms demand accounts, show ads, and require students to be online. A two-in-one quiz tool — author in one mode, take in another, graded on the spot — works even when the network doesn't.",
 f:["Author mode: add multiple-choice questions (4 options, one correct) with explanations","Import question sets from existing JSON/CSV files; export sets to share","Player mode: one question at a time or a full page; instant grading on submit","Results page: score, wrong questions with explanations, retry-only-the-wrong button","Store question sets on the machine; export/import backup"],
 w:"An exam is small structured data; grading is a pure answer comparison. The author/play two-mode split is a classic one-file pattern. Everything runs offline — ideal for classrooms with weak networks.",
 a:"A set is {name, list of questions {question, 4 options, correct answer, explanation}}. Author mode is a list form; player mode is a session state {set, chosen answers, submitted or not}. Results compute by comparing answers at submit time — correct answers are never revealed during play.",
 ai:["Frame: two static modes — a one-question authoring form and a one-question player screen. Check the mode switch is clear enough that students can't wander into author mode.","Core: playing and grading work correctly, including unanswered questions; the results page shows wrong questions with explanations. Test against pre-computed expected answers.","Storage: save multiple sets to localStorage; import a set from JSON with a clear error if the file is malformed.","Polish: shuffle questions and options per attempt, a test timer, a printable paper version with a separate teacher answer key."],
 x:"Pitfall: correct answers leaking through fixed patterns (all option A) — shuffling options is mandatory. Pitfall two: students opening author mode to peek — for real tests, publish a separate 'player-only' file (the AI can generate a stripped build with no answers in the UI). Upgrades: more question types (true/false, fill-in), a question bank that samples randomly per test."}},

{n:19,g:"C",d:"mid",tech:"Canvas → PNG",
 vi:{t:"Bảng trắng vẽ tay",p:"Khi cần giải thích nhanh một ý — sơ đồ luồng, hình học cho con, bố cục mặt bằng — giấy trắng và bút là nhanh nhất, nhưng giấy thì không gửi qua chat được. Một bảng trắng số tối giản, vẽ bằng chuột/ngón tay và xuất ảnh PNG trong một chạm, giữ nguyên tốc độ của giấy mà chia sẻ được.",
 f:["Vẽ tự do bằng chuột hoặc ngón tay; chọn màu và cỡ nét","Tẩy từng phần, hoàn tác theo bước, xoá toàn bộ bảng","Nền trắng / nền lưới ô / nền chấm để vẽ kỹ thuật hoặc chữ viết","Xuất ảnh PNG gửi đi ngay; mở ảnh có sẵn làm nền để vẽ chú thích lên","Không cần lưu trữ dài hạn — bảng là công cụ tức thời"],
 w:"Canvas sinh ra để vẽ theo nét bút: bắt sự kiện chạm/di chuột và nối các điểm thành đường. Xuất PNG là năng lực có sẵn (toBlob). Không cần máy chủ hay lưu trữ vì bảng trắng là công cụ 'vẽ–gửi–xoá'.",
 a:"Một Canvas toàn màn hình; mỗi nét vẽ là một dãy điểm kèm màu/cỡ nét, lưu trong mảng để hoàn tác và vẽ lại khi đổi kích thước. Công cụ hiện tại (bút/tẩy) và màu là trạng thái UI đơn giản. Xuất ảnh = chụp chính Canvas đó ra PNG.",
 ai:["Khung: Canvas toàn màn hình với thanh công cụ tĩnh. Kiểm tra vẽ thử bằng ngón tay trên điện thoại có bị cuộn trang theo không.","Cốt lõi: vẽ mượt, tẩy đúng phần, hoàn tác theo nét. Kiểm thử vẽ nhanh, vẽ chậm, nhấc tay giữa nét.","Lưu trữ: (nhẹ) giữ bản vẽ hiện tại vào localStorage để lỡ đóng tab không mất; xuất PNG làm đường lưu chính.","Đánh bóng: nền lưới/chấm, vẽ hình cơ bản (đường thẳng, chữ nhật, mũi tên), dán ảnh nền để chú thích."],
 x:"Cạm bẫy kinh điển: Canvas mờ khi đổi kích thước cửa sổ hoặc trên màn hình retina — hãy nhân tỉ lệ pixel (devicePixelRatio) khi khởi tạo. Cạm bẫy hai: nét vẽ giật khi điểm quá thưa lúc di nhanh; cần nội suy điểm giữa. Nâng cấp: nhiều trang bảng, ghi lại quá trình vẽ thành ảnh động, nhận dạng nét thành hình học gọn gàng."},
 en:{t:"Freehand whiteboard",p:"When you need to explain something fast — a flow diagram, geometry for your kid, a floor layout — pen and paper are quickest, but paper can't be sent through a chat. A minimal digital whiteboard, drawn with mouse or finger and exported to PNG in one tap, keeps paper's speed while being shareable.",
 f:["Draw freehand with mouse or finger; pick colour and stroke size","Erase by region, undo step by step, clear the whole board","White / grid / dotted backgrounds for technical drawing or handwriting","Export a PNG to send immediately; open an existing image as a background to annotate","No long-term storage needed — the board is an instant tool"],
 w:"Canvas exists for pen strokes: capture pointer events and connect the points into lines. PNG export is built in (toBlob). No server or storage needed because a whiteboard is a 'draw–send–erase' tool.",
 a:"One fullscreen Canvas; each stroke is a sequence of points with colour/size, kept in an array for undo and for redrawing on resize. The current tool (pen/eraser) and colour are simple UI state. Exporting = capturing that very Canvas to PNG.",
 ai:["Frame: a fullscreen Canvas with a static toolbar. Test finger-drawing on a phone — the page must not scroll along.","Core: smooth drawing, accurate erasing, stroke-level undo. Test fast strokes, slow strokes, lifting the pen mid-stroke.","Storage: (light) keep the current drawing in localStorage so an accidental tab close loses nothing; PNG export is the main save path.","Polish: grid/dotted backgrounds, basic shapes (line, rectangle, arrow), pasting a background image to annotate."],
 x:"The classic pitfall: a blurry Canvas on resize or retina screens — scale by devicePixelRatio at initialisation. Pitfall two: jagged strokes when points get sparse during fast movement; interpolate midpoints. Upgrades: multiple board pages, replaying the drawing as an animation, snapping strokes into clean shapes."}},

{n:20,g:"C",d:"mid",tech:"Web Audio",
 vi:{t:"Máy gõ nhịp & phát nốt",p:"Người học nhạc cụ cần máy gõ nhịp (metronome) mỗi buổi tập, và thỉnh thoảng cần một nốt chuẩn để lên dây hoặc luyện hát. Các app metronome thường kèm quảng cáo và tính năng thừa. Một trang gõ nhịp chính xác, có chia nhịp con và phát nốt chuẩn, là đủ cho cả năm tập luyện.",
 f:["Đặt tốc độ BPM bằng thanh trượt, nút +/−, hoặc chạm theo nhịp (tap tempo)","Chọn số phách mỗi ô nhịp (2/3/4/6…) và nhấn phách đầu","Chia nhịp con: nốt đen, nốt móc đơn, bộ ba","Đèn nhịp nhấp nháy đồng bộ với tiếng gõ","Phát nốt chuẩn (A4 = 440 Hz và các nốt khác) để lên dây/luyện thanh"],
 w:"Web Audio lập lịch âm thanh theo đồng hồ phần cứng của trình duyệt, chính xác hơn nhiều so với hẹn giờ thông thường — đúng thứ metronome cần. Không cần file âm thanh: tiếng gõ được tổng hợp từ dao động ngắn.",
 a:"Cốt lõi là một bộ lập lịch: dùng đồng hồ của AudioContext để hẹn trước các phách, mỗi phách phát một 'click' tổng hợp (phách đầu cao hơn). Giao diện đọc BPM và mẫu nhịp từ trạng thái; đèn nhịp được đồng bộ từ cùng lịch phát đó, không tự chạy riêng.",
 ai:["Khung: màn hình BPM lớn, thanh trượt và các nút chọn mẫu nhịp tĩnh. Kiểm tra số BPM có là thứ to nhất trên màn hình không.","Cốt lõi: tiếng gõ đều và đúng BPM trong 2 phút liên tục — kiểm thử bằng cách đếm theo đồng hồ ngoài. Đây là giai đoạn không được làm ẩu.","Lưu trữ: lưu sẵn vài cấu hình (bài tập, tốc độ, mẫu nhịp) vào localStorage.","Đánh bóng: tap tempo, đèn nhịp, chế độ chỉ đèn không tiếng cho lớp học, phát nốt chuẩn."],
 x:"Cạm bẫy kỹ thuật trung tâm: dùng setInterval để gõ nhịp sẽ trôi nhịp theo thời gian vì hẹn giờ của trình duyệt không chính xác và bị ghìm ở tab nền — phải lập lịch bằng đồng hồ Web Audio và hẹn trước từng phách. Cạm bẫy hai: âm thanh bị chặn cho tới khi người dùng chạm vào trang; hãy khởi tạo AudioContext ngay trong thao tác bấm Bắt đầu. Nâng cấp: tăng tốc dần tự động cho luyện tập, lưu nhịp độ theo từng bài."},
 en:{t:"Metronome & tone player",p:"Instrument learners need a metronome every practice session, and occasionally a reference note for tuning or singing. Metronome apps usually bring ads and surplus features. One precise metronome page — with subdivisions and reference tones — is enough for a year of practice.",
 f:["Set BPM by slider, +/− buttons, or tapping the beat (tap tempo)","Choose beats per bar (2/3/4/6…) with an accented downbeat","Subdivisions: quarter, eighth, triplet","A beat light flashing in sync with the click","Play reference tones (A4 = 440 Hz and others) for tuning/vocal practice"],
 w:"Web Audio schedules sound on the browser's hardware clock, far more precisely than ordinary timers — exactly what a metronome needs. No audio files required: the click is synthesised from a short oscillation.",
 a:"The core is a scheduler: use the AudioContext clock to book beats ahead of time, each beat playing a synthesised click (the downbeat pitched higher). The UI reads BPM and pattern from state; the beat light is driven by that same schedule, never free-running on its own.",
 ai:["Frame: a big BPM display, slider and pattern buttons, static. Check the BPM number is the largest thing on screen.","Core: the click stays even and on-BPM for 2 full minutes — verify against an external clock. This stage must not be rushed.","Storage: save a few presets (exercise, tempo, pattern) to localStorage.","Polish: tap tempo, the beat light, a silent-light-only mode for classrooms, reference tones."],
 x:"The central technical pitfall: using setInterval for beats drifts over time because browser timers are imprecise and throttled in background tabs — schedule with the Web Audio clock and book beats ahead. Pitfall two: audio is blocked until the user interacts; initialise the AudioContext inside the Start button's own handler. Upgrades: automatic gradual speed-up for practice, per-piece tempo memory."}},

{n:21,g:"C",d:"easy",tech:"localStorage",
 vi:{t:"Game luyện toán cho trẻ",p:"Trẻ tiểu học cần luyện tính nhẩm mỗi ngày một ít, nhưng bài tập giấy thì chán và chấm tay thì mệt phụ huynh. Một game toán nhỏ — câu hỏi vừa sức, tính giờ nhẹ nhàng, thưởng sao — biến 10 phút luyện tập thành thứ trẻ tự xin làm.",
 f:["Chọn phép tính: cộng, trừ, nhân, chia và khoảng số theo lớp của trẻ","Câu hỏi hiện từng câu, nhập đáp án, phản hồi đúng/sai tức thì","Tính sao và huy hiệu sau mỗi lượt 10 câu; âm thanh vui khi đúng","Bảng tiến bộ theo ngày cho phụ huynh xem","Độ khó tự tăng nhẹ khi trẻ trả lời đúng liên tiếp"],
 w:"Câu hỏi toán được sinh bằng vài phép ngẫu nhiên có kiểm soát — không cần ngân hàng câu hỏi hay mạng. Dữ liệu tiến bộ rất nhỏ. Giao diện lớn, ít chữ, nhiều màu là việc của HTML/CSS thuần.",
 a:"Một vòng lặp phiên đơn giản: sinh câu hỏi theo cấu hình {phép tính, khoảng số} → nhận đáp án → chấm → ghi kết quả phiên. Độ khó là một thang mà phiên leo lên/xuống theo tỉ lệ đúng gần đây. Tiến bộ lưu theo ngày cho màn hình phụ huynh.",
 ai:["Khung: màn hình câu hỏi mẫu với số thật to và bàn phím số trên màn hình. Kiểm tra bằng mắt trẻ con: một màn hình chỉ một việc.","Cốt lõi: sinh câu đúng khoảng số (chia phải chẵn ở mức dễ), chấm đúng, đếm sao đúng. Phụ huynh tự kiểm thử 30 câu liên tiếp để săn câu sai.","Lưu trữ: lưu tiến bộ theo ngày và cấu hình theo từng trẻ nếu nhà có hai bé.","Đánh bóng: âm thanh và hiệu ứng khi đúng, huy hiệu theo mốc, chế độ thi với anh/chị/em bằng lượt luân phiên."],
 x:"Cạm bẫy: phép chia sinh số lẻ kết quả thập phân gây ức chế cho trẻ lớp nhỏ — hãy sinh ngược từ đáp án nguyên. Cạm bẫy hai: game 'trừng phạt' khi sai (trừ điểm, âm thanh gắt) làm trẻ ghét toán; chỉ thưởng, không phạt. Nâng cấp: bài toán có lời văn ngắn do phụ huynh tự nhập, in phiếu bài tập từ cùng ngân hàng câu sinh được."},
 en:{t:"Math practice game for kids",p:"Primary-school children need a little mental-arithmetic practice daily, but paper exercises are boring and hand-marking tires parents out. A small math game — right-sized questions, gentle timing, star rewards — turns 10 minutes of practice into something kids ask for themselves.",
 f:["Choose operations: add, subtract, multiply, divide, and number ranges by the child's grade","Questions appear one at a time; type the answer; instant right/wrong feedback","Stars and badges after each 10-question round; cheerful sounds for correct answers","A per-day progress board for parents","Difficulty rises gently when the child answers correctly in a row"],
 w:"Math questions are generated by a few controlled random operations — no question bank or network needed. Progress data is tiny. A big, low-text, colourful interface is plain HTML/CSS work.",
 a:"A simple session loop: generate a question from the config {operation, number range} → accept the answer → grade → record the session result. Difficulty is a ladder the session climbs/descends by recent accuracy. Progress is stored per day for the parent screen.",
 ai:["Frame: a sample question screen with very large numbers and an on-screen keypad. Check with a child's eyes: one screen, one job.","Core: generate questions within range (division must come out even at easy levels), grade correctly, count stars correctly. Parents self-test 30 questions in a row hunting for a bad one.","Storage: save per-day progress and per-child configs if there are two kids.","Polish: sounds and effects for correct answers, milestone badges, a sibling turn-taking contest mode."],
 x:"Pitfall: division generating decimal answers frustrates young children — generate backwards from a whole-number answer. Pitfall two: games that 'punish' mistakes (minus points, harsh sounds) teach kids to hate math; reward only, never punish. Upgrades: short word problems parents type themselves, printable worksheets from the same question generator."}},

{n:22,g:"C",d:"hard",tech:"SVG / Canvas · drag & drop",
 vi:{t:"Sơ đồ tư duy (mind map)",p:"Khi một ý tưởng còn lộn xộn — kế hoạch dự án, dàn ý bài viết, kiến thức một chương học — danh sách gạch đầu dòng ép nó thành đường thẳng quá sớm. Sơ đồ tư duy cho phép tỏa nhánh tự do rồi mới sắp xếp. Các phần mềm mind map đầy đủ thì nặng; một bảng vẽ nhánh đơn giản, xuất được ảnh, là đủ cho đa số nhu cầu cá nhân.",
 f:["Nút trung tâm có sẵn; thêm nút con bằng phím tắt hoặc nút bấm","Kéo thả để đổi vị trí và đổi cha cho nút","Đổi tên, đổi màu nhánh, thu gọn/mở rộng một nhánh","Phóng to thu nhỏ và di chuyển khung nhìn (pan/zoom)","Xuất ảnh PNG của toàn bộ sơ đồ; lưu nhiều sơ đồ; xuất/nhập sao lưu"],
 w:"Mind map là một cây dữ liệu cộng với phép vẽ cây — SVG đặc biệt hợp vì mỗi nút là một phần tử có sẵn sự kiện bấm/kéo, nét chữ luôn sắc. Dữ liệu cây là JSON nhỏ, localStorage giữ nhiều sơ đồ dễ dàng.",
 a:"Dữ liệu: cây nút {id, chữ, màu, danh sách con, đang thu gọn?}. Bố cục: thuật toán cây đơn giản cấp phát không gian theo chiều ngang cho từng nhánh (hoặc để người dùng tự kéo vị trí và chỉ vẽ đường nối cong). Vẽ bằng SVG: đường nối là path cong, nút là nhóm gồm hình chữ nhật bo góc + chữ.",
 ai:["Khung: nút trung tâm và ba nút con tĩnh vẽ bằng SVG. Kiểm tra chữ trong nút không tràn ở cả hai ngôn ngữ.","Cốt lõi: thêm/xoá/đổi tên nút con; thu gọn nhánh. Kiểm thử cây 3 cấp với 20 nút xem bố cục có chồng lấn không.","Lưu trữ: lưu cây vào localStorage, nhiều sơ đồ; xuất/nhập file JSON của một sơ đồ.","Đánh bóng: kéo thả đổi cha, pan/zoom mượt, xuất PNG, phím tắt đầy đủ cho người dùng bàn phím."],
 x:"Cạm bẫy: tự động bố cục cây đẹp trong mọi trường hợp là bài toán khó thật sự — hãy chốt sớm một trong hai: bố cục tự động đơn giản, hoặc vị trí thủ công do người dùng kéo. Trộn cả hai nửa vời là nguồn lỗi lớn nhất của ý này. Cạm bẫy hai: chữ dài làm nút phình vô hạn; đặt bề rộng tối đa và cho chữ xuống dòng. Nâng cấp: xuất dàn ý dạng Markdown từ cây, nhiều bố cục (sơ đồ tổ chức, xương cá)."},
 en:{t:"Mind map",p:"When an idea is still messy — a project plan, an essay outline, a chapter's worth of knowledge — a bullet list forces it into a straight line too early. A mind map lets branches spread freely before you tidy them. Full mind-map software is heavy; a simple branch canvas that exports an image covers most personal needs.",
 f:["A central node is provided; add child nodes by shortcut or button","Drag to reposition nodes and to re-parent them","Rename, recolour branches, collapse/expand a branch","Zoom and pan the view","Export a PNG of the whole map; keep multiple maps; export/import backup"],
 w:"A mind map is a data tree plus tree drawing — SVG fits especially well because every node is an element with built-in click/drag events and text stays crisp. The tree data is small JSON; localStorage holds many maps easily.",
 a:"Data: a node tree {id, text, colour, children, collapsed?}. Layout: a simple tree algorithm allocating horizontal space per branch (or let users drag positions manually and only draw the curved connectors). Rendering in SVG: connectors are curved paths, nodes are a group of rounded rectangle + text.",
 ai:["Frame: a central node and three static child nodes in SVG. Check node text doesn't overflow in either language.","Core: add/delete/rename child nodes; collapse branches. Test a 3-level, 20-node tree for layout overlaps.","Storage: save trees to localStorage, multiple maps; export/import one map as JSON.","Polish: drag-to-reparent, smooth pan/zoom, PNG export, full keyboard shortcuts."],
 x:"Pitfall: a beautiful automatic tree layout for every case is a genuinely hard problem — decide early between a simple auto-layout or fully manual positions. A half-hearted mix of both is this idea's biggest bug source. Pitfall two: long text inflating nodes endlessly; cap node width and wrap text. Upgrades: export an outline as Markdown from the tree, multiple layouts (org chart, fishbone)."}},

{n:23,g:"C",d:"easy",tech:"timer · Web Audio",
 vi:{t:"Đồng hồ luyện tập theo hiệp",p:"Người tập thể dục theo hiệp (HIIT, tabata, tập vòng tròn) và cả người luyện nhạc theo phiên cần một đồng hồ biết tự chuyển giai đoạn: tập 40 giây, nghỉ 20 giây, 8 hiệp — kèm tiếng báo để khỏi phải nhìn màn hình. App thể thao đầy đủ thì thừa; một đồng hồ hiệp cấu hình được là đúng nhu cầu.",
 f:["Cấu hình: thời gian tập, thời gian nghỉ, số hiệp, thời gian chuẩn bị","Màn hình đếm ngược thật to, đổi màu theo giai đoạn tập/nghỉ","Tiếng bíp đếm 3 giây cuối và chuông chuyển giai đoạn","Tổng thời gian buổi tập hiển thị trước khi bắt đầu; tạm dừng/tiếp tục","Lưu sẵn vài bài tập cấu hình khác nhau"],
 w:"Giống Ý 2, đây là bài toán đếm thời gian + âm thanh tổng hợp — trình duyệt làm tốt cả hai, và tính thời gian từ mốc bắt đầu thật giúp đồng hồ không trôi khi tab bị ghìm. Không dữ liệu nào cần rời máy.",
 a:"Máy trạng thái theo giai đoạn: Chuẩn bị → (Tập → Nghỉ) × số hiệp → Xong. Mỗi giai đoạn có mốc kết thúc tuyệt đối suy từ thời điểm bắt đầu; vòng hiển thị chỉ đọc thời gian còn lại từ đồng hồ thật. Âm thanh phát tại các mốc cố định trong lịch giai đoạn.",
 ai:["Khung: màn hình đếm ngược to với hai màu giai đoạn và form cấu hình tĩnh. Kiểm tra từ khoảng cách 3 mét có đọc được số không.","Cốt lõi: chuyển giai đoạn đúng thứ tự và đúng giờ với cấu hình ngắn (tập 5 giây, nghỉ 3 giây, 3 hiệp) để kiểm thử nhanh.","Lưu trữ: lưu các bài tập cấu hình sẵn vào localStorage; ghi lại buổi tập đã hoàn thành theo ngày.","Đánh bóng: bíp đếm ngược 3 giây cuối, ra lệnh bằng phím cách để tạm dừng khi tay đang bận, chế độ toàn màn hình."],
 x:"Cạm bẫy giống hệt Ý 2 nhưng hậu quả rõ hơn: cộng dồn từng giây làm cả buổi tập lệch nhịp — tính theo mốc thời gian tuyệt đối. Cạm bẫy hai: màn hình điện thoại tự tắt giữa buổi tập; hãy dùng Wake Lock API khi được hỗ trợ và dự phòng bằng âm thanh đủ to. Nâng cấp: đọc tên bài tập bằng giọng nói tổng hợp, chuỗi bài tập nhiều chặng khác nhau."},
 en:{t:"Interval training timer",p:"People who train in intervals (HIIT, tabata, circuit training) — and musicians practising in rounds — need a timer that switches phases by itself: work 40 seconds, rest 20, 8 rounds — with audio cues so they never look at the screen. A full fitness app is overkill; a configurable interval timer is exactly the need.",
 f:["Configure: work time, rest time, number of rounds, preparation time","A huge countdown display that changes colour per work/rest phase","Beeps for the last 3 seconds and a chime at phase changes","Total workout length shown before starting; pause/resume","Save several preset workout configurations"],
 w:"Like Idea 2, this is a timing + synthesised-sound problem — browsers do both well, and computing time from the true start timestamp keeps the clock honest when the tab is throttled. No data needs to leave the machine.",
 a:"A phase state machine: Prepare → (Work → Rest) × rounds → Done. Each phase has an absolute end timestamp derived from the start; the display loop only reads remaining time from the real clock. Sounds fire at fixed points in the phase schedule.",
 ai:["Frame: a large countdown screen with two phase colours and a static config form. Check the digits are readable from 3 metres away.","Core: phases switch in the right order at the right times using a short test config (work 5s, rest 3s, 3 rounds) for fast verification.","Storage: save preset workouts to localStorage; log completed workouts by day.","Polish: last-3-seconds beeps, spacebar pause control for busy hands, fullscreen mode."],
 x:"The same pitfall as Idea 2 with clearer consequences: adding up seconds one by one drifts the whole workout — compute from absolute timestamps. Pitfall two: the phone screen sleeping mid-workout; use the Wake Lock API where supported, with loud audio as the fallback. Upgrades: spoken exercise names via speech synthesis, multi-segment workout chains."}},

{n:24,g:"C",d:"easy",tech:"embedded data · search",
 vi:{t:"Sổ tay tra cứu offline",p:"Mỗi nghề đều có một cuốn sổ tay riêng: bảng tra cứu thông số, quy trình xử lý sự cố, từ điển thuật ngữ nội bộ. Để nó trong file PDF thì tìm chậm, trong đầu thì quên. Một trang tra cứu nhúng sẵn dữ liệu, gõ vài chữ là ra, mở trên điện thoại ngay tại hiện trường và không cần mạng — đó là dạng sổ tay được dùng thật.",
 f:["Dữ liệu tra cứu nhúng sẵn trong file: mục từ, định nghĩa/giá trị, nhóm chủ đề","Ô tìm kiếm lọc tức thì theo từng phím gõ, tìm cả trong nội dung","Lọc theo nhóm chủ đề; mục hay dùng được ghim lên đầu","Chế độ xem trên điện thoại: chữ to, ít thao tác","Cập nhật dữ liệu bằng cách nạp lại file CSV/JSON mới"],
 w:"Dữ liệu tra cứu của một sổ tay cá nhân thường chỉ vài trăm tới vài nghìn mục chữ — nhúng thẳng vào file vẫn nhẹ và tìm kiếm tại chỗ tức thì. Offline tuyệt đối vì không có gì phải tải. Đây là ý tưởng 'một file' ở dạng thuần khiết nhất.",
 a:"Dữ liệu là một mảng mục {thuật ngữ, nội dung, nhóm} nằm trong file. Tìm kiếm là phép lọc mảng theo chuỗi con (không phân biệt hoa thường, nên bỏ dấu tiếng Việt khi so khớp). Giao diện gồm ô tìm kiếm sticky trên cùng và danh sách kết quả dạng thẻ.",
 ai:["Khung: ô tìm kiếm và danh sách thẻ mẫu 10 mục. Kiểm tra ô tìm kiếm dính ở đầu khi cuộn trên điện thoại.","Cốt lõi: tìm kiếm lọc tức thì, khớp cả khi gõ không dấu; lọc theo nhóm. Kiểm thử bằng dữ liệu thật 100 mục của bạn.","Lưu trữ: mục ghim và mục xem gần đây lưu localStorage; dữ liệu gốc vẫn nhúng trong file để luôn có bản chuẩn.","Đánh bóng: tô sáng từ khoá trong kết quả, đếm số kết quả, nút sao chép nội dung một mục để dán đi nơi khác."],
 x:"Cạm bẫy tiếng Việt kinh điển: người dùng gõ 'dong co' nhưng dữ liệu là 'động cơ' — thuật toán so khớp phải bỏ dấu ở cả hai phía. Cạm bẫy hai: dữ liệu phình lên hàng chục nghìn mục làm file nặng; khi đó hãy tách theo nhóm chủ đề thành nhiều sổ tay nhỏ. Nâng cấp: chế độ soạn ngay trong trang (thêm mục mới lưu IndexedDB cạnh dữ liệu nhúng), xuất sổ tay thành bản in gọn."},
 en:{t:"Offline reference handbook",p:"Every trade has its own handbook: lookup tables, troubleshooting procedures, an internal terminology dictionary. As a PDF it's slow to search; in your head it's forgettable. A reference page with the data embedded, a few keystrokes to the answer, openable on a phone right at the work site with no network — that's the handbook form that actually gets used.",
 f:["Reference data embedded in the file: term, definition/value, topic group","A search box filtering instantly per keystroke, searching inside content too","Filter by topic group; frequently used entries pinned to the top","Phone viewing mode: large text, few taps","Update data by loading a fresh CSV/JSON file"],
 w:"A personal handbook's data is usually a few hundred to a few thousand text entries — embedded directly in the file it stays light and searches instantly, locally. Absolutely offline because nothing needs loading. This is the 'one file' idea in its purest form.",
 a:"Data is an array of entries {term, content, group} inside the file. Search filters the array by substring (case-insensitive, and diacritic-insensitive for Vietnamese matching). The UI is a sticky search box on top and a result list of cards.",
 ai:["Frame: a search box and a 10-entry sample card list. Check the search box sticks to the top while scrolling on a phone.","Core: instant search filtering, matching even when typed without diacritics; group filters. Test with 100 of your real entries.","Storage: pinned and recently viewed entries in localStorage; the master data stays embedded in the file as the canonical copy.","Polish: highlight matched keywords in results, result counts, a copy button per entry for pasting elsewhere."],
 x:"The classic Vietnamese pitfall: the user types 'dong co' but the data says 'động cơ' — the matcher must strip diacritics on both sides. Pitfall two: data growing to tens of thousands of entries makes the file heavy; then split the handbook into smaller topic books. Upgrades: an in-page authoring mode (new entries stored in IndexedDB alongside the embedded data), a compact printable edition of the handbook."}},

{n:25,g:"C",d:"hard",tech:"Canvas animation",
 vi:{t:"Trực quan hoá khái niệm",p:"Nhiều khái niệm trừu tượng — sóng dao động, dòng chảy quanh cánh, phân bố ứng suất, lãi kép — chỉ thật sự 'ngộ' ra khi được nhìn thấy nó chuyển động và tự tay kéo thông số. Bài giảng tĩnh không làm được việc đó. Một trang trực quan hoá tương tác, mỗi khái niệm một mô hình nhỏ có thanh trượt, là công cụ dạy và tự học cực mạnh.",
 f:["Một mô hình chuyển động theo thời gian thực cho khái niệm đang chọn","Thanh trượt thông số: kéo là mô hình đổi theo ngay","Đồ thị đi kèm vẽ đồng bộ với mô hình (ví dụ sóng + đồ thị biên độ)","Chú thích từng phần tử ngay trên hình; nút tạm dừng và tua chậm","Nhiều khái niệm trong một file, chọn qua menu; thông số mẫu có sẵn để bắt đầu"],
 w:"Canvas vẽ 2D theo vòng lặp thời gian thực là đủ cho hầu hết mô hình giáo dục: vài trăm phần tử chuyển động vẫn mượt. Mọi tính toán là toán học tại chỗ, không cần dữ liệu ngoài. Với mô hình nặng hơn, WebGPU là đường nâng cấp chứ không phải điểm bắt đầu.",
 a:"Mẫu 'khung vẽ + vòng lặp': trạng thái mô hình là các thông số do thanh trượt kiểm soát; mỗi khung hình gồm cập nhật vật lý (công thức của khái niệm) rồi vẽ. Đồ thị phụ đọc cùng trạng thái đó. Tách bạch ba phần — thông số, cập nhật, vẽ — để AI sửa một phần không vỡ hai phần còn lại.",
 ai:["Khung: khung vẽ tĩnh với hình chụp của mô hình ở thông số mặc định và hàng thanh trượt. Kiểm tra bố cục: hình là nhân vật chính, điều khiển là phụ.","Cốt lõi: vòng lặp chạy, một thông số đầu tiên kéo được và mô hình đáp ứng đúng vật lý — bạn (người hiểu khái niệm) phải xác nhận tính đúng đắn, AI không tự biết.","Lưu trữ: lưu các bộ thông số đặt tên (preset) vào localStorage để gọi lại khi giảng.","Đánh bóng: chú thích bật/tắt, tua chậm và tạm dừng, xuất ảnh chụp mô hình tại thông số hiện tại để đưa vào tài liệu."],
 x:"Cạm bẫy nguy hiểm nhất là mô hình đẹp nhưng sai vật lý — trực quan hoá sai còn tệ hơn không trực quan hoá vì nó khắc sâu hiểu lầm. Hãy kiểm chứng bằng các trường hợp biên có đáp án tính tay được. Cạm bẫy hai: tham nhiều thông số làm người học choáng; mỗi mô hình chỉ nên có 2–4 thanh trượt chính. Nâng cấp: chuỗi bài học dẫn dắt (làm theo từng bước khám phá), nhúng mô hình vào bài giảng bằng cách xuất bản sao chỉ-xem."},
 en:{t:"Concept visualiser",p:"Many abstract concepts — oscillating waves, flow around a wing, stress distribution, compound interest — only truly 'click' when you watch them move and drag the parameters yourself. A static lecture can't do that. An interactive visualisation page, one small model with sliders per concept, is a powerful teaching and self-learning tool.",
 f:["One model animating in real time for the selected concept","Parameter sliders: drag and the model responds immediately","A companion chart drawn in sync with the model (e.g. wave + amplitude graph)","Annotations on the figure's elements; pause and slow-motion controls","Multiple concepts in one file via a menu; preset parameters to start from"],
 w:"Canvas 2D on a real-time loop suffices for most educational models: a few hundred moving elements still run smoothly. All computation is local mathematics, no external data needed. For heavier models, WebGPU is the upgrade path, not the starting point.",
 a:"The 'canvas + loop' pattern: model state is the parameters the sliders control; each frame is update physics (the concept's formulas) then draw. The companion chart reads the same state. Keep the three parts — parameters, update, draw — separate so the AI can fix one without breaking the other two.",
 ai:["Frame: a static canvas showing the model at default parameters, plus the slider row. Check the layout: the figure is the star, controls are supporting cast.","Core: the loop runs, the first parameter is draggable and the model responds with correct physics — you (the one who understands the concept) must confirm correctness; the AI cannot know.","Storage: save named parameter presets to localStorage for recall during teaching.","Polish: toggleable annotations, slow motion and pause, snapshot export of the model at current parameters for documents."],
 x:"The most dangerous pitfall is a beautiful but physically wrong model — a wrong visualisation is worse than none because it engraves misconceptions. Verify against edge cases you can compute by hand. Pitfall two: too many parameters overwhelm learners; each model should have only 2–4 main sliders. Upgrades: guided discovery lesson sequences, publishing a view-only copy of a model inside lecture materials."}},

{n:26,g:"D",d:"easy",tech:"colour maths",
 vi:{t:"Bảng màu + kiểm tương phản",p:"Ai từng tự làm slide, bài đăng hay giao diện đều biết cảnh chọn màu 'trông có vẻ hợp' rồi lên hình mới thấy chữ chìm nghỉm. Một xưởng màu nhỏ — sinh bảng màu hài hoà từ một màu gốc và kiểm tra tương phản chữ/nền theo chuẩn WCAG — biến việc chọn màu từ cảm tính thành có căn cứ.",
 f:["Nhập màu gốc (mã hex, bộ chọn màu) → sinh các biến thể sáng/tối và màu bổ trợ","Kiểm tra tỉ lệ tương phản của cặp chữ/nền, chấm đạt WCAG AA/AAA","Lưu các bảng màu đã ưng thành bộ sưu tập","Sao chép mã màu từng ô bằng một chạm","Xem trước bảng màu trên một thẻ giao diện mẫu (tiêu đề, đoạn văn, nút bấm)"],
 w:"Toán về màu (chuyển đổi RGB/HSL, công thức tương phản WCAG) là vài hàm thuần tuý, chạy tức thì tại chỗ. Không có gì cần lưu trữ lớn: các bảng màu đã lưu chỉ là danh sách mã hex.",
 a:"Trạng thái gồm màu gốc và bảng màu suy ra; mọi biến thể được tính lại mỗi lần màu gốc đổi. Bộ kiểm tương phản nhận hai mã màu bất kỳ và trả về tỉ lệ số kèm mức đạt. Bản xem trước giao diện mẫu là một thẻ HTML dùng chính các biến màu đang chọn.",
 ai:["Khung: ô nhập màu gốc, hàng ô màu tĩnh và thẻ xem trước mẫu. Kiểm tra ô màu có đủ to để nhìn trên điện thoại.","Cốt lõi: sinh biến thể đúng và tỉ lệ tương phản đúng — kiểm chứng một cặp trắng/đen phải ra 21:1.","Lưu trữ: lưu bảng màu đã ưng vào localStorage với tên tự đặt; xuất danh sách mã màu dạng text.","Đánh bóng: sao chép một chạm kèm thông báo, chế độ mô phỏng mù màu cơ bản, gợi ý cặp chữ/nền an toàn từ bảng màu hiện tại."],
 x:"Cạm bẫy: tương phản 'đạt số' nhưng vẫn khó đọc vì cỡ chữ nhỏ — công cụ nên hiển thị cả hai mức AA cho chữ thường và chữ lớn để bạn chọn đúng ngữ cảnh. Cạm bẫy hai: màu hiển thị lệch giữa các màn hình; luôn kiểm tra trên điện thoại thật trước khi chốt. Nâng cấp: trích bảng màu từ một ảnh tải lên, xuất bảng màu thành biến CSS để dán vào dự án khác."},
 en:{t:"Colour palette + contrast checker",p:"Anyone who has made their own slides, posts or interfaces knows the scene: colours that 'seem to go together', then on screen the text sinks and vanishes. A small colour workshop — generating a harmonious palette from one base colour and checking text/background contrast against WCAG — turns colour picking from guesswork into evidence.",
 f:["Enter a base colour (hex, colour picker) → generate light/dark variants and complements","Check a text/background pair's contrast ratio, graded against WCAG AA/AAA","Save liked palettes into a collection","Copy any swatch's hex code in one tap","Preview the palette on a sample UI card (heading, paragraph, button)"],
 w:"Colour maths (RGB/HSL conversion, the WCAG contrast formula) is a handful of pure functions running instantly on the spot. Nothing big to store: saved palettes are just lists of hex codes.",
 a:"State holds the base colour and the derived palette; all variants recompute whenever the base changes. The contrast checker takes any two hex codes and returns the numeric ratio plus pass levels. The sample UI preview is an HTML card styled by the very colour variables currently selected.",
 ai:["Frame: a base-colour input, a row of static swatches and the sample preview card. Check swatches are big enough to judge on a phone.","Core: variants generate correctly and contrast ratios are right — verify a white/black pair returns 21:1.","Storage: save liked palettes to localStorage under your own names; export the hex list as text.","Polish: one-tap copy with a confirmation toast, basic colour-blindness simulation, safe text/background pair suggestions from the current palette."],
 x:"Pitfall: a pair that 'passes the number' yet stays hard to read at small sizes — show both AA levels, for normal and for large text, so users judge in context. Pitfall two: colours shifting between screens; always verify finals on a real phone. Upgrades: extract a palette from an uploaded photo, export the palette as CSS variables for other projects."}},

{n:27,g:"D",d:"mid",tech:"Canvas → PNG",
 vi:{t:"Ảnh trích dẫn / social card",p:"Một câu nói hay, một con số ấn tượng hay tiêu đề bài viết sẽ được chia sẻ nhiều hơn hẳn khi nằm trong một tấm ảnh đẹp thay vì dòng chữ trần. Các công cụ tạo ảnh mạng xã hội trực tuyến thì bắt đăng nhập và đóng watermark. Một trình tạo card ngay trong trình duyệt — chữ của bạn, nền của bạn, xuất PNG sạch — là đủ.",
 f:["Nhập nội dung: trích dẫn/tiêu đề, tên tác giả, dòng phụ","Chọn mẫu bố cục: chữ trái, chữ giữa, ảnh nền mờ, dải màu chân trang…","Tuỳ biến: phông chữ có sẵn, cỡ chữ tự vừa khung, màu nền, logo nhỏ góc","Chọn kích thước theo nền tảng: vuông 1:1, dọc 4:5, ngang 16:9","Xuất PNG đúng kích thước đã chọn để đăng ngay"],
 w:"Social card là bài toán vẽ chữ lên khung hình — đúng sở trường của Canvas: chữ, hình chữ nhật màu, ảnh nền đều vẽ và xuất thành PNG tại chỗ. Kích thước chuẩn của các nền tảng chỉ là vài con số cố định.",
 a:"Một Canvas theo đúng tỉ lệ đã chọn; hàm vẽ đọc trạng thái {nội dung, mẫu, màu, ảnh nền} và vẽ lại toàn bộ mỗi lần thay đổi. Cỡ chữ tự động co tới khi vừa khung là một vòng lặp đo–giảm đơn giản. Xuất ảnh dùng toBlob ở đúng độ phân giải đích (thường gấp 2 lần hiển thị).",
 ai:["Khung: một mẫu bố cục tĩnh với trích dẫn mẫu. Kiểm tra tỉ lệ khung đúng 1:1 và chữ không sát mép.","Cốt lõi: sửa chữ thì ảnh cập nhật; đổi mẫu và đổi kích thước vẽ lại đúng. Kiểm thử trích dẫn rất dài và rất ngắn.","Lưu trữ: lưu các thiết kế đang làm dở và bộ màu/phông yêu thích vào localStorage.","Đánh bóng: tự co chữ vừa khung, căn lề an toàn theo lưới, xuất bản 2x cho nét, kéo thả ảnh nền vào thẳng khung."],
 x:"Cạm bẫy: phông chữ tiếng Việt — không phải phông đẹp nào cũng đủ dấu; hãy kiểm thử với câu có đủ dấu nặng/hỏi/ngã trước khi chốt bộ phông. Cạm bẫy hai: chữ tràn khung khi nội dung dài; giới hạn ký tự và cho xem trước thật trước khi xuất. Nâng cấp: hàng loạt card từ danh sách trích dẫn (nạp CSV, xuất từng PNG), mẫu theo bộ nhận diện riêng của bạn."},
 en:{t:"Quote image / social card maker",p:"A good quote, a striking number or an article title gets shared far more when it sits inside a beautiful image instead of plain text. Online social-image tools demand sign-in and stamp watermarks. A card maker right in the browser — your words, your background, a clean PNG export — is enough.",
 f:["Enter content: quote/title, author name, subtitle line","Choose a layout template: left text, centred text, faded photo background, footer colour band…","Customise: built-in fonts, auto-fitting text size, background colour, a small corner logo","Pick platform sizes: square 1:1, portrait 4:5, landscape 16:9","Export a PNG at exactly the chosen size, ready to post"],
 w:"A social card is a draw-text-on-a-frame problem — Canvas's home turf: text, colour rectangles and background photos all draw and export to PNG locally. Platform standard sizes are just a few fixed numbers.",
 a:"One Canvas at exactly the chosen ratio; the draw function reads state {content, template, colours, background image} and redraws everything on every change. Auto-fitting text size is a simple measure-and-shrink loop. Export uses toBlob at the true target resolution (usually 2× the display size).",
 ai:["Frame: one static layout template with a sample quote. Check the frame ratio is truly 1:1 and text doesn't hug the edges.","Core: editing text updates the image; switching templates and sizes redraws correctly. Test a very long and a very short quote.","Storage: save in-progress designs and favourite colour/font sets to localStorage.","Polish: auto-fit text, safe-margin grid alignment, 2× export for crispness, drag-and-drop background photos straight into the frame."],
 x:"Pitfall: Vietnamese fonts — not every pretty font carries the full diacritic set; test with a sentence using heavy/question/tilde tones before locking the font set. Pitfall two: text overflowing the frame on long content; cap characters and show a true preview before export. Upgrades: batch cards from a quote list (load CSV, export each PNG), templates in your own brand identity."}},

{n:28,g:"D",d:"mid",tech:"Canvas · image upload",
 vi:{t:"Trình tạo meme",p:"Meme là ngôn ngữ chung của internet: một ảnh quen thuộc cộng hai dòng chữ đúng chỗ là thành một câu đùa ai cũng hiểu. Các trang tạo meme trực tuyến đầy quảng cáo và tải ảnh của bạn lên máy chủ lạ. Một trình tạo meme tại chỗ — ảnh không rời máy, chữ IMPACT trắng viền đen đúng điệu — giải quyết gọn cả hai.",
 f:["Tải ảnh của bạn lên hoặc chọn từ vài khuôn ảnh trống phổ biến","Thêm chữ trên và chữ dưới, kéo để đặt vị trí, chỉnh cỡ chữ","Thêm nhiều khối chữ nếu meme cần; đổi màu chữ và độ dày viền","Xem trước trực tiếp; xuất PNG/JPG để chia sẻ","Lưu các meme đang làm dở trên máy"],
 w:"Vẽ ảnh + vẽ chữ có viền lên Canvas là kỹ thuật cơ bản, chạy hoàn toàn tại chỗ nên ảnh cá nhân không bị tải lên đâu cả. Cỡ chữ tự vừa theo bề ngang là một vòng đo đơn giản.",
 a:"Trạng thái gồm ảnh nền và danh sách khối chữ {nội dung, vị trí %, cỡ, màu}. Hàm vẽ: vẽ ảnh phủ khung, rồi vẽ từng khối chữ với viền (strokeText) dưới chữ đặc (fillText). Khối chữ được kéo bằng sự kiện chạm/chuột trên chính vị trí của nó.",
 ai:["Khung: khung ảnh mẫu với hai khối chữ tĩnh trên/dưới. Kiểm tra chữ không bị cắt ở mép khi xuất.","Cốt lõi: tải ảnh thật, sửa chữ, kéo khối chữ tới vị trí mới. Kiểm thử ảnh dọc và ảnh ngang cực đoan.","Lưu trữ: lưu bản nháp (ảnh đã thu nhỏ + các khối chữ) vào localStorage/IndexedDB để làm tiếp sau.","Đánh bóng: tự vừa cỡ chữ, thêm/bớt khối chữ, mẫu phông và viền khác (chữ vàng, chữ phụ đề phim), chế độ lưới căn giữa."],
 x:"Cạm bẫy: ảnh gốc quá lớn làm Canvas ì và bản xuất chậm — thu nhỏ ảnh nền về tối đa ~1600 px ngay khi nạp. Cạm bẫy hai: chữ viền đen trên nền tối không đọc được; cho phép đổi màu viền. Lưu ý bản quyền: meme cho vui cá nhân khác với dùng thương mại — ảnh nổi tiếng không phải của bạn thì đừng dùng bán hàng. Nâng cấp: thư viện khuôn meme của riêng nhóm bạn, xuất ảnh động dạng GIF từ chuỗi khung hình."},
 en:{t:"Meme generator",p:"Memes are the internet's shared language: a familiar image plus two well-placed lines becomes a joke everyone gets. Online meme sites are ad-stuffed and upload your photos to strangers' servers. A local meme maker — photos never leave the machine, proper white IMPACT text with black outline — solves both problems at once.",
 f:["Upload your photo or pick from a few popular blank templates","Add top and bottom captions, drag to position, adjust text size","Add more text blocks when the meme needs them; change text colour and outline thickness","Live preview; export PNG/JPG to share","Save in-progress memes on the machine"],
 w:"Drawing an image plus outlined text onto Canvas is a basic technique, running entirely locally so personal photos are never uploaded anywhere. Auto-fitting text width is a simple measurement loop.",
 a:"State holds the background image and a list of text blocks {content, position %, size, colour}. The draw function: draw the image covering the frame, then draw each text block as outlined text (strokeText) under solid text (fillText). Blocks are dragged by pointer events on their own positions.",
 ai:["Frame: a sample frame with two static text blocks, top and bottom. Check text isn't clipped at the edges on export.","Core: load a real photo, edit captions, drag a block to a new position. Test extreme portrait and landscape photos.","Storage: save drafts (shrunken image + text blocks) to localStorage/IndexedDB to continue later.","Polish: auto-fit text size, add/remove text blocks, alternate font/outline styles (yellow text, film-subtitle style), a centring grid mode."],
