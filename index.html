 x:"Pitfall: oversized originals make the Canvas sluggish and export slow — shrink backgrounds to ~1600 px max on load. Pitfall two: black-outlined text unreadable on dark backgrounds; allow outline colour changes. Copyright note: memes for personal fun differ from commercial use — famous images that aren't yours shouldn't sell products. Upgrades: a private template library for your group, GIF export from frame sequences."}},

{n:29,g:"D",d:"mid",tech:"Canvas → PNG",
 vi:{t:"Xưởng vẽ pixel art",p:"Pixel art là phong cách vẽ bằng từng ô vuông nhỏ: làm biểu tượng game, avatar, hình minh hoạ phong cách retro. Phần mềm đồ hoạ đầy đủ thì thừa tính năng và khó học cho một việc nhỏ như vậy. Một lưới vẽ riêng cho pixel — phóng to từng ô, bảng màu gọn, xuất PNG sắc nét — là xưởng vừa tay.",
 f:["Chọn kích thước lưới: 16×16, 32×32, 64×64","Vẽ bằng bút, đổ màu (fill), tẩy, ống hút màu từ tranh","Bảng màu có sẵn phong cách retro + tự thêm màu","Xem trước ở kích thước thật (ô nhỏ) cạnh khung vẽ phóng to","Xuất PNG với tuỳ chọn nhân tỉ lệ (ô nét, không nhoè); lưu nhiều tranh"],
 w:"Pixel art là mảng số nguyên hai chiều: mỗi ô một mã màu. Canvas vẽ mảng đó dễ dàng, và xuất ảnh với tắt làm mịn (image-smoothing off) cho ô vuông sắc cạnh. Dữ liệu tranh là mảng nhỏ, lưu bao nhiêu cũng nhẹ.",
 a:"Mô hình: lưới là mảng 2D các chỉ số màu trỏ vào bảng màu. Công cụ bút đặt một ô; đổ màu là thuật toán loang (flood fill) từ ô được bấm. Vẽ lên Canvas bằng cách phóng mỗi ô thành hình vuông lớn; xem trước là cùng mảng vẽ ở tỉ lệ 1:1.",
 ai:["Khung: lưới 32×32 tĩnh với vài ô đã tô và thanh công cụ. Kiểm tra ô vẽ đủ to để bấm trúng trên điện thoại.","Cốt lõi: bút, tẩy, đổ màu chạy đúng; đổ màu không 'rò' qua đường chéo. Kiểm thử tô một vùng kín và một vùng hở.","Lưu trữ: lưu tranh vào localStorage (mảng + bảng màu), đặt tên và mở lại; xuất/nhập file tranh.","Đánh bóng: ống hút màu, lưới mờ hỗ trợ, chế độ đối xứng gương, xuất PNG nhân tỉ lệ 4x/8x không nhoè."],
 x:"Cạm bẫy: xuất PNG bị nhoè vì trình duyệt làm mịn khi phóng — phải tắt imageSmoothingEnabled và nhân tỉ lệ bằng số nguyên. Cạm bẫy hai: đổ màu đệ quy gây tràn ngăn xếp trên lưới lớn; dùng hàng đợi lặp. Nâng cấp: nhiều khung hình để làm ảnh động sprite, nhập ảnh thật và 'pixel hoá' nó về lưới chọn trước."},
 en:{t:"Pixel art studio",p:"Pixel art is drawing with individual small squares: game icons, avatars, retro-style illustrations. A full graphics suite is over-featured and hard to learn for such a small job. A dedicated pixel grid — zoomed cells, a tidy palette, crisp PNG export — is a right-sized studio.",
 f:["Choose grid size: 16×16, 32×32, 64×64","Draw with pen, flood fill, eraser, colour picker from the canvas","A built-in retro palette plus custom colours","Preview at true size (tiny cells) beside the zoomed editing grid","Export PNG with integer scaling options (crisp cells, no blur); save multiple artworks"],
 w:"Pixel art is a 2D array of integers: each cell a colour index. Canvas draws that array easily, and exporting with smoothing off keeps cells razor-sharp. Artwork data is a tiny array — store as many as you like.",
 a:"Model: the grid is a 2D array of colour indices pointing into a palette. The pen sets one cell; fill is a flood-fill from the clicked cell. Rendering draws each cell as a large square on Canvas; the preview is the same array drawn at 1:1 scale.",
 ai:["Frame: a static 32×32 grid with a few filled cells and the toolbar. Check cells are big enough to tap accurately on a phone.","Core: pen, eraser and fill work correctly; fill doesn't 'leak' diagonally. Test filling a closed region and an open one.","Storage: save artworks to localStorage (array + palette), named and reopenable; export/import artwork files.","Polish: colour picker, a faint guide grid, mirror symmetry mode, PNG export at 4×/8× integer scale without blur."],
 x:"Pitfall: blurry PNG exports because the browser smooths when scaling — disable imageSmoothingEnabled and scale by integers only. Pitfall two: recursive flood fill overflowing the stack on big grids; use an iterative queue. Upgrades: multiple frames for sprite animation, importing a real photo and 'pixelating' it onto the chosen grid."}},

{n:30,g:"D",d:"easy",tech:"embedded QR library",
 vi:{t:"Trình tạo mã QR",p:"Chia sẻ link dài, mật khẩu Wi-Fi, thông tin chuyển khoản hay thực đơn quán — đọc từng ký tự thì sai, gõ lại thì nản. Mã QR giải quyết bằng một lần quét. Một trình tạo QR offline, nhúng sẵn thư viện, cho ra mã đúng chuẩn kèm logo giữa và màu tuỳ chọn thì tiện hơn hẳn các trang QR đầy quảng cáo.",
 f:["Nhập nội dung: link, văn bản, Wi-Fi (tên mạng + mật khẩu), danh thiếp vCard","Tạo mã tức thì khi gõ; chọn mức sửa lỗi (cao hơn = quét được dù bị che một phần)","Đổi màu mã và nền; chèn logo nhỏ ở giữa (kèm cảnh báo mức sửa lỗi)","Tải PNG kích thước lớn để in, hoặc SVG nếu thư viện hỗ trợ","Lưu các mẫu thường dùng (Wi-Fi nhà, link menu) trên máy"],
 w:"Thuật toán tạo QR là một thư viện nhỏ, gọn, nhúng nguyên vào file được — sau đó mọi việc chạy offline. Mã QR là chuẩn mở (ISO/IEC 18004) nên mã tạo ra quét được bởi mọi điện thoại. Đây là ví dụ sạch nhất của mẫu 'nhúng thư viện, xuất sản phẩm'.",
 a:"Trạng thái là nội dung + tuỳ chọn hiển thị. Thư viện nhận chuỗi và mức sửa lỗi, trả về ma trận ô; công cụ vẽ ma trận lên Canvas (hoặc SVG) theo màu đã chọn và đặt logo vào tâm nếu có. Tải xuống là xuất Canvas ra PNG ở độ phân giải in.",
 ai:["Khung: ô nhập, vùng mã tĩnh và các tuỳ chọn. Kiểm tra mã mẫu quét được bằng điện thoại của bạn ngay ở giai đoạn này.","Cốt lõi: đổi nội dung thì mã đổi theo và quét ra đúng chuỗi; Wi-Fi quét xong phải tự nối được. Kiểm thử link dài và ký tự tiếng Việt.","Lưu trữ: lưu mẫu QR thường dùng vào localStorage; chưa cần sao lưu phức tạp.","Đánh bóng: chèn logo với kiểm tra mức sửa lỗi bắt buộc cao, màu tuỳ biến kèm cảnh báo tương phản thấp, xuất bản in có viền yên tĩnh (quiet zone) đúng chuẩn."],
 x:"Cạm bẫy: chèn logo quá to hoặc mức sửa lỗi thấp làm mã không quét được — nguyên tắc: logo ≤ ~20% diện tích và luôn dùng sửa lỗi mức H khi có logo. Cạm bẫy hai: đảo màu (mã sáng trên nền tối) khiến nhiều máy quét không đọc; giữ mã tối trên nền sáng. Nâng cấp: tạo hàng loạt QR từ danh sách CSV, khung trang trí kèm chữ hướng dẫn dưới mã cho tờ rơi."},
 en:{t:"QR code generator",p:"Sharing a long link, Wi-Fi password, bank-transfer details or a shop menu — reading characters aloud invites errors, retyping kills patience. A QR code solves it with one scan. An offline QR generator with the library embedded, producing standards-correct codes with an optional centre logo and custom colours, beats ad-stuffed QR websites easily.",
 f:["Enter content: link, text, Wi-Fi (network name + password), vCard contact","Code generates instantly as you type; choose the error-correction level (higher = scannable even partly covered)","Change code and background colours; insert a small centre logo (with an error-correction warning)","Download a large PNG for print, or SVG if the library supports it","Save frequently used presets (home Wi-Fi, menu link) on the machine"],
 w:"The QR generation algorithm is one small, compact library that embeds whole into the file — after which everything runs offline. QR is an open standard (ISO/IEC 18004), so generated codes scan on every phone. This is the cleanest example of the 'embed a library, export a product' pattern.",
 a:"State is the content plus display options. The library takes the string and error-correction level and returns a cell matrix; the tool draws the matrix onto Canvas (or SVG) in the chosen colours and places the logo at the centre if set. Download exports the Canvas to print-resolution PNG.",
 ai:["Frame: an input, a static code area and the options. Verify the sample code scans with your phone right at this stage.","Core: changing content changes the code, and scanning yields exactly the entered string; a Wi-Fi code must auto-connect when scanned. Test long links and Vietnamese characters.","Storage: save common QR presets to localStorage; no complex backup needed.","Polish: logo insertion with enforced high error correction, custom colours with a low-contrast warning, print export with a standards-correct quiet zone."],
 x:"Pitfall: an oversized logo or low error correction makes codes unscannable — rule: logo ≤ ~20% of the area and always use level H correction with a logo. Pitfall two: inverted colours (light code on dark background) defeat many scanners; keep dark code on a light background. Upgrades: batch QR generation from a CSV list, a decorative frame with instruction text under the code for flyers."}},

{n:31,g:"D",d:"hard",tech:"Web Audio sequencer",
 vi:{t:"Hộp nhịp (beat maker)",p:"Người mới học sản xuất nhạc hay đơn giản là mê nhịp điệu thường bị chặn bởi phần mềm DAW đắt và phức tạp. Một hộp nhịp dạng lưới bước (step sequencer) — mỗi cột là một nhịp nhỏ, mỗi hàng là một tiếng trống/synth — cho phép 'vẽ' ra một vòng nhịp nghe được ngay, và hiểu luôn nguyên lý của mọi DAW.",
 f:["Lưới 16 bước × nhiều hàng âm thanh (trống bass, snare, hi-hat, vỗ tay, synth…)","Bấm ô để bật/tắt nốt; vòng lặp chạy liên tục với đèn bước chạy theo","Đặt BPM, âm lượng từng hàng, nút xoá toàn bộ mẫu nhịp","Phát âm thanh tổng hợp bằng Web Audio — không cần file mẫu (sample)","Lưu các mẫu nhịp đã làm; xuất/nhập để chia sẻ"],
 w:"Mọi âm thanh trong hộp nhịp cơ bản đều tổng hợp được bằng Web Audio: trống bass là sóng sine tụt cao độ, hi-hat là nhiễu lọc cao tần, snare là nhiễu + thân tiếng. Không cần nạp sample nào nên file nhẹ và chạy offline hoàn toàn.",
 a:"Trạng thái là ma trận boolean [hàng × 16 bước] và BPM. Bộ lập lịch Web Audio (giống Ý 20) hẹn trước từng bước; tới bước nào thì kích hoạt các hàng đang bật ở cột đó. Đèn bước chạy được điều khiển từ cùng lịch hẹn để mắt và tai khớp nhau tuyệt đối.",
 ai:["Khung: lưới 16×6 tĩnh với vài ô đã bật và nút Play. Kiểm tra lưới trên điện thoại: ô có đủ to để bấm nhanh không.","Cốt lõi: vòng lặp chạy đúng BPM trong 2 phút không trôi; bật ô nào nghe đúng hàng đó. Đây là phần phải kiểm thử bằng tai thật kỹ.","Lưu trữ: lưu nhiều mẫu nhịp vào localStorage, đặt tên; xuất/nhập một mẫu ra file để gửi bạn bè mở cùng công cụ.","Đánh bóng: âm lượng từng hàng, mẫu nhịp có sẵn nhiều phong cách, chế độ 32 bước, ghi âm buổi chơi thành file qua MediaRecorder nếu trình duyệt hỗ trợ."],
 x:"Cạm bẫy trung tâm giống mọi công cụ nhịp: lập lịch bằng setInterval sẽ trôi và giật — bắt buộc dùng đồng hồ AudioContext hẹn trước. Cạm bẫy hai: tổng hợp tiếng trống nghe 'đồ chơi' nếu không chăm chút đường bao âm lượng (envelope); hãy để dành thời gian ở Đánh bóng cho việc này. Nâng cấp: thêm hàng giai điệu với cao độ theo hàng, hiệu ứng delay đơn giản, chia sẻ mẫu nhịp qua link chứa trạng thái."},
 en:{t:"Beat maker",p:"Beginner music producers — or anyone who just loves rhythm — are usually blocked by expensive, complex DAW software. A step-sequencer beat box — each column a small beat slice, each row a drum/synth sound — lets you 'draw' a loop you can hear immediately, and teaches the principle behind every DAW.",
 f:["A 16-step grid × several sound rows (kick, snare, hi-hat, clap, synth…)","Tap cells to toggle notes; the loop runs continuously with a step light chasing along","Set BPM, per-row volume, a clear-all button","All sounds synthesised with Web Audio — no sample files needed","Save your patterns; export/import to share them"],
 w:"Every sound in a basic beat box can be synthesised with Web Audio: a kick is a pitch-dropping sine, a hi-hat is high-pass-filtered noise, a snare is noise plus a tone body. No samples to load means a light file and full offline operation.",
 a:"State is a boolean matrix [rows × 16 steps] plus BPM. A Web Audio scheduler (as in Idea 20) books steps ahead; at each step it fires the rows enabled in that column. The chasing step light is driven by the same schedule so eyes and ears agree exactly.",
 ai:["Frame: a static 16×6 grid with a few cells on and a Play button. On a phone, check cells are big enough for fast tapping.","Core: the loop holds its BPM for 2 minutes without drifting; toggling a cell sounds exactly that row. This part demands careful listening tests.","Storage: save multiple named patterns to localStorage; export/import one pattern as a file so friends can open it in the same tool.","Polish: per-row volume, built-in patterns in several styles, a 32-step mode, recording a session via MediaRecorder where supported."],
 x:"The central pitfall, as with all rhythm tools: scheduling with setInterval drifts and stutters — the AudioContext clock with lookahead booking is mandatory. Pitfall two: synthesised drums sound 'toy-like' without careful volume envelopes; reserve real Polish-stage time for this. Upgrades: melodic rows with per-row pitch, a simple delay effect, sharing patterns via state-carrying links."}},

{n:32,g:"D",d:"mid",tech:"print / PDF",
 vi:{t:"CV / portfolio → PDF",p:"Mỗi lần ứng tuyển lại mở Word vật lộn với căn lề, hoặc dùng các trang tạo CV bắt đăng ký và giữ dữ liệu cá nhân của bạn. Một form CV trong trình duyệt — nhập một lần, xem trước đúng tờ A4, in ra PDF sạch, dữ liệu chỉ nằm trên máy bạn — là cách làm CV tử tế và riêng tư nhất cho người không rành thiết kế.",
 f:["Form nhập đầy đủ các mục CV: thông tin, tóm tắt, kinh nghiệm, học vấn, kỹ năng, dự án","Xem trước A4 trực tiếp khi gõ; đổi giữa 2–3 mẫu bố cục (trang trọng / hiện đại / tối giản)","Mỗi mục kinh nghiệm: thêm/xoá/sắp xếp lại thứ tự kéo thả","In hoặc lưu PDF qua hộp thoại in với CSS in chuẩn","Lưu dữ liệu CV trên máy để lần sau sửa tiếp; xuất/nhập sao lưu"],
 w:"CV là dữ liệu có cấu trúc văn bản thuần cộng một bài toán trình bày A4 — đúng vùng mạnh của HTML/CSS. PDF đến từ hộp thoại in. Không tải dữ liệu nghề nghiệp nhạy cảm lên bất kỳ máy chủ nào là một ưu điểm thật, không phải khẩu hiệu.",
 a:"Dữ liệu CV là một đối tượng có cấu trúc (các mảng kinh nghiệm/học vấn/kỹ năng). Vùng xem trước là một trang A4 được dựng lại từ dữ liệu mỗi lần thay đổi; mẫu bố cục chỉ là các bộ CSS khác nhau áp lên cùng cấu trúc HTML đó. Khi in, chỉ vùng A4 được in.",
 ai:["Khung: một mẫu bố cục tĩnh với CV mẫu điền sẵn. Kiểm tra trang A4 xem trước có đúng tỉ lệ và lề an toàn cho in ấn.","Cốt lõi: sửa form thì xem trước đổi theo; thêm/xoá/sắp xếp mục kinh nghiệm. Kiểm thử CV dài tràn sang trang 2 có vỡ bố cục không.","Lưu trữ: lưu dữ liệu CV vào localStorage; xuất/nhập file JSON của CV để chuyển máy.","Đánh bóng: 2–3 mẫu bố cục, in thử ra giấy thật để kiểm tra lề và cỡ chữ, gợi ý độ dài từng mục ngay trong form."],
 x:"Cạm bẫy in ấn kinh điển: những gì đẹp trên màn hình có thể bị cắt ở mép giấy hoặc vỡ trang giữa một mục kinh nghiệm — hãy kiểm thử bằng bản in thật và đặt quy tắc 'không ngắt giữa mục' trong CSS in. Cạm bẫy nội dung: form tự do làm CV dài lê thê; giới hạn ký tự mềm cho mục tóm tắt giúp CV gọn. Nâng cấp: bản CV tiếng Anh song song từ cùng dữ liệu, xuất thêm bản text thuần cho hệ thống ATS."},
 en:{t:"CV / portfolio → PDF",p:"Every application round means wrestling Word margins again, or using CV-builder sites that demand registration and keep your personal data. A browser CV form — enter once, preview a true A4 page, print a clean PDF, data only on your machine — is the decent, private way to make a CV for non-designers.",
 f:["A full CV form: contact, summary, experience, education, skills, projects","Live A4 preview as you type; switch between 2–3 layout templates (formal / modern / minimal)","Each experience entry: add/delete/drag-reorder","Print or save as PDF via the print dialog with proper print CSS","CV data stays on the machine for later edits; export/import backup"],
 w:"A CV is structured plain-text data plus an A4 presentation problem — squarely in HTML/CSS's strong zone. The PDF comes from the print dialog. Not uploading sensitive career data to any server is a real advantage, not a slogan.",
 a:"CV data is one structured object (arrays for experience/education/skills). The preview region is an A4 page rebuilt from the data on every change; layout templates are just different CSS sets applied to the same HTML structure. When printing, only the A4 region prints.",
 ai:["Frame: one static layout template with a filled sample CV. Check the A4 preview's proportions and print-safe margins.","Core: editing the form updates the preview; add/delete/reorder experience entries. Test a long CV overflowing to page 2 for layout breakage.","Storage: save CV data to localStorage; export/import the CV as JSON for machine moves.","Polish: 2–3 layout templates, a real paper print test for margins and type size, per-section length hints inside the form."],
 x:"The classic print pitfall: what looks beautiful on screen can clip at paper edges or break a page mid-experience-entry — test with a real printout and set a 'never break inside an entry' rule in print CSS. The content pitfall: free-form fields make CVs ramble; soft character limits on the summary keep it tight. Upgrades: a parallel English CV from the same data, plus a plain-text export for ATS systems."}},

{n:33,g:"D",d:"easy",tech:"CSS · copy code",
 vi:{t:"Xưởng nền gradient & CSS",p:"Nền gradient đẹp là thứ làm slide và trang web 'lên hẳn một bậc', nhưng ngồi gõ mã CSS gradient bằng tay thì mò mẫm và chán. Một xưởng trực quan — kéo các điểm màu, chỉnh hướng, thấy kết quả phủ đầy màn hình ngay — cho ra đoạn CSS đúng ý trong vài chục giây.",
 f:["Thêm/bớt điểm màu, kéo điểm dừng để đổi vị trí màu trên dải","Chọn kiểu: tuyến tính (hướng tuỳ ý), tròn (radial), và số vòng lặp lại","Xem trước phủ toàn màn hình và trên một thẻ nội dung mẫu","Đoạn mã CSS được sinh sẵn, bấm để sao chép dán vào nơi khác","Lưu các gradient ưng ý thành bộ sưu tập; xuất/nhập"],
 w:"Gradient là tính năng gốc của CSS — trình duyệt tự vẽ, công cụ chỉ cần sinh đúng cú pháp. Mọi thao tác là biến đổi chuỗi và xem trước trực tiếp, không cần bất kỳ thư viện nào. Đây là ý tưởng Dễ điển hình để luyện quy trình bốn giai đoạn.",
 a:"Trạng thái gồm danh sách điểm màu {màu, vị trí %} và kiểu/hướng. Chuỗi CSS được lắp từ trạng thái và áp ngay làm nền của vùng xem trước; cùng chuỗi đó hiển thị trong khung mã để sao chép. Điểm màu trên thanh trượt là các núm kéo HTML đặt theo %.",
 ai:["Khung: thanh trượt hai điểm màu, vùng xem trước và khung mã tĩnh. Kiểm tra vùng xem trước có đủ lớn để 'cảm' được gradient không.","Cốt lõi: kéo điểm màu và điểm dừng thì nền và mã CSS cùng đổi đúng; thêm điểm màu thứ ba. Đối chiếu mã sao chép sang một trang khác để kiểm chứng.","Lưu trữ: lưu bộ sưu tập gradient vào localStorage với tên tự đặt.","Đánh bóng: mẫu gradient đẹp có sẵn, chế độ radial, sao chép kèm thông báo, xuất bộ sưu tập thành file CSS."],
 x:"Cạm bẫy: gradient đẹp trên màn hình lớn nhưng 'bẩn' ở dải màu giữa vì hai màu bù nhau tạo vùng xám — hãy gợi ý người dùng thêm điểm màu trung gian. Cạm bẫy hai: chữ đặt trên gradient tương phản kém ở một đầu dải; thẻ nội dung mẫu có mặt là để phát hiện việc này. Nâng cấp: sinh gradient từ một ảnh (lấy các màu trội), tạo ảnh PNG của gradient để dùng trong phần mềm không hỗ trợ CSS."},
 en:{t:"Gradient & CSS studio",p:"A beautiful gradient background lifts slides and web pages 'a whole level', but hand-writing gradient CSS is tedious guesswork. A visual studio — drag colour stops, adjust the angle, watch the result fill the screen — produces exactly the CSS you meant in a few dozen seconds.",
 f:["Add/remove colour stops, drag stops to move colour positions along the band","Choose the type: linear (any angle), radial, and repeating variants","Preview fullscreen and on a sample content card","Generated CSS code ready to copy in one click","Save favourite gradients into a collection; export/import"],
 w:"Gradients are a native CSS feature — the browser draws them; the tool only has to generate the right syntax. Every operation is string transformation plus live preview, no library needed. This is a textbook Easy idea for practising the four-stage process.",
 a:"State is a list of colour stops {colour, position %} plus type/angle. The CSS string is assembled from state and applied immediately as the preview region's background; that same string shows in the code box for copying. Stops on the slider track are HTML handles positioned by %.",
 ai:["Frame: a two-stop slider, preview region and a static code box. Check the preview is large enough to actually 'feel' the gradient.","Core: dragging colours and stops updates both the background and the CSS correctly; add a third stop. Verify by pasting the copied code into another page.","Storage: save the gradient collection to localStorage under your own names.","Polish: built-in beautiful presets, radial mode, copy with confirmation, exporting the collection as a CSS file."],
 x:"Pitfall: a gradient gorgeous on a big screen but 'muddy' mid-band because complementary colours mix into grey — suggest adding a middle stop. Pitfall two: text over a gradient has poor contrast at one end of the band; the sample content card exists to catch exactly that. Upgrades: generate a gradient from a photo (extract dominant colours), export the gradient as a PNG for software without CSS support."}},

/* ---------- GROUP E ---------- */
{n:34,g:"E",d:"hard",tech:"Canvas · game loop",
 vi:{t:"Game cổ điển (Snake / 2048 / Tetris)",p:"Snake, 2048, Tetris là ba bài toán game kinh điển: nhỏ mà đủ mọi thành phần của một game thật — vòng lặp, trạng thái, va chạm, điểm số, thua cuộc. Làm được một trong ba (cùng AI) là cách học tư duy game nhanh nhất, và thành quả là một trò chơi hoàn chỉnh để khoe và chơi thật.",
 f:["Chọn một game để dựng (khuyên bắt đầu với Snake — đơn giản nhất)","Điều khiển bàn phím và vuốt/chạm cho điện thoại","Điểm số, điểm cao nhất lưu trên máy, tốc độ tăng dần theo tiến độ","Màn hình bắt đầu / tạm dừng / thua cuộc rõ ràng","Âm thanh nhẹ khi ăn điểm và khi thua (tuỳ chọn tắt)"],
 w:"Canvas + vòng lặp game (Mẫu 6) là toàn bộ nền tảng cần thiết: vẽ lưới, cập nhật trạng thái theo nhịp cố định, nhận phím. Cả ba game đều là logic thuần tuý không cần tài nguyên ngoài — file nhẹ, chạy offline, mở là chơi.",
 a:"Tách ba lớp rõ ràng: trạng thái game (lưới/rắn/khối), hàm cập nhật theo nhịp (tick) thuần logic, và hàm vẽ từ trạng thái. Đầu vào (phím/vuốt) chỉ đổi 'hướng dự định', vòng cập nhật mới áp dụng — tách bạch này tránh 90% lỗi kinh điển của người mới làm game.",
 ai:["Khung: khung vẽ tĩnh với trạng thái ban đầu của game và các màn hình bắt đầu/thua. Kiểm tra tỉ lệ khung trên điện thoại.","Cốt lõi: vòng lặp chạy, nhân vật di chuyển và va chạm đúng, điều kiện thua đúng. Giai đoạn này cần nhiều vòng kiểm thử nhất — hãy chơi thử như một người chơi khó tính.","Lưu trữ: lưu điểm cao nhất và trạng thái tạm dừng vào localStorage.","Đánh bóng: điều khiển vuốt, âm thanh, tốc độ tăng dần mượt, hiệu ứng nhỏ khi ghi điểm."],
 x:"Cạm bẫy kinh điển của Snake: người chơi bấm ngược hướng quá nhanh trong một nhịp khiến rắn tự cắn cổ — phải hàng đợi hoá đầu vào theo nhịp. Của Tetris: xoay khối ở sát tường cần bảng đá tường (wall kick) đơn giản, nếu không game rất 'cứng'. Của 2048: sinh ô mới phải chỉ vào ô trống và kiểm tra thua khi không còn nước đi. Nâng cấp: bảng xếp hạng cá nhân theo ngày, chế độ hai người trên cùng máy (Snake), lưu ván đang chơi dở."},
 en:{t:"Classic games (Snake / 2048 / Tetris)",p:"Snake, 2048 and Tetris are three classic game problems: small, yet containing every component of a real game — a loop, state, collisions, scoring, losing. Building one of them (with AI) is the fastest way to learn game thinking, and the result is a complete game to show off and actually play.",
 f:["Pick one game to build (start with Snake — the simplest)","Keyboard controls plus swipe/tap for phones","Score, high score saved on the machine, speed rising with progress","Clear start / pause / game-over screens","Light sounds for scoring and losing (mutable)"],
 w:"Canvas + the game loop (Pattern 6) is the entire foundation needed: draw a grid, update state on a fixed beat, read keys. All three games are pure logic with no external assets — a light file, offline, open-and-play.",
 a:"Keep three layers cleanly separated: game state (grid/snake/blocks), a pure-logic update function on a fixed tick, and a draw function that renders state. Input (keys/swipe) only changes the 'intended direction'; the update applies it — this separation avoids 90% of beginner game bugs.",
 ai:["Frame: a static canvas with the game's initial state and start/game-over screens. Check the frame ratio on a phone.","Core: the loop runs, the character moves and collides correctly, the lose condition is right. This stage needs the most test loops — play it like a demanding player.","Storage: save the high score and paused state to localStorage.","Polish: swipe controls, sounds, smooth speed ramping, small score effects."],
 x:"Snake's classic pitfall: reversing direction twice within one tick makes the snake bite its own neck — inputs must be queued per tick. Tetris needs simple wall-kick tables when rotating near walls, or the game feels 'stiff'. In 2048, new tiles must spawn only on empty cells and the loss check is 'no moves remain'. Upgrades: personal daily leaderboards, two-player on one machine (Snake), saving an in-progress game."}},

{n:35,g:"E",d:"hard",tech:"generation / solving algorithms",
 vi:{t:"Sudoku tự sinh & gợi ý",p:"Sudoku in trên báo thì chơi một lần rồi hết; app Sudoku tốt thì đầy quảng cáo và theo dõi. Một trình Sudoku tự sinh đề theo độ khó, kiểm tra nước đi, gợi ý có kỷ luật và không quảng cáo là bạn đồng hành lâu dài cho người mê trò này — và là bài tập thuật toán thú vị nhất trong sách.",
 f:["Sinh đề theo 3 mức khó (số ô cho sẵn giảm dần), bảo đảm nghiệm duy nhất","Nhập số bằng chạm + bàn phím số; chế độ ghi chú (số nhỏ ứng viên)","Kiểm tra xung đột tức thì (tuỳ chọn bật/tắt), nút gợi ý lấp một ô kèm giải thích ngắn","Đồng hồ và đếm số lỗi; thắng có màn hình chúc mừng","Lưu ván đang chơi; thống kê số ván thắng theo mức khó"],
 w:"Thuật toán sinh và giải Sudoku (backtracking) là kiến thức cổ điển, chạy tức thì trên lưới 9×9 ngay trong trình duyệt. Mọi thứ là logic thuần — không dữ liệu ngoài, không máy chủ. Độ 'khó' của ý này nằm ở thuật toán, không nằm ở giao diện.",
 a:"Ba thành phần tách bạch: bộ giải (nhận lưới, trả nghiệm hoặc khẳng định vô nghiệm), bộ sinh (tạo lưới đầy đủ rồi đục lỗ đối xứng, kiểm tra nghiệm duy nhất sau mỗi lỗ), và lớp chơi (trạng thái lưới của người chơi + ghi chú). Tách bạch vậy thì AI sửa phần chơi không bao giờ làm hỏng phần sinh.",
 ai:["Khung: lưới 9×9 tĩnh với một đề mẫu in sẵn và bàn phím số. Kiểm tra ô lưới đủ to để chạm trên điện thoại.","Cốt lõi (chia hai vòng): vòng một — nhập số, ghi chú, báo xung đột; vòng hai — bộ giải chạy đúng trên các đề mẫu có đáp án biết trước.","Lưu trữ: nối bộ sinh theo mức khó; lưu ván đang chơi và thống kê vào localStorage.","Đánh bóng: gợi ý kèm giải thích kỹ thuật (ví dụ 'ô này chỉ còn một ứng viên'), đồng hồ, chế độ thân thiện với người mới (báo xung đột tự động)."],
 x:"Cạm bẫy chí mạng: bộ sinh đục lỗ bừa sẽ cho đề nhiều nghiệm — người chơi tìm ra nghiệm khác vẫn bị báo sai và mất niềm tin ngay. Nghiệm duy nhất phải được kiểm chứng bằng bộ giải đếm nghiệm sau mỗi lỗ đục. Cạm bẫy hai: độ khó đo bằng số ô cho sẵn là thước đo thô; hãy nói rõ trong giao diện đó là mức tương đối. Nâng cấp: các biến thể (Sudoku 6×6 cho trẻ, Killer Sudoku), in nhiều đề ra giấy kèm đáp án ở trang cuối."},
 en:{t:"Sudoku generator & hints",p:"A newspaper Sudoku is played once and done; good Sudoku apps are full of ads and tracking. A Sudoku tool that generates puzzles by difficulty, checks moves, gives disciplined hints and carries no ads is a long-term companion for fans of the game — and the most interesting algorithm exercise in this book.",
 f:["Generate puzzles at 3 difficulty levels (fewer givens as it hardens), guaranteed unique solution","Enter numbers by tap + number pad; pencil-note mode (small candidate numbers)","Instant conflict checking (toggleable), a hint button that fills one cell with a short explanation","Timer and mistake counter; a congratulation screen on winning","Save the in-progress game; win statistics per difficulty"],
 w:"Sudoku solving and generation algorithms (backtracking) are classic knowledge and run instantly on a 9×9 grid right in the browser. Everything is pure logic — no external data, no server. This idea's 'hard' rating lives in the algorithm, not the interface.",
 a:"Three cleanly separated components: the solver (takes a grid, returns a solution or proves none), the generator (builds a full grid, then digs symmetric holes, verifying a unique solution after each hole), and the play layer (the player's grid state + notes). Separated this way, the AI can fix the play layer without ever breaking generation.",
 ai:["Frame: a static 9×9 grid with a printed sample puzzle and the number pad. Check cells are big enough to tap on a phone.","Core (two loops): loop one — number entry, notes, conflict flags; loop two — the solver proves correct on sample puzzles with known answers.","Storage: wire in generation by difficulty; save the current game and statistics to localStorage.","Polish: hints with technique explanations (e.g. 'this cell has only one candidate left'), the timer, a beginner-friendly mode with automatic conflict flags."],
 x:"The fatal pitfall: a generator that digs holes carelessly produces multi-solution puzzles — the player finds a different valid solution, gets marked wrong, and trust dies instantly. Unique solutions must be verified by a solution-counting solver after every dug hole. Pitfall two: difficulty-by-given-count is a crude measure; label levels as relative in the UI. Upgrades: variants (6×6 Sudoku for kids, Killer Sudoku), printing puzzle packs with answers on the last page."}},

{n:36,g:"E",d:"mid",tech:"localStorage · JSON import",
 vi:{t:"Game đố vui (trivia)",p:"Buổi sinh hoạt lớp, họp mặt gia đình hay team building đều vui hơn hẳn với một vòng đố vui có tính điểm. Các nền tảng trivia trực tuyến đòi mọi người có tài khoản và mạng ổn định. Một game đố vui chạy trên một máy chiếu/TV, điều khiển bởi MC, nhập bộ câu hỏi riêng của nhóm — đơn giản mà hiệu quả hơn nhiều.",
 f:["Hai chế độ: soạn bộ câu hỏi (hoặc nạp từ JSON/CSV) và chơi","Màn hình chơi tối ưu cho chiếu lên TV: chữ thật to, đếm ngược mỗi câu","Nhiều đội, bảng điểm cập nhật sau mỗi câu, hiệu ứng công bố đáp án","Câu hỏi có thể kèm ảnh (nhúng hoặc nạp từ máy)","Lưu nhiều bộ câu hỏi theo chủ đề; xuất/nhập để chia sẻ giữa các MC"],
 w:"Trivia là quiz (Ý 18) cộng lớp trình diễn: dữ liệu vẫn là các bộ câu hỏi nhỏ, chấm điểm là so đáp án. Điểm cộng của một file là MC mang theo trên USB/laptop nào cũng chạy được, kể cả nơi không có mạng.",
 a:"Tách hai lớp như Ý 18: dữ liệu bộ câu hỏi và một máy trạng thái buổi chơi {đội, câu hiện tại, điểm, giai đoạn hiện đáp án hay chưa}. Màn hình chơi được thiết kế cho khoảng cách xa: phông chữ lớn, tương phản cao, một hành động mỗi màn hình.",
 ai:["Khung: màn hình chơi mẫu một câu với đếm ngược tĩnh và bảng điểm 3 đội. Kiểm tra bằng cách đứng xa 4 mét đọc thử.","Cốt lõi: chạy một buổi 5 câu trọn vẹn — qua câu, công bố đáp án, cộng điểm đúng đội. Kiểm thử trường hợp hai đội bằng điểm ở câu cuối.","Lưu trữ: lưu các bộ câu hỏi vào localStorage; nạp bộ câu từ CSV do nhóm soạn sẵn trên Excel.","Đánh bóng: âm thanh đếm ngược và công bố đáp án, chế độ câu hỏi ảnh, màn hình vô địch cuối buổi, trộn câu."],
 x:"Cạm bẫy buổi chơi thật: MC bấm lộ đáp án sớm — nút công bố phải tách hẳn và có xác nhận. Cạm bẫy hai: điểm số sửa tay khi đội khiếu nại; hãy có nút cộng/trừ điểm thủ công minh bạch trên bảng điểm. Nâng cấp: vòng bấm chuông giành quyền trả lời bằng phím cho từng đội, bộ câu hỏi theo mùa/sự kiện được nạp nhanh."},
 en:{t:"Trivia game",p:"Class activities, family gatherings and team building all get better with a scored trivia round. Online trivia platforms demand everyone's account and stable network. A trivia game running on one projected machine/TV, hosted by an MC, with the group's own question sets — simpler and far more effective.",
 f:["Two modes: author question sets (or load from JSON/CSV) and play","Play screens optimised for TV projection: truly large text, a per-question countdown","Multiple teams, a scoreboard updated after each question, an answer-reveal effect","Questions can carry images (embedded or loaded from the machine)","Keep many themed sets; export/import to share between MCs"],
 w:"Trivia is the quiz (Idea 18) plus a presentation layer: data is still small question sets, scoring is still answer comparison. The one-file bonus is that the MC carries it on a USB stick and it runs on any laptop, even with no network.",
 a:"Two layers as in Idea 18: question-set data and a session state machine {teams, current question, scores, answer-revealed-or-not phase}. Play screens are designed for distance: large type, high contrast, one action per screen.",
 ai:["Frame: a sample play screen with one question, a static countdown and a 3-team scoreboard. Test by reading it from 4 metres away.","Core: run a full 5-question session — advance, reveal, award the right team. Test a tied score on the final question.","Storage: save question sets to localStorage; load a set from a CSV the group prepared in Excel.","Polish: countdown and reveal sounds, photo-question mode, an end-of-show champion screen, question shuffling."],
 x:"The live-show pitfall: the MC revealing the answer early — the reveal button must be separate and confirmed. Pitfall two: manual score fixes when a team protests; keep transparent manual +/− buttons on the scoreboard. Upgrades: buzzer rounds with per-team keys, fast-loading seasonal/event question sets."}},

{n:37,g:"E",d:"mid",tech:"Canvas / custom images",
 vi:{t:"Lật hình ghi nhớ (memory)",p:"Game lật thẻ ghi nhớ là trò chơi trí nhớ cổ điển cho mọi tuổi: một lưới thẻ úp, lật hai thẻ tìm cặp giống nhau. Phiên bản tự làm cho phép dùng chính ảnh gia đình, ảnh thú cưng hoặc hình học tập (cờ quốc gia, chữ cái) làm nội dung — biến trò chơi thành của riêng bạn trong vài phút.",
 f:["Chọn bộ hình: biểu tượng có sẵn, ảnh của bạn nạp vào, hoặc chữ/từ vựng để học","Chọn kích thước lưới 4×3, 4×4, 6×5 theo độ tuổi","Đếm số lượt lật và thời gian; cặp đúng ở lại mở, sai úp lại sau một nhịp","Màn hình thắng với thống kê và nút chơi lại ván mới (trộn lại)","Lưu điểm tốt nhất theo từng kích thước lưới"],
 w:"Cơ chế game chỉ là một mảng thẻ và vài quy tắc so khớp — logic nhẹ nhàng. Ảnh người dùng nạp vào được thu nhỏ qua Canvas rồi giữ trong bộ nhớ phiên (hoặc IndexedDB nếu muốn lưu bộ ảnh), nên game vẫn gọn.",
 a:"Trạng thái ván: mảng thẻ đã trộn {id cặp, đang mở?, đã khớp?} và thẻ đầu tiên đang chờ. Luật: lật thẻ thứ hai → khớp thì giữ mở, không khớp thì chờ ~0,8 giây rồi úp cả hai (khoá thao tác trong lúc chờ). Thắng khi mọi cặp đã khớp.",
 ai:["Khung: lưới thẻ tĩnh 4×3 với vài thẻ đang mở mẫu. Kiểm tra thẻ đủ to cho ngón tay trẻ em.","Cốt lõi: lật, so khớp, đếm lượt đúng luật. Kiểm thử trường hợp bấm nhanh liên tục vào nhiều thẻ — không được kẹt trạng thái.","Lưu trữ: lưu điểm tốt nhất và bộ ảnh tuỳ biến (đã thu nhỏ) nếu muốn dùng lại; xuất/nhập bộ ảnh theo chủ đề.","Đánh bóng: hiệu ứng lật thẻ 3D bằng CSS, âm thanh khi khớp đôi, chế độ hai người chơi luân phiên tính điểm."],
 x:"Cạm bẫy: cho phép lật thẻ thứ ba trong lúc hai thẻ sai đang chờ úp làm trạng thái rối — khoá bảng trong nhịp chờ. Cạm bẫy hai: dùng ảnh quá to làm game giật trên máy yếu; thu nhỏ mọi ảnh về cạnh ~400 px. Nâng cấp: chế độ học tập (thẻ chữ + thẻ nghĩa phải khớp nhau), bảng thành tích theo ngày cho trẻ."},
 en:{t:"Memory match game",p:"The flip-card memory game is a classic for all ages: a grid of face-down cards, flip two and find the matching pairs. A home-made version lets you use your own family photos, pet pictures or learning images (national flags, letters) as content — making the game truly yours in minutes.",
 f:["Choose the picture set: built-in icons, your uploaded photos, or words/vocabulary for learning","Choose grid size 4×3, 4×4, 6×5 by age","Count flips and time; matched pairs stay open, misses flip back after a beat","A win screen with statistics and a reshuffled new-game button","Save best scores per grid size"],
 w:"The game mechanics are just a card array and a few matching rules — light logic. User photos are shrunk via Canvas and kept in session memory (or IndexedDB if you want the set saved), so the game stays lean.",
 a:"Board state: a shuffled card array {pair id, face-up?, matched?} plus the first card awaiting its partner. Rule: flip a second card → match keeps both open; miss waits ~0.8 s then flips both back (input locked during the wait). Winning is all pairs matched.",
 ai:["Frame: a static 4×3 card grid with a few sample face-up cards. Check cards are big enough for children's fingers.","Core: flipping, matching and flip-counting follow the rules. Test rapid tapping on many cards — the state must never jam.","Storage: save best scores and the custom photo set (shrunken) if you want it reusable; export/import themed sets.","Polish: a CSS 3D flip effect, a sound on matching, a two-player turn-taking score mode."],
 x:"Pitfall: allowing a third flip while two wrong cards await flipping back scrambles the state — lock the board during the wait beat. Pitfall two: oversized photos making the game stutter on weak machines; shrink all images to ~400 px edges. Upgrades: a study mode (word card must match meaning card), a daily achievement board for kids."}},

{n:38,g:"E",d:"mid",tech:"branching JSON script",
 vi:{t:"Truyện tương tác / visual novel",p:"Người thích viết truyện thường kẹt ở chỗ độc giả chỉ đọc thụ động. Truyện tương tác — mỗi đoạn kết thúc bằng lựa chọn, lựa chọn rẽ sang đoạn khác, có kết thúc khác nhau — biến người đọc thành người chơi. Một 'động cơ' truyện nhỏ đọc kịch bản từ dữ liệu JSON là đủ để xuất bản tác phẩm đầu tay dạng này.",
 f:["Màn hình đọc: nền minh hoạ đơn giản, khung thoại hiện chữ dần","Lựa chọn ở cuối đoạn rẽ sang các đoạn khác nhau; nút quay lại đoạn trước","Nhiều kết thúc; trang tổng kết liệt kê các kết thúc đã khám phá","Ô soạn/thay kịch bản bằng file JSON nạp vào — viết truyện không cần đụng code động cơ","Lưu vị trí đang đọc và các kết thúc đã mở"],
 w:"Động cơ truyện là một máy trạng thái trên đồ thị đoạn: hiển thị đoạn hiện tại, đợi lựa chọn, nhảy sang đoạn đích. Kịch bản tách hoàn toàn khỏi động cơ dưới dạng dữ liệu, nên một file chứa được nhiều truyện và người viết chỉ phải học một định dạng JSON đơn giản.",
 a:"Kịch bản là một từ điển các đoạn {id, người nói, nội dung, ảnh nền?, lựa chọn: [{chữ, tới}]}. Động cơ giữ biến 'đoạn hiện tại' và lịch sử đã qua. Lưu trữ chỉ cần id đoạn hiện tại + tập kết thúc đã mở.",
 ai:["Khung: màn hình đọc tĩnh với một đoạn mẫu và hai nút lựa chọn. Kiểm tra tốc độ hiện chữ và cỡ chữ đọc lâu có mỏi mắt không.","Cốt lõi: bấm lựa chọn thì nhảy đúng đoạn; quay lại được; tới đoạn kết thúc thì ghi nhận kết thúc đó. Kiểm thử bằng một truyện mẫu 6 đoạn có 2 kết thúc do bạn viết sẵn.","Lưu trữ: nối nạp kịch bản từ file JSON (báo lỗi rõ khi sai id đích); lưu vị trí đọc vào localStorage.","Đánh bóng: hiệu ứng hiện chữ từng ký tự có thể tắt, nền theo đoạn, nhạc nền nhẹ tuỳ chọn, trang bản đồ các nhánh đã đi."],
 x:"Cạm bẫy của người viết: nhánh truyện phình to theo cấp số nhân — hãy thiết kế các nhánh hội tụ về nút chung thay vì rẽ mãi. Cạm bẫy kỹ thuật: lựa chọn trỏ tới id không tồn tại làm truyện chết giữa chừng; công cụ phải kiểm tra toàn bộ kịch bản khi nạp và báo đoạn nào hỏng. Nâng cấp: biến trạng thái (điểm thiện cảm, vật phẩm) ảnh hưởng lựa chọn hiện ra, xuất bản truyện thành file riêng chỉ chứa động cơ + kịch bản đó."},
 en:{t:"Interactive story / visual novel",p:"Fiction writers often stall on readers being passive. Interactive stories — each passage ends with a choice, choices branch to other passages, endings differ — turn the reader into a player. A small story 'engine' reading its script from JSON data is enough to publish a first work in this form.",
 f:["A reading screen: simple illustrated background, a dialogue box typing out text gradually","Choices at passage ends branch to different passages; a back button","Multiple endings; a summary page listing discovered endings","Load/replace the script from a JSON file — writing a story never touches engine code","Save reading position and unlocked endings"],
 w:"A story engine is a state machine over a passage graph: show the current passage, await a choice, jump to the target passage. The script lives entirely apart from the engine as data, so one file can hold many stories and the writer only learns one simple JSON format.",
 a:"The script is a dictionary of passages {id, speaker, content, background?, choices: [{text, to}]}. The engine holds a 'current passage' variable and a visited history. Storage only needs the current passage id plus the set of unlocked endings.",
 ai:["Frame: a static reading screen with one sample passage and two choice buttons. Check typing speed and whether the text size is comfortable for long reading.","Core: choices jump to the correct passages; going back works; reaching an ending records it. Test with a sample 6-passage, 2-ending story you write in advance.","Storage: wire script loading from a JSON file (clear errors for bad target ids); save reading position to localStorage.","Polish: a toggleable typewriter effect, per-passage backgrounds, optional light background music, a map page of travelled branches."],
 x:"The writer's pitfall: branches multiplying exponentially — design branches to converge back onto shared nodes instead of splitting forever. The technical pitfall: a choice pointing at a nonexistent id kills the story mid-way; the tool must validate the whole script on load and report broken passages. Upgrades: state variables (affection points, items) that change which choices appear, publishing a story as its own file with engine + that script only."}},

{n:39,g:"E",d:"easy",tech:"Canvas spin animation",
 vi:{t:"Bánh xe quay may mắn",p:"Chọn ai trả lời câu hỏi, bốc thăm người trúng thưởng, quyết định 'trưa nay ăn gì' trong nhóm — một bánh xe quay với các ô tên là cách quyết định công bằng mà ai cũng vui vẻ chấp nhận kết quả. Đây cũng là ý tưởng Canvas đầu tay dễ nhất: hiệu ứng quay chậm dần tạo cảm giác hồi hộp rất 'thật'.",
 f:["Nhập danh sách mục (mỗi dòng một mục), bánh xe tự chia ô và tô màu luân phiên","Bấm quay: bánh xe quay với gia tốc rồi chậm dần tự nhiên, dừng ở một ô thắng","Kim chỉ và âm thanh tích tắc khi quay qua các ô","Công bố kết quả nổi bật; tuỳ chọn loại mục thắng khỏi vòng sau","Lưu các danh sách thường dùng (lớp học, nhóm bạn, thực đơn)"],
 w:"Bánh xe là một hình tròn chia theo tỉ lệ đều, quay bằng vòng lặp Canvas với vận tốc góc giảm dần theo hàm mũ — vài chục dòng logic. Âm thanh tích tắc phát mỗi khi kim qua ranh một ô. Không cần dữ liệu ngoài nào.",
 a:"Trạng thái: danh sách mục và góc quay hiện tại. Khi quay: chọn trước ô thắng ngẫu nhiên, tính góc đích, rồi cho bánh xe chuyển động theo đường cong giảm tốc (ease-out) tới đúng góc đích — cách này cho kết quả công bằng và chuyển động đẹp cùng lúc.",
 ai:["Khung: bánh xe tĩnh 8 ô có chữ và kim chỉ. Kiểm tra chữ trong ô có đọc được khi ô nằm ngang/dọc không.","Cốt lõi: quay và dừng đúng ô đã chọn, không lệch sang ô kề. Kiểm thử 20 lần quay liên tiếp, so ô dừng với ô máy chọn.","Lưu trữ: lưu danh sách mục vào localStorage; tuỳ chọn loại mục thắng sau mỗi vòng.","Đánh bóng: âm thanh tích tắc đồng bộ số ô đi qua, hiệu ứng giấy màu khi công bố, chế độ quay nhanh cho lớp học đông mục (50+)."],
 x:"Cạm bẫy: tự làm chuyển động quay bằng cách trừ vận tốc đều sẽ dừng 'cục' và đôi khi lệch ô; dùng đường cong ease-out tới góc đích đã định là cách đúng. Cạm bẫy hai: chữ trong ô bị ngược khi ô ở nửa dưới vòng tròn — xoay chữ theo hướng tâm. Nâng cấp: tỉ trọng ô theo trọng số (mục quan trọng ô to hơn), nhiều bánh xe phụ cho giải nhì/ba."},
 en:{t:"Spin-the-wheel of fortune",p:"Picking who answers a question, drawing a prize winner, deciding 'what's for lunch' as a group — a spinning wheel of names is a fair decision everyone happily accepts. It's also the easiest first Canvas idea: the slowing spin creates a genuinely suspenseful feel.",
 f:["Enter a list of entries (one per line); the wheel auto-segments and colours alternately","Press spin: the wheel accelerates then decelerates naturally, stopping on a winning segment","A pointer and ticking sounds as segments pass","A prominent result announcement; option to remove the winner from the next round","Save frequently used lists (class, friend group, menus)"],
 w:"A wheel is a circle split into equal segments, spun by a Canvas loop with exponentially decaying angular velocity — a few dozen lines of logic. Tick sounds fire each time the pointer crosses a segment boundary. No external data needed.",
 a:"State: the entry list and the current rotation angle. On spin: pick the winning segment randomly in advance, compute the target angle, then animate the wheel along an ease-out curve to exactly that angle — yielding a fair result and a beautiful motion at once.",
 ai:["Frame: a static 8-segment wheel with labels and a pointer. Check segment text is readable at horizontal and vertical positions.","Core: spinning stops exactly on the chosen segment, never slipping to a neighbour. Test 20 consecutive spins, comparing stop segment with the machine's pick.","Storage: save entry lists to localStorage; the remove-winner option after each round.","Polish: tick sounds synced to segments passed, confetti on announcement, a fast-spin mode for large lists (50+ entries)."],
 x:"Pitfall: hand-rolled spin physics with constant deceleration stops abruptly and sometimes off-segment; an ease-out curve to a predetermined target angle is the correct approach. Pitfall two: upside-down text in the wheel's lower half — rotate labels radially. Upgrades: weighted segments (important entries get bigger slices), secondary wheels for second/third prizes."}},

{n:40,g:"E",d:"easy",tech:"Web Audio",
 vi:{t:"Bảng âm thanh (soundboard)",p:"Một lưới nút, mỗi nút là một âm thanh: tiếng cười, hồi trống, câu cửa miệng của nhóm, hiệu ứng cho buổi thuyết trình hay lớp học. Soundboard là công cụ 'vui' kinh điển của streamer và giáo viên — và là dự án Web Audio dễ nhất để bắt đầu vì không cần lập lịch chính xác.",
 f:["Lưới nút âm thanh với nhãn và màu riêng; bấm là phát ngay","Nạp âm thanh của bạn từ file (mp3/wav ngắn) hoặc dùng bộ âm tổng hợp có sẵn","Chỉnh âm lượng chung; nút dừng tất cả","Gán phím tắt bàn phím cho các nút hay dùng","Lưu bảng âm thanh (file âm thanh nhỏ được lưu IndexedDB) để dùng lại"],
 w:"Phát một file âm thanh khi bấm nút là năng lực cơ bản nhất của trình duyệt; âm thanh tổng hợp bằng Web Audio càng không cần file. Các file người dùng nạp được thu gọn bằng cách giới hạn độ dài và lưu IndexedDB thay vì localStorage.",
 a:"Mỗi nút là {nhãn, màu, nguồn âm: file đã nạp hoặc công thức tổng hợp, phím tắt}. Bộ phát giữ một AudioContext chung; bấm nút thì phát nguồn tương ứng, có thể chồng nhiều tiếng cùng lúc. Nút dừng tất cả cắt mọi nguồn đang phát.",
 ai:["Khung: lưới 8 nút tĩnh với nhãn và màu. Kiểm tra nút đủ to để bấm nhanh khi đang thuyết trình.","Cốt lõi: bấm phát đúng tiếng, phát chồng được, dừng tất cả hoạt động. Kiểm thử bấm dồn dập 10 nút liên tiếp.","Lưu trữ: nạp file âm thanh của bạn và lưu vào IndexedDB; bộ âm tổng hợp không cần lưu.","Đánh bóng: phím tắt, kéo thả đổi vị trí nút, chế độ trình diễn toàn màn hình chữ to trên nút."],
 x:"Cạm bẫy: trình duyệt chặn âm thanh trước lần chạm đầu tiên — khởi tạo AudioContext ngay ở lần bấm đầu tiên là đủ, đừng cố phát lúc tải trang. Cạm bẫy hai: file âm thanh dài và nặng làm bảng ì ạch; giới hạn mỗi file vài giây và vài trăm KB, cắt bằng công cụ ngoài trước khi nạp. Nâng cấp: ghi âm trực tiếp từ micro vào một nút (MediaRecorder), chia sẻ bảng âm thanh qua file xuất/nhập."},
 en:{t:"Soundboard",p:"A grid of buttons, each one a sound: laughter, a drum roll, the group's catchphrase, effects for a presentation or a classroom. The soundboard is the classic 'fun' tool of streamers and teachers — and the easiest Web Audio project to start with, because it needs no precise scheduling.",
 f:["A grid of sound buttons with labels and colours; tap to play instantly","Load your own sounds from files (short mp3/wav) or use the built-in synthesised set","Master volume control; a stop-all button","Assign keyboard shortcuts to favourite buttons","Save the board (small audio files stored in IndexedDB) for reuse"],
 w:"Playing an audio file on a button tap is the browser's most basic audio capability; synthesised sounds via Web Audio need no files at all. User-loaded files stay manageable by capping length and storing them in IndexedDB rather than localStorage.",
 a:"Each button is {label, colour, sound source: loaded file or synthesis recipe, hotkey}. The player keeps one shared AudioContext; tapping a button plays its source, with multiple sounds allowed to overlap. Stop-all cuts every playing source.",
 ai:["Frame: a static grid of 8 labelled, coloured buttons. Check buttons are big enough to hit quickly mid-presentation.","Core: taps play the right sound, overlaps work, stop-all works. Stress-test by hammering 10 buttons in a row.","Storage: load your audio files and save them to IndexedDB; the synthesised set needs no storage.","Polish: hotkeys, drag-to-rearrange buttons, a fullscreen presentation mode with large button labels."],
 x:"Pitfall: browsers block audio before the first interaction — initialising the AudioContext on the first tap suffices; never try to play on page load. Pitfall two: long, heavy audio files making the board sluggish; cap files at a few seconds and a few hundred KB, trimmed externally before loading. Upgrades: record directly from the microphone into a button (MediaRecorder), share boards via export/import files."}},

{n:41,g:"E",d:"easy",tech:"localStorage · timing",
 vi:{t:"Game gõ phím luyện tốc độ",p:"Tốc độ gõ phím là kỹ năng nền của mọi công việc văn phòng, và cách duy nhất để tăng nó là luyện có đo lường: từ mỗi phút (WPM), tỉ lệ đúng, những phím hay sai. Một trang luyện gõ tối giản với đoạn văn mẫu (cả tiếng Việt có dấu) và thống kê theo ngày biến 5 phút luyện tập thành thói quen đo được.",
 f:["Đoạn văn mẫu hiện mờ; gõ đúng thì chữ sáng lên, gõ sai tô đỏ tại chỗ","Đo WPM và độ chính xác theo thời gian thực; kết quả cuối mỗi lượt","Chế độ luyện riêng các ký tự hay sai của bạn","Thống kê theo ngày và biểu đồ tiến bộ; lưu trên máy","Nhiều bộ văn mẫu: tiếng Việt có dấu, tiếng Anh, đoạn code cho lập trình viên"],
 w:"Mọi phép đo đều là đếm ký tự và trừ thời gian ngay trong trang — không cần gì ngoài JavaScript thuần. Văn mẫu là dữ liệu chữ nhúng sẵn. Phần tinh tế duy nhất là xử lý bộ gõ tiếng Việt (IME): sự kiện composition phải được tính đúng, và đó là điều phải dặn AI rõ.",
 a:"Trạng thái lượt gõ: chỉ số ký tự hiện tại, số ký tự đúng/sai, thời điểm bắt đầu (từ phím đầu tiên). Mỗi phím gõ so với ký tự đích tại chỉ số; sai thì đánh dấu nhưng vẫn tiến (hoặc khoá tới khi sửa, theo chế độ chọn). WPM = (ký tự đúng / 5) / số phút.",
 ai:["Khung: đoạn văn mẫu tĩnh với vài ký tự đã 'gõ mẫu' và vùng thống kê. Kiểm tra phông chữ mono và khoảng cách dòng đủ thoáng để mắt không lạc.","Cốt lõi: gõ thì đo đúng — tự kiểm thử bằng cách gõ một đoạn quen thuộc ở tốc độ biết trước và đối chiếu WPM. Kiểm thử riêng với bộ gõ tiếng Việt bật.","Lưu trữ: lưu kết quả từng lượt theo ngày vào localStorage; biểu đồ tiến bộ tuần.","Đánh bóng: chế độ luyện ký tự yếu, âm thanh phím nhẹ tuỳ chọn, chế độ thi 60 giây chuẩn, giao diện tối."],
 x:"Cạm bẫy lớn nhất với người Việt: bộ gõ Telex/VNI biến nhiều lần bấm phím thành một ký tự có dấu — nếu công cụ đếm theo sự kiện phím thô, điểm số sẽ sai hoàn toàn. Hãy yêu cầu AI xử lý theo sự kiện composition/input và kiểm thử bằng đoạn văn có dấu đầy đủ. Cạm bẫy hai: WPM tính cả ký tự sai sẽ khuyến khích gõ ẩu; chuẩn là chỉ đếm ký tự đúng. Nâng cấp: bài luyện sinh từ chính những từ bạn hay sai, thi đua với bạn bè bằng cách xuất/nhập kết quả."},
 en:{t:"Typing speed game",p:"Typing speed is a foundation skill of all office work, and the only way to raise it is measured practice: words per minute, accuracy, your most-missed keys. A minimal typing trainer with sample texts (including fully-diacritised Vietnamese) and per-day statistics turns 5 practice minutes into a measurable habit.",
 f:["Sample text shown dimmed; correct keys light characters up, errors highlight in place","Live WPM and accuracy measurement; end-of-round results","A drill mode for your personal most-missed characters","Per-day statistics and a progress chart; saved on the machine","Several text sets: diacritised Vietnamese, English, code snippets for programmers"],
 w:"Every measurement is character counting and time subtraction right on the page — nothing beyond plain JavaScript. Sample texts are embedded character data. The one subtlety is the Vietnamese input method (IME): composition events must be handled correctly, and that's something to brief the AI explicitly.",
 a:"Round state: current character index, correct/error counts, start timestamp (from the first keystroke). Each typed character compares against the target at the index; errors are marked but flow continues (or lock until fixed, per chosen mode). WPM = (correct characters / 5) / minutes.",
 ai:["Frame: a static sample text with a few pre-'typed' characters and a stats area. Check the monospace font and line spacing are airy enough that eyes don't get lost.","Core: typing measures correctly — self-test by typing a familiar passage at a known speed and comparing WPM. Test separately with the Vietnamese IME on.","Storage: save each round's result by day to localStorage; a weekly progress chart.","Polish: weak-character drills, optional soft key sounds, a standard 60-second test mode, dark theme."],
 x:"The biggest pitfall for Vietnamese users: Telex/VNI input methods turn several raw keystrokes into one diacritised character — counting raw key events makes scores completely wrong. Have the AI handle composition/input events and test with fully-diacritised text. Pitfall two: WPM counting wrong characters rewards sloppy typing; the standard is correct characters only. Upgrades: drills generated from your own most-missed words, friendly rivalry via exported/imported results."}},

{n:42,g:"E",d:"mid",tech:"room/choice data model",
 vi:{t:"Cỗ máy phiêu lưu chữ",p:"Game phiêu lưu bằng chữ (text adventure) là dòng game lâu đời nhất: 'Bạn đang đứng trước một hang tối. Phía bắc có lối đi, trên đất có một thanh kiếm.' Toàn bộ game là chữ và lựa chọn — không đồ hoạ, không âm thanh bắt buộc — nên đây là sân chơi hoàn hảo để người thích viết lôi kéo bạn bè vào thế giới của mình.",
 f:["Khung đọc truyện dạng cuộn, gõ lệnh đơn giản (đi bắc, lấy kiếm) hoặc bấm lựa chọn có sẵn","Hệ thống phòng và vật phẩm: nhặt, dùng, kết hợp đơn giản","Bản đồ các phòng đã đi qua (vẽ tự động dạng lưới)","Lưu/tải ván chơi; nhiều câu chuyện nạp từ file dữ liệu riêng","Điểm số hoặc điều kiện thắng/thua theo kịch bản"],
 w:"Toàn bộ 'động cơ' là một từ điển phòng và một vòng lặp đọc lệnh — logic cổ điển mà AI viết rất chắc tay. Dữ liệu truyện tách khỏi động cơ nên viết truyện mới chỉ là soạn dữ liệu, và một file chứa được cả động cơ lẫn vài truyện mẫu.",
 a:"Dữ liệu: các phòng {id, mô tả, lối đi: {hướng: phòng đích}, vật phẩm}. Trạng thái người chơi: phòng hiện tại, túi đồ, cờ sự kiện. Bộ phân tích lệnh tách động từ + danh từ và đối chiếu với hành động hợp lệ trong phòng hiện tại. Mô hình này gần với Ý 38 nhưng thiên về lệnh gõ và khám phá không gian.",
 ai:["Khung: khung truyện tĩnh với đoạn mở đầu và ô nhập lệnh. Kiểm tra khung cuộn và cỡ chữ đọc truyện dài.","Cốt lõi: di chuyển giữa 4 phòng mẫu, nhặt và dùng một vật phẩm mở được một lối đi bị khoá. Kiểm thử các lệnh sai chính tả và lệnh vô nghĩa — game phải đáp lại lịch sự, không chết.","Lưu trữ: lưu ván (phòng, túi đồ, cờ) vào localStorage; nạp truyện mới từ file dữ liệu.","Đánh bóng: bản đồ tự vẽ, gợi ý lệnh khi gõ, chế độ nút bấm lựa chọn cho người chơi trên điện thoại."],
 x:"Cạm bẫy: bộ phân tích lệnh quá khắt khe làm người chơi ức chế ('game không hiểu tôi') — hãy hào phóng với từ đồng nghĩa và luôn có lệnh 'gợi ý'. Cạm bẫy hai: trạng thái truyện rối khi vật phẩm được dùng ở phòng không lường trước; kiểm thử ma trận vật phẩm × phòng bằng danh sách. Nâng cấp: NPC nói chuyện theo cây hội thoại, xuất bản câu chuyện thành file riêng để tặng bạn bè."},
 en:{t:"Text adventure engine",p:"Text adventures are the oldest game genre: 'You stand before a dark cave. A path leads north; a sword lies on the ground.' The whole game is words and choices — no graphics, no obligatory sound — making it the perfect playground for writers to pull friends into their world.",
 f:["A scrolling story pane; type simple commands (go north, take sword) or tap offered choices","A room and item system: pick up, use, simple combinations","A map of visited rooms (auto-drawn as a grid)","Save/load games; multiple stories loadable from separate data files","Score or win/lose conditions per the script"],
 w:"The entire 'engine' is a dictionary of rooms and a command-reading loop — classic logic that AI writes very reliably. Story data lives apart from the engine, so authoring a new story is just preparing data, and one file can hold the engine plus several sample stories.",
 a:"Data: rooms {id, description, exits: {direction: target room}, items}. Player state: current room, inventory, event flags. The command parser splits verb + noun and matches them against actions valid in the current room. This model neighbours Idea 38 but leans toward typed commands and spatial exploration.",
 ai:["Frame: a static story pane with the opening passage and a command input. Check scrolling and text size for long reading.","Core: move between 4 sample rooms, pick up and use an item to open a locked exit. Test misspelled and nonsense commands — the game must reply politely, never die.","Storage: save the game (room, inventory, flags) to localStorage; load new stories from data files.","Polish: an auto-drawn map, command hints while typing, a tap-choice mode for phone players."],
 x:"Pitfall: an overly strict command parser frustrates players ('the game doesn't understand me') — be generous with synonyms and always offer a 'hint' command. Pitfall two: story state tangling when an item is used in an unforeseen room; test the item × room matrix with a checklist. Upgrades: NPCs with dialogue trees, publishing a story as its own file to gift to friends."}},

/* ---------- GROUP F ---------- */
{n:43,g:"F",d:"mid",tech:"debt-simplification algorithm",
 vi:{t:"Chia tiền nhóm thông minh",p:"Đi ăn, đi du lịch nhóm: người trả tiền mặt trước, người chuyển khoản sau, người chỉ ăn một nửa phần — cuối buổi cả nhóm ngồi cộng trừ như kế toán và vẫn sai. Một công cụ chia tiền biết 'tối thiểu hoá số lần chuyển khoản' biến mớ bòng bong thành danh sách ngắn gọn: ai chuyển cho ai bao nhiêu.",
 f:["Tạo nhóm và các thành viên; thêm khoản chi: ai trả, bao nhiêu, chia cho những ai","Chia đều hoặc chia theo phần (người ăn nhiều 2 phần, trẻ em nửa phần)","Kết quả tối ưu: danh sách chuyển khoản ít nhất để mọi người hoà","Chụp/xuất danh sách kết quả dạng ảnh hoặc text để gửi vào nhóm chat","Lưu các chuyến đi/sự kiện riêng biệt; xuất/nhập sao lưu"],
 w:"Thuật toán cân nợ là toán học thuần: tính số dư ròng của từng người rồi ghép người nợ với người được nợ sao cho số giao dịch ít nhất. Dữ liệu một chuyến đi rất nhỏ. Không cần đồng bộ thời gian thực — một người nhập, cả nhóm xem ảnh kết quả là đủ.",
 a:"Dữ liệu: danh sách khoản chi {người trả, số tiền, danh sách người hưởng + trọng số}. Số dư của mỗi người = đã trả − phần phải chịu. Thuật toán tham lam: sắp xếp người nợ và người được nợ, ghép dần cho tới khi mọi số dư về 0. Màn hình kết quả là danh sách giao dịch suy ra từ thuật toán đó.",
 ai:["Khung: màn hình thêm khoản chi tĩnh và bảng kết quả mẫu. Kiểm tra thuật ngữ 'người trả / người hưởng' có dễ hiểu với người ngoài ngành không.","Cốt lõi: tính số dư đúng với chia đều và chia theo trọng số. Kiểm thử bằng ví dụ 3 người tính tay được, và trường hợp một người trả hộ hai khoản.","Lưu trữ: lưu từng sự kiện (chuyến đi) riêng vào localStorage; đóng sự kiện thì khoá sửa để tránh sửa nhầm về sau.","Đánh bóng: xuất ảnh kết quả đẹp để gửi nhóm, làm tròn tiền tới nghìn đồng kèm ghi chú phần lẻ, sao chép kết quả dạng text."],
 x:"Cạm bẫy: làm tròn tiền khiến tổng nợ không khớp vài trăm đồng — chốt quy tắc làm tròn và gán phần lẻ cho người tổ chức, hiển thị minh bạch. Cạm bẫy hai: khoản chi 'chỉ vài người hưởng' bị nhập thành cả nhóm; giao diện chọn người hưởng phải rõ ràng từng khoản. Nâng cấp: ghi nhận khoản đã thanh toán để sự kiện dài ngày luôn biết còn ai nợ ai, hỗ trợ nhiều loại tiền tệ cho chuyến đi nước ngoài."},
 en:{t:"Smart group bill splitter",p:"Group dinners and trips: one person pays cash upfront, another transfers later, someone only ate half a portion — and the evening ends with everyone doing accounting on napkins, still wrong. A splitter that 'minimises the number of transfers' turns the tangle into a short list: who transfers how much to whom.",
 f:["Create a group and members; add expenses: who paid, how much, shared by whom","Split equally or by shares (big eater 2 shares, kid half a share)","Optimal result: the shortest transfer list that settles everyone","Export the result list as an image or text for the group chat","Keep separate trips/events; export/import backup"],
 w:"Debt simplification is pure mathematics: compute each person's net balance, then match debtors to creditors so the number of transactions is minimal. One trip's data is tiny. No real-time sync needed — one person enters, everyone views the result image.",
 a:"Data: an expense list {payer, amount, beneficiaries + weights}. Each balance = paid − owed share. A greedy algorithm: sort debtors and creditors, match them off until every balance reaches zero. The result screen is the transaction list derived from that algorithm.",
 ai:["Frame: a static add-expense screen and a sample result table. Check the 'payer / beneficiary' wording is clear to non-accountants.","Core: balances compute correctly for equal and weighted splits. Test with a hand-computable 3-person example, and one person fronting two expenses.","Storage: save each event (trip) separately in localStorage; closing an event locks editing to prevent later accidents.","Polish: a good-looking result image for the group chat, rounding to the nearest thousand with the remainder noted transparently, copy-result-as-text."],
 x:"Pitfall: rounding makes total debts mismatch by a few hundred — settle a rounding rule, assign the remainder to the organiser, and display it transparently. Pitfall two: 'only a few people shared this' expenses entered as whole-group; the beneficiary picker must be unmistakable per expense. Upgrades: record settled transfers so long trips always know who still owes whom, multi-currency support for trips abroad."}},

{n:44,g:"F",d:"mid",tech:"state-in-URL · tally flow",
 vi:{t:"Bình chọn / thăm dò qua link",p:"Nhóm cần chốt nhanh một quyết định — chọn ngày họp, chọn nhà hàng, chọn tên sản phẩm — mà lập form khảo sát trực tuyến thì phải đăng nhập và chờ đợi. Bình chọn qua link hoạt động khác: người tổ chức tạo phiếu, link chứa sẵn câu hỏi và lựa chọn; mọi người mở link, chọn, và gửi lại kết quả bằng một link trả lời.",
 f:["Tạo bình chọn: câu hỏi, các lựa chọn, chọn một hay nhiều đáp án","Link bình chọn chứa toàn bộ câu hỏi — gửi qua bất kỳ kênh chat nào","Người được mời mở link, chọn đáp án, nhận một 'link kết quả' để gửi lại cho người tổ chức","Trang tổng hợp của người tổ chức: dán các link kết quả vào để cộng dồn và xem biểu đồ","Nói rõ giới hạn ngay trong giao diện: không chống gian lận, phù hợp nhóm tin cậy lẫn nhau"],
 w:"Đây là ý tưởng minh hoạ trung thực nhất cho Chương 2: một file không có máy chủ nên không tự thu thập phiếu được. Mẫu 'trạng thái trong URL' biến mỗi phiếu thành một link — đủ tốt cho nhóm nhỏ tin cậy, và sách nói thẳng nó không phải hệ thống bầu cử chống gian lận.",
 a:"Hai loại link: link mời (chứa câu hỏi + lựa chọn, mã hoá vào hash) và link phiếu (chứa lựa chọn đã chọn + mã của bình chọn). Trang tổng hợp đọc nhiều link phiếu, kiểm tra cùng mã bình chọn rồi cộng dồn. Biểu đồ kết quả vẽ bằng vài thẻ div theo tỉ lệ.",
 ai:["Khung: màn hình tạo bình chọn và màn hình bầu chọn tĩnh. Kiểm tra link mời mở trên điện thoại người khác có hiện đúng câu hỏi.","Cốt lõi: trọn vòng đời — tạo, bầu, nhận link phiếu, dán vào trang tổng hợp, biểu đồ đúng số. Kiểm thử bằng 5 phiếu giả lập, có phiếu trùng và phiếu của bình chọn khác.","Lưu trữ: người tổ chức lưu các bình chọn đã tạo và phiếu đã nhận vào localStorage.","Đánh bóng: mã QR của link mời, nút sao chép mọi thứ, cảnh báo khi link quá dài (quá nhiều lựa chọn)."],
 x:"Cạm bẫy niềm tin: một người có thể bầu nhiều lần bằng cách gửi nhiều link phiếu — công cụ phải ghi rõ đây là thăm dò tin cậy, không phải bầu cử. Cạm bẫy kỹ thuật: link chứa tiếng Việt phải được mã hoá đúng (encodeURIComponent + base64 an toàn URL), nếu không link sẽ vỡ khi qua một số app chat. Nâng cấp: hạn chót bình chọn hiển thị trong link mời, chế độ xếp hạng (chấm điểm từng lựa chọn)."},
 en:{t:"Polls via link",p:"A group needs to settle something fast — a meeting date, a restaurant, a product name — while online survey forms demand logins and waiting. Link polls work differently: the organiser creates the poll, the link itself carries the question and options; everyone opens the link, chooses, and sends back a 'result link'.",
 f:["Create a poll: question, options, single or multiple answers","The invitation link carries the whole poll — send it through any chat channel","Invitees open the link, pick answers, and receive a 'result link' to send back to the organiser","The organiser's tally page: paste result links in to accumulate and view a chart","Limits stated right in the UI: not fraud-proof, suited to mutually trusting groups"],
 w:"This is the most honest illustration of Chapter 2: with no server, one file cannot collect ballots by itself. The 'state in the URL' pattern turns each ballot into a link — good enough for small trusting groups, and the book states plainly this is not a fraud-proof election system.",
 a:"Two link types: the invitation link (question + options encoded into the hash) and the ballot link (the chosen answers + the poll's id). The tally page reads multiple ballot links, checks they share the poll id, then accumulates. The result chart is a few proportional div bars.",
 ai:["Frame: static poll-creation and voting screens. Check the invitation link opens on someone else's phone showing the right question.","Core: the full life cycle — create, vote, receive a ballot link, paste into the tally page, chart numbers correct. Test with 5 simulated ballots, including a duplicate and one from a different poll.","Storage: the organiser saves created polls and received ballots in localStorage.","Polish: a QR code for the invitation link, copy buttons everywhere, a warning when links get too long (too many options)."],
 x:"The trust pitfall: one person can vote repeatedly by sending multiple ballot links — the tool must state clearly this is a trust-based poll, not an election. The technical pitfall: links containing Vietnamese text must be encoded correctly (encodeURIComponent + URL-safe base64), or some chat apps will break them. Upgrades: a voting deadline shown in the invitation link, ranking mode (rate each option)."}},

{n:45,g:"F",d:"hard",tech:"drag & drop · print · import/export",
 vi:{t:"Quản lý sự kiện / đám cưới",p:"Một đám cưới hay sự kiện 200 khách có hàng chục việc dính nhau: danh sách khách, bàn tiệc, ngân sách, nhà cung cấp, lịch trình ngày diễn ra. Phần mềm tổ chức sự kiện chuyên nghiệp thì đắt và học lâu; một bộ công cụ một-file theo đúng các đầu việc đó — mỗi module đơn giản — là đủ cho một sự kiện gia đình.",
 f:["Danh sách khách: tên, nhóm (nhà trai/gái, công ty…), số người đi kèm, trạng thái xác nhận (RSVP)","Sơ đồ bàn: kéo thả khách vào bàn 10 người, cảnh báo bàn quá tải","Ngân sách: hạng mục dự toán vs thực chi, tổng hợp theo nhóm chi","Danh sách nhà cung cấp kèm liên hệ và trạng thái đặt cọc","In danh sách khách theo bàn và sơ đồ bàn; xuất/nhập toàn bộ dữ liệu sự kiện"],
 w:"Mỗi module là một bài toán quen thuộc đã gặp trong sách: danh sách + chi tiết, kéo-thả như Kanban, tính tiền như hoá đơn. Dữ liệu một sự kiện là vài trăm bản ghi — localStorage đủ sức. Không cần nhiều người sửa cùng lúc vì thường chỉ một ê-kíp tổ chức nắm dữ liệu.",
 a:"Một file, nhiều tab module dùng chung một kho dữ liệu sự kiện {khách, bàn, ngân sách, nhà cung cấp}. Khách là thực thể trung tâm: bàn tham chiếu tới khách, in ấn đọc từ cùng nguồn đó. Mọi module lưu chung một đối tượng sự kiện duy nhất để xuất/nhập một lần là đủ.",
 ai:["Khung: các tab module với dữ liệu mẫu một đám cưới 50 khách. Kiểm tra điều hướng giữa các module không làm mất ngữ cảnh.","Cốt lõi theo thứ tự: danh sách khách + RSVP trước, rồi ngân sách, cuối cùng mới sơ đồ bàn kéo-thả (phần khó nhất để sau).","Lưu trữ: một đối tượng sự kiện duy nhất trong localStorage; xuất/nhập toàn bộ; kiểm thử chuyển máy giữa hai người trong ê-kíp.","Đánh bóng: in sơ đồ bàn và danh sách theo bàn, thống kê nhanh ở trang tổng quan (tổng khách đã xác nhận, % ngân sách đã chi)."],
 x:"Cạm bẫy: tham làm cả bốn module thật sâu ngay từ đầu sẽ không module nào xong — hãy làm danh sách khách thật tốt trước, nó là gốc của mọi thứ. Cạm bẫy hai: kéo-thả khách trên sơ đồ bàn bằng điện thoại rất khó dùng; cần chế độ chọn-bàn bằng danh sách thả xuống dự phòng. Nâng cấp: trang RSVP cho khách qua link trạng thái (mẫu Ý 44), nhắc việc theo mốc đếm ngược tới ngày sự kiện."},
 en:{t:"Event / wedding manager",p:"A 200-guest wedding or event has dozens of interlocking jobs: guest list, seating, budget, vendors, day-of schedule. Professional event software is pricey and slow to learn; a one-file toolkit following exactly those jobs — each module simple — suffices for a family-scale event.",
 f:["Guest list: name, group (groom's/bride's side, company…), plus-ones, RSVP status","Seating plan: drag guests onto 10-person tables, with over-capacity warnings","Budget: planned vs actual per item, summarised by spending group","Vendor list with contacts and deposit status","Print the per-table guest lists and seating chart; export/import the whole event dataset"],
 w:"Each module is a familiar problem from this book: list + detail, Kanban-style drag-and-drop, invoice-style money maths. One event's data is a few hundred records — localStorage is enough. No simultaneous multi-editing needed because typically one organising crew holds the data.",
 a:"One file, several module tabs sharing a single event store {guests, tables, budget, vendors}. The guest is the central entity: tables reference guests, printing reads from the same source. All modules save into one single event object so one export/import covers everything.",
 ai:["Frame: module tabs with sample data for a 50-guest wedding. Check navigation between modules never loses context.","Core in order: guest list + RSVP first, then budget, and only last the drag-and-drop seating (the hardest part goes last).","Storage: one single event object in localStorage; export/import everything; test a machine handover between two crew members.","Polish: print the seating chart and per-table lists, quick stats on an overview page (confirmed guests total, % budget spent)."],
 x:"Pitfall: trying to build all four modules deeply at once finishes none of them — make the guest list truly good first; it's the root of everything. Pitfall two: drag-and-drop seating is painful on phones; provide a dropdown table-picker fallback mode. Upgrades: a guest RSVP page via state links (the Idea 44 pattern), task reminders counting down to the event date."}},

{n:46,g:"F",d:"easy",tech:"image/print export · links",
 vi:{t:"Bảng tin / thông báo đẹp",p:"Thông báo của lớp học, chung cư, câu lạc bộ thường là một đoạn chữ dài trong nhóm chat — trôi mất sau hai ngày và chẳng ai đọc. Một bảng tin được soạn đẹp, xuất thành ảnh để đăng/ghim hoặc in dán tường, có tuổi thọ và sức chú ý hơn hẳn, mà người soạn không cần biết thiết kế.",
 f:["Soạn thông báo: tiêu đề, nội dung ngắn, điểm nhấn (ngày giờ, hạn chót), người liên hệ","Chọn mẫu trình bày theo dịp: thông báo chung, sự kiện, khẩn cấp, chúc mừng","Xem trước dạng ảnh dọc (điện thoại) và dạng in A4","Xuất PNG để đăng vào nhóm/ghim tin nhắn, hoặc in ra dán bảng tin thật","Lưu thư viện thông báo đã phát hành trên máy"],
 w:"Bảng tin là mẫu 'soạn ↔ xem' cộng 'xuất ra sản phẩm': nội dung soạn một lần, kết xuất thành ảnh qua Canvas (hoặc vùng in) ở đúng kích thước đích. Không có dữ liệu nào cần đồng bộ — thông báo là hiện vật để phát hành.",
 a:"Trạng thái là một tài liệu thông báo {tiêu đề, thân, điểm nhấn, mẫu}. Vùng xem trước dựng từ tài liệu đó; xuất ảnh bằng cách vẽ lại nội dung lên Canvas ở độ phân giải đích (hoặc dùng vùng in cho bản A4). Thư viện chỉ lưu lại các tài liệu đã phát hành.",
 ai:["Khung: form soạn và xem trước tĩnh với một thông báo mẫu. Kiểm tra xem trước trên điện thoại: tiêu đề có nổi bật trong 2 giây đầu không.","Cốt lõi: sửa nội dung thì xem trước đổi theo; xuất PNG mở lên phải nét và đúng nội dung. Kiểm thử thông báo dài (tràn khung) và thông báo rất ngắn.","Lưu trữ: lưu thư viện thông báo vào localStorage; tạo thông báo mới từ bản sao của thông báo cũ.","Đánh bóng: 4 mẫu trình bày, mã QR chèn góc ảnh trỏ tới link chi tiết, chế độ in A4 hai cột cho bảng tin giấy."],
 x:"Cạm bẫy: nhồi quá nhiều chữ vào một ảnh khiến không ai đọc — hãy giới hạn mềm số dòng và ép thông báo chỉ chứa một thông điệp chính. Cạm bẫy hai: xuất ảnh độ phân giải thấp làm chữ nhoè khi phóng to trên TV/bảng điện tử; xuất ít nhất gấp đôi kích thước hiển thị. Nâng cấp: lịch phát hành (soạn sẵn nhiều thông báo), bộ mẫu theo nhận diện của tổ chức."},
 en:{t:"Beautiful notice board / announcements",p:"Announcements for a class, a condo block or a club are usually a long text blob in the group chat — gone in two days and read by nobody. A well-composed notice, exported as an image to post/pin or printed for the wall, has far more lifespan and attention, and the author needs no design skills.",
 f:["Compose a notice: headline, short body, highlights (date/time, deadline), contact person","Choose a template by occasion: general, event, urgent, congratulations","Preview in portrait-image form (phone) and A4 print form","Export a PNG to post into the group/pin, or print for a physical board","Keep a library of published notices on the machine"],
 w:"A notice board is the 'edit ↔ view' pattern plus 'export a product': content composed once, rendered to an image via Canvas (or a print region) at the exact target size. Nothing needs syncing — a notice is an artefact to publish.",
 a:"State is one notice document {headline, body, highlights, template}. The preview builds from that document; image export redraws the content onto a Canvas at target resolution (or uses the print region for the A4 edition). The library only stores published documents.",
 ai:["Frame: a compose form and static preview with a sample notice. On a phone, check the headline pops within the first 2 seconds.","Core: editing updates the preview; the exported PNG must be crisp and content-correct. Test a long notice (overflowing the frame) and a very short one.","Storage: save the notice library to localStorage; create new notices by duplicating old ones.","Polish: 4 layout templates, a corner QR code linking to details, a two-column A4 print mode for paper boards."],
 x:"Pitfall: cramming too much text into one image so nobody reads it — soft-limit the lines and force one main message per notice. Pitfall two: low-resolution exports blurring text on TVs/electronic boards; export at least 2× display size. Upgrades: a publishing schedule (compose several notices ahead), template sets in the organisation's identity."}},

{n:47,g:"F",d:"mid",tech:"state-in-URL · .ics",
 vi:{t:"Thiệp mời / lời chúc",p:"Thiệp mời giấy thì chậm và tốn, lời mời bằng tin nhắn chữ thì nhạt và dễ trôi. Một thiệp số đẹp — gửi bằng link, mở lên là thấy thiệp thiết kế riêng với tên người nhận, bấm một nút là thêm vào lịch điện thoại — là cách mời vừa trang trọng vừa thực dụng cho sự kiện gia đình và nhóm nhỏ.",
 f:["Soạn thiệp: sự kiện, thời gian, địa điểm, lời mời, thông tin liên hệ","Cá nhân hoá theo link: tên người nhận hiện ngay trên mặt thiệp","Nhiều mẫu thiệp: sinh nhật, cưới, họp lớp, tân gia…","Nút 'Thêm vào lịch' tải file .ics đúng giờ sự kiện; nút mở bản đồ tới địa điểm","Người gửi tạo link cho từng khách từ một danh sách tên"],
 w:"Mẫu 'trạng thái trong URL' toả sáng ở đây: toàn bộ nội dung thiệp (kể cả tên khách) mã hoá vào link, nên một file duy nhất phục vụ vô số khách mà không cần máy chủ. File .ics là chuẩn lịch mở, điện thoại nào cũng nhận.",
 a:"Hai chế độ trong một file: chế độ người gửi (form soạn + danh sách khách → sinh link) và chế độ người nhận (đọc dữ liệu từ hash, hiện thiệp). Phần hash chứa dữ liệu thiệp đã mã hoá base64-URL an toàn. Nút lịch sinh file .ics từ cùng dữ liệu đó.",
 ai:["Khung: mặt thiệp tĩnh một mẫu với tên khách mẫu. Kiểm tra trên điện thoại: thiệp có 'đã' ngay màn hình đầu không.","Cốt lõi: tạo link từ form, mở link trong trình duyệt ẩn danh — thiệp phải hiện đúng tên khách và thông tin. Kiểm thử tên có dấu tiếng Việt dài.","Lưu trữ: người gửi lưu mẫu thiệp và danh sách khách vào localStorage để tạo link hàng loạt.","Đánh bóng: hiệu ứng mở thiệp nhẹ, nút .ics và bản đồ, nhiều mẫu, đếm ngược tới sự kiện ngay trên thiệp (nối Ý 13)."],
 x:"Cạm bẫy: link quá dài khi lời mời dài dòng — một số app chat cắt link; giữ nội dung thiệp gọn và kiểm thử gửi qua đúng kênh bạn sẽ dùng. Cạm bẫy hai: dữ liệu trong link là đọc được, đừng đưa thông tin nhạy cảm (số phòng, mã cửa) vào thiệp. Nâng cấp: RSVP quay lại bằng link phiếu như Ý 44, thiệp kèm ảnh của chủ tiệc (ảnh phải thu nhỏ và nhúng — cân nhắc dung lượng file)."},
 en:{t:"Invitations / greeting cards",p:"Paper invitations are slow and costly; a plain-text invite is bland and easily lost. A beautiful digital invitation — sent as a link, opening to a designed card bearing the recipient's own name, one tap to add to the phone calendar — is both dignified and practical for family events and small groups.",
 f:["Compose the card: event, time, place, invitation words, contact info","Per-link personalisation: the recipient's name appears right on the card face","Several templates: birthday, wedding, class reunion, housewarming…","An 'Add to calendar' button downloading an .ics at the correct event time; a map button to the venue","The sender generates a link per guest from a name list"],
 w:"The 'state in the URL' pattern shines here: the card's entire content (including the guest's name) is encoded into the link, so one single file serves unlimited guests with no server. The .ics file is the open calendar standard every phone accepts.",
 a:"Two modes in one file: sender mode (compose form + guest list → generate links) and recipient mode (read data from the hash, display the card). The hash holds the card data in URL-safe base64. The calendar button generates the .ics from that same data.",
