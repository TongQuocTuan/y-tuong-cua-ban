 ai:["Frame: a static card face in one template with a sample guest name. On a phone, check the card feels delightful on the very first screen.","Core: generate a link from the form, open it in a private browser window — the card must show the right guest name and details. Test with long Vietnamese names with diacritics.","Storage: the sender saves the card template and guest list in localStorage for batch link generation.","Polish: a gentle card-opening effect, the .ics and map buttons, more templates, a live countdown to the event on the card (linking Idea 13)."],
 x:"Pitfall: overlong invitation text makes overlong links that some chat apps truncate — keep card content tight and test sending through the exact channel you'll use. Pitfall two: link data is readable, so never put sensitive details (room numbers, door codes) in a card. Upgrades: RSVP returning via ballot links as in Idea 44, cards with the host's photo (shrunk and embedded — mind the file size)."}},

{n:48,g:"F",d:"easy",tech:"randomness · Canvas",
 vi:{t:"Bốc thăm & chia đội",p:"Chia đội đá bóng sân nhỏ, bốc thăm thứ tự thuyết trình, phân nhóm làm bài tập — làm thủ công thì bị nghi thiên vị, dùng app trực tuyến thì phải đăng nhập. Một công cụ bốc thăm tại chỗ, hiệu ứng xáo trộn công khai trước mắt mọi người, cho kết quả mà không ai cãi được.",
 f:["Nhập danh sách tên (dán cả danh sách lớp từ Excel)","Chế độ chia đội: chọn số đội hoặc số người mỗi đội, kết quả cân bằng ngẫu nhiên","Chế độ bốc thăm thứ tự: xáo trộn danh sách kèm hiệu ứng hồi hộp","Loại trừ ràng buộc đơn giản: hai người không cùng đội (tuỳ chọn)","Lưu danh sách lớp/nhóm thường dùng; chia sẻ kết quả dạng ảnh"],
 w:"Xáo trộn ngẫu nhiên công bằng là thuật toán Fisher–Yates cổ điển, vài dòng code. Toàn bộ giá trị nằm ở tính minh bạch của khoảnh khắc bốc thăm — chạy ngay trên máy chiếu trước cả nhóm, không máy chủ nào can thiệp được.",
 a:"Trạng thái gồm danh sách tên và chế độ. Chia đội: xáo trộn trước, rồi chia vòng tròn vào các đội (đảm bảo lệch nhau tối đa 1 người). Hiệu ứng hồi hộp chỉ là lớp trình diễn chạy trên cùng kết quả đã chốt — kết quả không đổi trong lúc hiệu ứng chạy.",
 ai:["Khung: ô nhập danh sách và vùng kết quả tĩnh 3 đội mẫu. Kiểm tra dán danh sách 40 tên từ Excel có nhận đúng mỗi dòng một tên.","Cốt lõi: chia đội đúng số lượng và không trùng/thiếu tên — kiểm thử bằng cách đối chiếu tổng số tên trước/sau qua nhiều lần chia.","Lưu trữ: lưu các danh sách thường dùng vào localStorage; lưu lại kết quả chia của buổi hôm nay.","Đánh bóng: hiệu ứng xáo trộn từng tên, âm thanh trống dồn, chế độ loại trừ cặp không cùng đội, xuất ảnh kết quả."],
 x:"Cạm bẫy công bằng: dùng cách sắp xếp ngẫu nhiên 'sort bằng hàm random' sẽ cho phân phối lệch — phải dùng Fisher–Yates đúng chuẩn và nói với AI rõ yêu cầu này. Cạm bẫy hai: tên trùng nhau trong lớp (hai bạn cùng tên) gây nhầm khi đọc kết quả; hiển thị kèm số thứ tự hoặc chữ cái phân biệt. Nâng cấp: chia đội cân bằng theo sức mạnh tự chấm (điểm kỹ năng), bốc thăm có hạt giống cho giải đấu."},
 en:{t:"Draw lots & team splitter",p:"Splitting pickup-football teams, drawing presentation order, assigning group work — done by hand it invites accusations of bias; online apps demand logins. A local draw tool with a public shuffling effect in front of everyone produces results nobody can argue with.",
 f:["Enter a name list (paste a whole class roster from Excel)","Team mode: choose number of teams or people per team; balanced random results","Order-draw mode: shuffle the list with a suspense effect","Simple exclusion constraints: two people not on the same team (optional)","Save frequently used class/group lists; share results as an image"],
 w:"A fair random shuffle is the classic Fisher–Yates algorithm, a few lines of code. All the value lies in the transparency of the drawing moment — running right there on the projector in front of the group, untouchable by any server.",
 a:"State is the name list plus the mode. Team splitting: shuffle first, then deal round-robin into teams (sizes differing by at most one person). The suspense effect is a presentation layer running over an already-fixed result — the outcome never changes while the effect plays.",
 ai:["Frame: a name input and a static 3-team sample result. Test pasting a 40-name list from Excel — one name per line must parse correctly.","Core: teams split with correct counts and no duplicated/missing names — verify by reconciling total names before/after across many splits.","Storage: save frequent lists to localStorage; keep today's split results.","Polish: a per-name shuffle effect, drum-roll sound, exclusion-pair mode, result image export."],
 x:"The fairness pitfall: 'sorting with a random comparator' yields a biased distribution — Fisher–Yates done properly is required, and say so explicitly to the AI. Pitfall two: duplicate names in a class (two students, one name) confuse result reading; display with index numbers or distinguishing letters. Upgrades: skill-balanced teams from self-rated points, seeded draws for tournaments."}},

{n:49,g:"F",d:"mid",tech:"tally flow · links/files",
 vi:{t:"So khung giờ rảnh nhóm",p:"Tìm một khung giờ mà cả 6 người đều rảnh là bài toán tra tấn trong nhóm chat: mỗi người nhắn một kiểu, cuộn lên cuộn xuống không tổng hợp nổi. Các công cụ lịch nhóm trực tuyến bắt mọi người tạo tài khoản. Phiên bản một-file dùng luồng phiếu: phát một link/bảng giờ trống, từng người đánh dấu giờ rảnh của mình và gửi lại, người tổ chức chồng các phiếu lên nhau để thấy khung giờ xanh nhất.",
 f:["Người tổ chức tạo bảng: các ngày và khung giờ đề xuất","Mỗi thành viên mở link/bảng, chạm để đánh dấu các ô mình rảnh, gửi lại phiếu (link hoặc file)","Trang tổng hợp chồng nhiều phiếu: ô càng nhiều người rảnh càng xanh đậm","Khung giờ tốt nhất được gợi ý tự động (nhiều người rảnh nhất, ưu tiên đủ mặt quan trọng)","Nói rõ giới hạn: không đồng bộ trực tiếp, phù hợp nhóm nhỏ chốt giờ họp/sự kiện"],
 w:"Giống Ý 44, đây là ứng dụng trung thực của mẫu 'trạng thái trong URL / qua file': một file không tự thu phiếu được, nên phiếu đi về bằng link hoặc file và được tổng hợp tại máy người tổ chức. Với nhóm 4–10 người, luồng này nhanh hơn mọi hệ thống tài khoản.",
 a:"Một phiếu là lưới nhị phân {ngày × khung giờ} của một người, mã hoá gọn vào link (hoặc file JSON). Trang tổng hợp cộng dồn các lưới thành bản đồ nhiệt: mỗi ô là số người rảnh. Gợi ý khung giờ tốt nhất là phép tìm ô có tổng cao nhất, có trọng số cho thành viên bắt buộc.",
 ai:["Khung: lưới ngày × giờ tĩnh ở cả hai phía — phiếu cá nhân và bản đồ nhiệt tổng hợp. Kiểm tra lưới chạm được trên điện thoại (ô đủ to).","Cốt lõi: trọn luồng — tạo bảng, điền phiếu, xuất link phiếu, nhập 4 link phiếu vào trang tổng hợp, bản đồ nhiệt đúng số. Kiểm thử phiếu trùng của cùng một người.","Lưu trữ: người tổ chức lưu đợt khảo sát và các phiếu đã nhận vào localStorage; đóng đợt khi đã chốt giờ.","Đánh bóng: gợi ý 3 khung giờ tốt nhất, đánh dấu thành viên bắt buộc, mã QR phát phiếu trong buổi gặp trực tiếp."],
 x:"Cạm bẫy: lưới quá mịn (15 phút × 14 ngày) làm người điền nản và bỏ — giữ lưới ở mức 30–60 phút và tối đa ~7 ngày. Cạm bẫy hai: cùng một người gửi hai phiếu làm bản đồ nhiệt sai; khử trùng theo tên người gửi, phiếu sau thay phiếu trước. Nâng cấp: xuất khung giờ đã chốt ra .ics gửi cả nhóm, khảo sát nhiều tuần liên tiếp cho lịch cố định."},
 en:{t:"Group availability matcher",p:"Finding one slot when all 6 people are free is a chat-thread torture: everyone replies in a different format and nothing aggregates. Online group-scheduling tools force everyone to create accounts. The one-file version uses the ballot flow: hand out a link/empty grid, each person marks their free cells and sends it back, and the organiser stacks the ballots to see the greenest slot.",
 f:["The organiser creates a grid: proposed days and time slots","Each member opens the link/grid, taps their free cells, sends the ballot back (link or file)","The tally page stacks ballots: the more people free, the deeper the green","The best slot is suggested automatically (most people free, favouring required attendees)","Limits stated plainly: no live sync, suited to small groups fixing a meeting/event time"],
 w:"Like Idea 44, this is an honest application of the 'state in URL / via file' pattern: one file cannot collect ballots by itself, so ballots return by link or file and aggregate on the organiser's machine. For groups of 4–10, this flow beats every account-based system.",
 a:"A ballot is one person's binary grid {day × slot}, compactly encoded into a link (or a JSON file). The tally page sums the grids into a heat map: each cell is a free-people count. The best-slot suggestion finds the highest-sum cell, weighted for required members.",
 ai:["Frame: static day × hour grids on both sides — the personal ballot and the aggregate heat map. Check the grid is tappable on a phone (cells big enough).","Core: the full flow — create grid, fill a ballot, export its link, import 4 ballot links into the tally page, heat map numbers correct. Test a duplicate ballot from the same person.","Storage: the organiser saves the survey round and received ballots in localStorage; close the round once a time is fixed.","Polish: top-3 slot suggestions, required-member flags, a QR code to hand out ballots in person."],
 x:"Pitfall: an over-fine grid (15 minutes × 14 days) makes filling it a chore people abandon — keep slots at 30–60 minutes and at most ~7 days. Pitfall two: the same person sending two ballots corrupts the heat map; deduplicate by sender name, later ballot replacing the earlier. Upgrades: export the chosen slot as an .ics for the whole group, recurring weekly surveys for a standing schedule."}},

{n:50,g:"F",d:"mid",tech:"localStorage · CSV export",
 vi:{t:"Khảo sát offline → CSV",p:"Thu thập ý kiến tại hiện trường — hội thảo, lớp học, điểm bán, vùng mạng yếu — là nơi form trực tuyến chịu thua: không mạng, không thu được gì. Một form khảo sát chạy trên máy tính bảng tại chỗ, lưu mọi lượt trả lời vào máy và cuối ngày xuất CSV tổng hợp, là đúng công cụ cho đúng hoàn cảnh.",
 f:["Soạn bộ câu hỏi: trắc nghiệm, thang điểm 1–5, ô chữ tự do","Chế độ kiosk: người trả lời xong, bấm nút là form sạch cho người tiếp theo","Đếm số lượt trả lời theo thời gian thực; khoá màn hình soạn bằng mã PIN đơn giản","Xuất toàn bộ câu trả lời ra CSV mở được bằng Excel; biểu đồ tóm tắt nhanh cho câu trắc nghiệm","Dữ liệu chỉ nằm trên máy thu thập; xuất/nhập sao lưu bộ câu hỏi"],
 w:"Mỗi lượt trả lời là một bản ghi nhỏ; cả ngày hội thảo vài nghìn lượt vẫn nhẹ với localStorage. Xuất CSV là đường chuẩn vào mọi công cụ phân tích. Không mạng vẫn chạy 100% — đó là toàn bộ lý do tồn tại của ý này.",
 a:"Ba lớp tách bạch: định nghĩa khảo sát {câu hỏi}, kho dữ liệu câu trả lời (mảng bản ghi có dấu thời gian), và chế độ kiosk là một trạng thái giao diện khoá chặt. Nút 'người tiếp theo' chốt bản ghi hiện tại, xoá form và tăng bộ đếm — ba việc phải xảy ra nguyên tử để không mất lượt.",
 ai:["Khung: form khảo sát mẫu 4 câu và màn hình cảm ơn. Kiểm tra trên máy tính bảng: nút bấm đủ to cho người lớn tuổi.","Cốt lõi: trả lời trọn một lượt thì bản ghi được lưu đúng và form sạch cho người sau. Kiểm thử bỏ qua câu bắt buộc và câu chữ tự do rất dài.","Lưu trữ: lưu câu trả lời vào localStorage theo đợt khảo sát; xuất CSV kiểm chứng bằng Excel ngay trong ngày đầu.","Đánh bóng: mã PIN vào khu vực quản trị, biểu đồ tóm tắt trực tiếp, chế độ chữ lớn, tự làm mới form sau 10 giây ở màn hình cảm ơn."],
 x:"Cạm bẫy: người trả lời tò mò bấm lung tung thoát vào khu vực quản trị thấy dữ liệu người trước — chế độ kiosk phải khoá chặt và PIN bảo vệ phần quản trị. Cạm bẫy hai: mất điện/đóng nhầm tab giữa ngày làm mất niềm tin; dữ liệu phải lưu sau từng lượt trả lời, không chờ cuối ngày. Nâng cấp: nhiều máy thu thập cùng một khảo sát rồi gộp CSV theo mã đợt, câu hỏi rẽ nhánh theo đáp án."},
 en:{t:"Offline survey → CSV",p:"Collecting opinions on site — workshops, classrooms, points of sale, weak-network areas — is where online forms surrender: no network, nothing collected. A survey form running on an on-site tablet, storing every response on the machine and exporting a combined CSV at day's end, is the right tool for exactly that circumstance.",
 f:["Author question sets: multiple choice, 1–5 scales, free-text fields","Kiosk mode: a respondent finishes, one tap and the form is clean for the next person","A live response counter; the authoring screen locked behind a simple PIN","Export all responses to CSV that opens in Excel; quick summary charts for choice questions","Data lives only on the collecting machine; export/import backup of the question set"],
 w:"Each response is a small record; a whole workshop day of a few thousand responses stays light in localStorage. CSV export is the standard road into every analysis tool. It runs 100% with no network — that is this idea's entire reason to exist.",
 a:"Three separated layers: the survey definition {questions}, the response store (an array of timestamped records), and kiosk mode as a tightly locked UI state. The 'next person' button commits the current record, clears the form and increments the counter — three things that must happen atomically so no response is lost.",
 ai:["Frame: a sample 4-question survey form and a thank-you screen. On a tablet, check buttons are big enough for elderly respondents.","Core: one full response saves its record correctly and the form resets clean for the next person. Test skipping a required question and a very long free-text answer.","Storage: save responses to localStorage per survey round; export the CSV and verify it in Excel on day one.","Polish: a PIN for the admin area, live summary charts, a large-text mode, auto-reset of the form 10 seconds after the thank-you screen."],
 x:"Pitfall: a curious respondent poking around escapes into the admin area and sees previous responses — kiosk mode must lock down tight with the PIN guarding admin. Pitfall two: a power cut or an accidentally closed tab mid-day destroys confidence; data must save after every single response, never batched to day's end. Upgrades: several collecting machines on one survey with CSV merging by round code, answer-dependent question branching."}}
);

const LESSONS = [
 {id:"readme", num:"", sec:"start", mins:6,  title:{vi:"Đọc trước — Giới thiệu & cách dùng sách", en:"Start here — Introduction & how to use this book"}, sub:{vi:"Cuốn sách này dành cho ai, đọc thế nào, và khuôn mẫu sáu mục đứng sau cả 50 ý tưởng.", en:"Who this book is for, how to read it, and the six-part template behind all 50 ideas."}},
 {id:"00", num:"00", sec:"p0", mins:8,  title:{vi:"Lời mở đầu", en:"Preface"}, sub:{vi:"Vì sao \"một file HTML\" là một cuộc cách mạng nhỏ cho người không rành code.", en:"Why \"one HTML file\" is a small revolution for non-coders."}},
 {id:"01", num:"01", sec:"p0", mins:11, title:{vi:"Giải phẫu một file HTML", en:"Anatomy of one HTML file"}, sub:{vi:"Ba lớp trong một file và kho siêu năng lực trình duyệt đã trao sẵn cho bạn.", en:"The three layers in one file, and the browser superpower inventory handed to you for free."}},

 {q:{vi:"Nguyên tắc chung của nhóm Giáo dục về nội dung học là gì?",en:"What is the Education group's shared rule about learning content?"},o:{vi:["Nội dung phải thật nhiều","Nội dung học phải tách khỏi khung công cụ — sửa nội dung không cần đụng vào code","Mỗi bài học phải có video","Phải kiểm tra bằng bài thi giấy"],en:["Content must be plentiful","Learning content must live separately from the tool's frame — editing content never touches code","Every lesson needs video","Testing must be on paper"]},a:1,e:{vi:"Tách nội dung khỏi động cơ (như kịch bản JSON của Ý 18, 38) giúp giáo viên và phụ huynh tự thay nội dung mà không cần sửa code.",en:"Separating content from the engine (like the JSON scripts of Ideas 18 and 38) lets teachers and parents change content without touching code."}},
 {q:{vi:"Vì sao máy gõ nhịp (Ý 20) không được dùng setInterval để gõ nhịp?",en:"Why must the metronome (Idea 20) not use setInterval for its beats?"},o:{vi:["Vì setInterval không phát được âm thanh","Vì hẹn giờ của trình duyệt không chính xác và bị ghìm ở tab nền, làm nhịp trôi — phải lập lịch bằng đồng hồ Web Audio","Vì setInterval chỉ chạy trên máy tính","Vì BPM cao quá setInterval không theo kịp"],en:["Because setInterval can't play sound","Because browser timers are imprecise and throttled in background tabs, making beats drift — schedule with the Web Audio clock","Because setInterval only runs on desktops","Because high BPM outruns setInterval"]},a:1,e:{vi:"Web Audio lập lịch theo đồng hồ phần cứng và hẹn trước từng phách — đó là cách duy nhất giữ nhịp ổn định lâu dài.",en:"Web Audio schedules on the hardware clock and books beats ahead — the only way to keep tempo stable over time."}}],
"10":[
 {q:{vi:"Điểm phải kiểm chứng khi tạo mã QR có chèn logo (Ý 30) là gì?",en:"What must be verified for a QR code with a centre logo (Idea 30)?"},o:{vi:["Logo phải thật to cho đẹp","Logo ≤ ~20% diện tích và luôn dùng mức sửa lỗi cao (H) để mã vẫn quét được","Phải đảo màu: mã sáng trên nền tối","Mã QR có logo thì không cần khoảng trắng quanh mã"],en:["The logo must be huge to look good","Logo ≤ ~20% of the area and always use high (H) error correction so the code still scans","Colours must be inverted: light code on dark background","A QR with a logo needs no quiet zone around it"]},a:1,e:{vi:"Logo che mất một phần dữ liệu của mã; mức sửa lỗi H cho phép khôi phục tới ~30% nên mã vẫn quét được — miễn logo đủ nhỏ.",en:"A logo covers part of the code's data; level-H correction recovers up to ~30%, so the code still scans — provided the logo stays small."}},
 {q:{vi:"Cạm bẫy in ấn kinh điển của CV → PDF (Ý 32) là gì?",en:"What is the classic print pitfall of CV → PDF (Idea 32)?"},o:{vi:["PDF luôn nặng hơn 10 MB","Đẹp trên màn hình nhưng bị cắt mép giấy hoặc vỡ trang giữa một mục — phải in thử thật và đặt quy tắc không ngắt giữa mục","Trình duyệt không in được màu","CV không được dài quá một đoạn"],en:["PDFs are always over 10 MB","Beautiful on screen but clipped at paper edges or page-broken mid-entry — do a real print test and set a no-break-inside-entry rule","Browsers can't print colour","A CV may not exceed one paragraph"]},a:1,e:{vi:"CSS in (@media print) và phép in thử trên giấy thật là hai việc bắt buộc; màn hình không nói trước được hành vi phân trang.",en:"Print CSS (@media print) and a real paper print test are both mandatory; the screen can't predict page-breaking behaviour."}}],
"11":[
 {q:{vi:"Cạm bẫy chí mạng khi sinh đề Sudoku (Ý 35) là gì?",en:"What is the fatal pitfall when generating Sudoku puzzles (Idea 35)?"},o:{vi:["Đề quá đẹp","Đục lỗ bừa tạo đề nhiều nghiệm — người chơi tìm nghiệm khác vẫn bị báo sai; phải kiểm chứng nghiệm duy nhất sau mỗi lỗ","Lưới 9×9 quá lớn với trình duyệt","Không tô màu được các ô"],en:["Puzzles that look too nice","Careless hole-digging creates multi-solution puzzles — a player finding another solution gets marked wrong; uniqueness must be verified after every hole","A 9×9 grid is too big for browsers","Cells can't be coloured"]},a:1,e:{vi:"Nghiệm duy nhất là lời hứa cốt lõi của Sudoku; bộ sinh phải dùng bộ giải đếm nghiệm để kiểm chứng sau mỗi lỗ đục.",en:"A unique solution is Sudoku's core promise; the generator must verify with a solution-counting solver after each dug hole."}},
 {q:{vi:"Vì sao game gõ phím (Ý 41) phải xử lý sự kiện composition/input thay vì đếm phím thô?",en:"Why must the typing game (Idea 41) handle composition/input events instead of raw key events?"},o:{vi:["Vì phím thô kêu to","Vì bộ gõ Telex/VNI biến nhiều lần bấm thành một ký tự có dấu — đếm phím thô làm điểm số sai hoàn toàn","Vì trình duyệt không có sự kiện phím","Vì WPM không cần ký tự đúng"],en:["Because raw keys are loud","Because Telex/VNI input turns several keystrokes into one diacritised character — raw counting makes scores completely wrong","Because browsers have no key events","Because WPM doesn't need correct characters"]},a:1,e:{vi:"Với tiếng Việt, một ký tự hoàn chỉnh có thể đến từ 2–3 lần bấm; chỉ sự kiện input/composition mới cho ký tự thật mà người dùng đã gõ.",en:"In Vietnamese, one finished character can come from 2–3 keystrokes; only input/composition events reveal the true character typed."}}],

/* ================= ENGINE ================= */
const $ = s => document.querySelector(s);
const state = { lang:"vi", theme:null, done:new Set(), cur:null, quiz:{}, fGroup:"ALL", fDiff:"ALL" };
function L(obj){ return obj[state.lang] || obj.vi; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function lessonById(id){ return LESSONS.find(l=>l.id===id) || LESSONS[0]; }

function applyTheme(){
  const dark = state.theme ? state.theme==="dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#themeIconSun").style.display = dark ? "none" : "";
  $("#themeIconMoon").style.display = dark ? "" : "none";
}
function applyLangStrings(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.dataset.i18n; if(STR[k]) el.textContent = L(STR[k]); });
  $("#langLbl").textContent = state.lang==="vi" ? "EN" : "VI";
  $("#searchInput").placeholder = L(STR.searchPh);
  $("#sideNote").textContent = L(STR.sideNote);
  $("#railTitle").textContent = L(STR.inLesson);
}

function renderSidebar(){
  const nav = $("#sideNav"); nav.innerHTML = "";
  SECTIONS.forEach(sec=>{
    const items = LESSONS.filter(l=>l.sec===sec.id);
    if(!items.length) return;
    const h = document.createElement("div"); h.className="side-sec"; h.textContent = L(sec); nav.appendChild(h);
    items.forEach(l=>{
      const b = document.createElement("button");
      b.className = "nav-item" + (state.cur===l.id ? " active" : "") + (state.done.has(l.id) ? " done" : "");
      b.innerHTML = `<span class="num">${esc(l.num||"·")}</span><span>${esc(L(l.title))}</span><span class="done-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg></span>`;
      b.addEventListener("click",()=>{ go(l.id); closeSidebarMobile(); });
      nav.appendChild(b);
    });
  });
}
function updateProgress(){
  $("#tbProgress").innerHTML = `<b>${state.done.size}</b>/21 ${esc(L(STR.lessonsDone))}`;
  const total = document.documentElement.scrollHeight - innerHeight;
  const p = total>0 ? Math.min(1, scrollY/total) : 0;
  $("#readProgress").style.width = (p*100)+"%";
}

function stripStage(s){ return s.replace(/^(Khung|Cốt lõi|Lưu trữ|Đánh bóng|Frame|Core|Storage|Polish):\s*/,""); }
function ideaCard(idea){
  const c = idea[state.lang];
  const diffLbl = L(STR.diff[idea.d]);
  const feats = c.f.map(x=>`<li>${esc(x)}</li>`).join("");
  const stages = c.ai.map((s,i)=>`<li><strong>${esc(STR.stageNames[state.lang][i])}:</strong> ${esc(stripStage(s))}</li>`).join("");
  return `<section class="idea" id="idea-${idea.n}">
    <div class="idea-head"><span class="idea-num">${esc(L(STR.ideaN))} ${idea.n}</span><h3>${esc(c.t)}</h3>
    <div class="badges"><span class="badge ${idea.d}"><span class="dot"></span>${esc(diffLbl)}</span><span class="badge tech">${esc(idea.tech)}</span></div></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblProblem))}</div><p>${esc(c.p)}</p></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblFeatures))}</div><ul>${feats}</ul></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblWhy))}</div><p>${esc(c.w)}</p></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblArch))}</div><p>${esc(c.a)}</p></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblAI))}</div><ol>${stages}</ol></div>
    <div class="idea-sec"><div class="lbl">${esc(L(STR.lblPit))}</div><p>${esc(c.x)}</p></div>
    <div class="idea-foot"><button class="copy-idea" data-copy-idea="${idea.n}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>${esc(L(STR.copyBrief))}</span></button></div>
  </section>`;
}
function ideaBriefText(idea){
  const c = idea[state.lang];
  const head = L(STR.briefHead).replace("{n}",idea.n).replace("{t}",c.t).replace("{g}",idea.g).replace("{d}",L(STR.diff[idea.d]));
  const lines = [head, "", `${L(STR.lblTech)}: ${idea.tech}`, "", `${L(STR.lblProblem)}: ${c.p}`, "", `${L(STR.lblFeatures)}:`, ...c.f.map(x=>"- "+x), "", `${L(STR.lblWhy)}: ${c.w}`, "", `${L(STR.lblArch)}: ${c.a}`, "", `${L(STR.lblAI)}:`, ...c.ai.map((s,i)=>`${i+1}. ${STR.stageNames[state.lang][i]}: ${stripStage(s)}`), "", `${L(STR.lblPit)}: ${c.x}`];
  return lines.join("\n");
}

function renderMaster(){
  const wrap = document.getElementById("masterWrap");
  if(!wrap) return;
  const diffs = ["ALL","easy","mid","hard"];
  let html = `<div class="filters"><span class="f-lbl">${esc(L(STR.filterGroup))}</span>`;
  html += `<button class="chip ${state.fGroup==="ALL"?"on":""}" data-fg="ALL">${esc(L(STR.filterAll))}</button>`;
  Object.keys(GROUPS).forEach(g=>{ html += `<button class="chip ${state.fGroup===g?"on":""}" data-fg="${g}">${g} · ${esc(L(GROUPS[g]))}</button>`; });
  html += `</div><div class="filters"><span class="f-lbl">${esc(L(STR.filterDiff))}</span>`;
  diffs.forEach(d=>{ const lbl = d==="ALL" ? L(STR.filterAll) : L(STR.diff[d]); html += `<button class="chip ${state.fDiff===d?"on":""}" data-fd="${d}">${esc(lbl)}</button>`; });
  html += `</div><p class="filter-note" id="masterCount"></p>`;
  let lastGroup = "";
  IDEAS.forEach(idea=>{
    const vis = (state.fGroup==="ALL"||idea.g===state.fGroup) && (state.fDiff==="ALL"||idea.d===state.fDiff);
    if(idea.g!==lastGroup){ html += `<div class="group-head" data-gh="${idea.g}">${esc(L(STR.groupOf))} ${idea.g} — ${esc(L(GROUPS[idea.g]))}</div>`; lastGroup = idea.g; }
    const lessonId = String(6 + "ABCDEFGH".indexOf(idea.g) + 1).padStart(2,"0");
    html += `<button class="mrow ${vis?"":"hidden-row"}" data-row="${idea.g}" data-go-idea="${idea.n}" data-lesson="${lessonId}">
      <span class="mn">${idea.n}</span>
      <span class="mt">${esc(idea[state.lang].t)}<small>${esc(idea.tech)}</small></span>
      <span class="badges"><span class="badge ${idea.d}"><span class="dot"></span>${esc(L(STR.diff[idea.d]))}</span></span></button>`;
  });
  wrap.innerHTML = html;
  const count = IDEAS.filter(i=>(state.fGroup==="ALL"||i.g===state.fGroup)&&(state.fDiff==="ALL"||i.d===state.fDiff)).length;
  $("#masterCount").textContent = L(STR.showingIdeas).replace("{a}",count);
  wrap.querySelectorAll("[data-gh]").forEach(h=>{
    const g = h.dataset.gh;
    const anyVisible = IDEAS.some(i=>i.g===g && (state.fGroup==="ALL"||i.g===state.fGroup) && (state.fDiff==="ALL"||i.d===state.fDiff));
    h.style.display = anyVisible ? "" : "none";
  });
  wrap.querySelectorAll("[data-fg]").forEach(b=>b.addEventListener("click",()=>{ state.fGroup=b.dataset.fg; renderMaster(); }));
  wrap.querySelectorAll("[data-fd]").forEach(b=>b.addEventListener("click",()=>{ state.fDiff=b.dataset.fd; renderMaster(); }));
  wrap.querySelectorAll("[data-go-idea]").forEach(b=>b.addEventListener("click",()=>{ go(b.dataset.lesson, parseInt(b.dataset.goIdea,10)); }));
}

function renderQuiz(lessonId){
  const qs = QUIZZES[lessonId];
  if(!qs) return "";
  let html = `<div class="quiz"><h2>${esc(L(STR.quizTitle))}</h2><p class="q-sub">${esc(L(STR.quizSub))}</p>`;
  qs.forEach((item,qi)=>{
    const ans = state.quiz[lessonId+":"+qi];
    html += `<div class="q-block"><p class="q-text">${qi+1}. ${esc(L(item.q))}</p><div class="q-opts">`;
    item.o[state.lang].forEach((opt,oi)=>{
      let cls = "q-opt";
      if(ans!==undefined){ if(oi===item.a) cls+=" right"; else if(oi===ans) cls+=" wrong"; }
      html += `<button class="${cls}" data-q="${qi}" data-o="${oi}" ${ans!==undefined?"disabled":""}><span class="ol">${"ABCD"[oi]}</span><span>${esc(opt)}</span></button>`;
    });
    html += `</div><div class="q-exp ${ans!==undefined?"show":""}">${ans!==undefined?esc(L(item.e)):""}</div></div>`;
  });
  const answered = qs.filter((_,qi)=>state.quiz[lessonId+":"+qi]!==undefined);
  let score = "";
  if(answered.length===qs.length){
    const right = qs.filter((item,qi)=>state.quiz[lessonId+":"+qi]===item.a).length;
    score = L(STR.quizScore).replace("{a}",right).replace("{b}",qs.length);
  }
  html += `<div class="quiz-score">${esc(score)}</div></div>`;
  return html;
}

function renderLesson(id, ideaAnchor){
  const lesson = lessonById(id);
  state.cur = lesson.id;
  const idx = LESSONS.indexOf(lesson);
  const prev = idx>0 ? LESSONS[idx-1] : null;
  const next = idx<LESSONS.length-1 ? LESSONS[idx+1] : null;
  const bodyEl = document.getElementById("body-"+state.lang+"-"+lesson.id);
  let bodyHtml = bodyEl ? bodyEl.innerHTML : "";
  if(lesson.group){
    const ideas = IDEAS.filter(i=>i.g===lesson.group);
    bodyHtml += ideas.map(ideaCard).join("");
  }
  const done = state.done.has(lesson.id);
  const html = `
    <div class="lesson-kicker">${lesson.num ? (state.lang==="vi" ? (lesson.sec==="app" ? "Phụ lục " : "Chương ") + lesson.num : (lesson.sec==="app" ? "Appendix " : "Chapter ") + lesson.num) : (state.lang==="vi" ? "Đọc trước" : "Start here")}</div>
    <h1>${esc(L(lesson.title))}</h1>
    <p class="lesson-sub">${esc(L(lesson.sub))}</p>
    <div class="lesson-meta"><span class="meta-chip">${lesson.mins} ${esc(L(STR.minutes))}</span><span class="meta-chip">VI · EN</span>
      <button class="complete-btn ${done?"is-done":""}" id="completeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></svg><span>${esc(done ? L(STR.markedDone) : L(STR.markDone))}</span></button></div>
    <div class="prose">${bodyHtml}</div>
    ${renderQuiz(lesson.id)}
    <nav class="pn-nav">
      <button class="pn-card prev ${prev?"":"disabled"}" id="prevBtn"><span class="pn-lbl">← ${esc(L(STR.prev))}</span><span class="pn-t">${prev?esc(L(prev.title)):""}</span></button>
      <button class="pn-card next ${next?"":"disabled"}" id="nextBtn"><span class="pn-lbl">${esc(L(STR.next))} →</span><span class="pn-t">${next?esc(L(next.title)):""}</span></button>
    </nav>
    <footer><strong>${esc(L(STR.footerCredit))}</strong><br>${esc(L(STR.footerNote))}</footer>`;
  $("#reader").innerHTML = html;
  if(lesson.id==="C") renderMaster();
  /* copy buttons inside code blocks */
  document.querySelectorAll("#reader pre").forEach(pre=>{
    const wrap = document.createElement("div"); wrap.className="code-wrap";
    pre.parentNode.insertBefore(wrap, pre); wrap.appendChild(pre);
    const b = document.createElement("button"); b.className="copy-code"; b.textContent = L(STR.copyCode);
    b.addEventListener("click",()=>{ copyText(pre.innerText); b.textContent = L(STR.copied); setTimeout(()=>b.textContent=L(STR.copyCode),1400); });
    wrap.appendChild(b);
  });
  document.querySelectorAll("[data-copy-idea]").forEach(b=>{
    b.addEventListener("click",()=>{
      const idea = IDEAS.find(i=>i.n===parseInt(b.dataset.copyIdea,10));
      copyText(ideaBriefText(idea));
      const span = b.querySelector("span"); const old = span.textContent;
      span.textContent = L(STR.copied); setTimeout(()=>span.textContent=old,1400);
    });
  });
  $("#completeBtn").addEventListener("click",()=>{
    if(state.done.has(lesson.id)) state.done.delete(lesson.id); else state.done.add(lesson.id);
    renderSidebar(); updateProgress(); renderLesson(lesson.id);
  });
  if(prev) $("#prevBtn").addEventListener("click",()=>go(prev.id));
  if(next) $("#nextBtn").addEventListener("click",()=>go(next.id));
  document.querySelectorAll(".q-opt").forEach(b=>{
    b.addEventListener("click",()=>{
      state.quiz[lesson.id+":"+b.dataset.q] = parseInt(b.dataset.o,10);
      const prose = $("#reader .prose").innerHTML;
      const quizHtml = renderQuiz(lesson.id);
      const quizEl = document.querySelector(".quiz");
      if(quizEl){ const tmp = document.createElement("div"); tmp.innerHTML = quizHtml; quizEl.replaceWith(tmp.firstChild); bindQuiz(lesson.id); }
    });
  });
  renderSidebar(); buildRail(); updateProgress();
  if(ideaAnchor){
    const el = document.getElementById("idea-"+ideaAnchor);
    if(el){ el.scrollIntoView({block:"start"}); return; }
  }
  window.scrollTo(0,0);
}
function bindQuiz(lessonId){
  document.querySelectorAll(".q-opt").forEach(b=>{
    b.addEventListener("click",()=>{
      state.quiz[lessonId+":"+b.dataset.q] = parseInt(b.dataset.o,10);
      const quizEl = document.querySelector(".quiz");
      if(quizEl){ const tmp = document.createElement("div"); tmp.innerHTML = renderQuiz(lessonId); quizEl.replaceWith(tmp.firstChild); bindQuiz(lessonId); }
    });
  });
}

function buildRail(){
  const links = $("#railLinks"); links.innerHTML = "";
  const heads = document.querySelectorAll("#reader .prose h2, #reader .idea h3");
  heads.forEach((h,i)=>{
    if(!h.id) h.id = "sec-"+i;
    const a = document.createElement("a"); a.href = "#"; a.textContent = h.textContent;
    a.addEventListener("click",ev=>{ ev.preventDefault(); h.scrollIntoView({block:"start"}); });
    links.appendChild(a);
  });
  $("#rail").style.display = heads.length ? "" : "none";
}
function railSpy(){
  const links = $("#railLinks a"); if(!links.length) return;
  const heads = document.querySelectorAll("#reader .prose h2, #reader .idea h3");
  let cur = 0;
  heads.forEach((h,i)=>{ if(h.getBoundingClientRect().top < 140) cur = i; });
  links.forEach((a,i)=>a.classList.toggle("on", i===cur));
}

/* ---------- routing ---------- */
function parseHash(){
  const h = location.hash.replace(/^#\/?/,"");
  const parts = h.split("/");
  const id = parts[0] || "readme";
  const idea = parts[1] ? parseInt(parts[1].replace("idea-",""),10) : null;
  return { id: LESSONS.some(l=>l.id===id) ? id : "readme", idea: isNaN(idea)?null:idea };
}
let lastHash = null;
function go(id, idea){
  closeSidebarMobile();
  const target = "#/"+id+(idea?"/idea-"+idea:"");
  if(location.hash === target){ const r = parseHash(); renderLesson(r.id, r.idea); return; }
  location.hash = target;
}
window.addEventListener("hashchange",()=>{
  if(location.hash === lastHash) return;
  lastHash = location.hash;
  const r = parseHash(); renderLesson(r.id, r.idea);
});

/* ---------- clipboard & toast ---------- */
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(()=>toast(L(STR.copied)), ()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast(L(STR.copied)); }catch(e){}
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove("show"),1600);
}

/* ---------- search ---------- */
const searchIndex = [];
function buildSearchIndex(){
  searchIndex.length = 0;
  LESSONS.forEach(l=>{
    const el = document.getElementById("body-"+state.lang+"-"+l.id);
    const tmp = document.createElement("div");
    tmp.innerHTML = el ? el.innerHTML : "";
    const text = tmp.textContent.replace(/\s+/g," ").slice(0,4000);
    searchIndex.push({id:l.id, idea:null, title:L(l.title), sub:(L(l.sub)+" "+text).slice(0,220)});
  });
  IDEAS.forEach(idea=>{
    const c = idea[state.lang];
    const lessonId = String(6 + "ABCDEFGH".indexOf(idea.g) + 1).padStart(2,"0");
    searchIndex.push({id:lessonId, idea:idea.n, title:`${L(STR.ideaN)} ${idea.n} — ${c.t}`, sub:c.p.slice(0,200)});
  });
}
function openSearch(){ $("#searchOverlay").classList.add("open"); $("#searchInput").value=""; renderSearch(""); setTimeout(()=>$("#searchInput").focus(),30); }
function closeSearch(){ $("#searchOverlay").classList.remove("open"); }
function renderSearch(q){
  const box = $("#searchResults");
  const query = q.trim().toLowerCase();
  const strip = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
  const results = query ? searchIndex.filter(it=> strip(it.title+" "+it.sub).includes(strip(query))).slice(0,14) : searchIndex.slice(0,8);
  if(!results.length){ box.innerHTML = `<div class="sr-empty">${esc(L(STR.searchEmpty))}</div>`; return; }
  box.innerHTML = "";
  results.forEach((it,i)=>{
    const b = document.createElement("button"); b.className = "sr-item"+(i===0?" sel":"");
    b.innerHTML = `<div class="sr-t">${esc(it.title)}</div><div class="sr-s">${esc(it.sub)}</div>`;
    b.addEventListener("click",()=>{ closeSearch(); go(it.id, it.idea); });
    box.appendChild(b);
  });
}

/* ---------- sidebar mobile ---------- */
function closeSidebarMobile(){ $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }

/* ---------- wire up ---------- */
$("#menuBtn").addEventListener("click",()=>{ $("#sidebar").classList.toggle("open"); $("#scrim").classList.toggle("show"); });
$("#scrim").addEventListener("click", closeSidebarMobile);
$("#themeBtn").addEventListener("click",()=>{
  const cur = document.documentElement.dataset.theme;
  state.theme = cur==="dark" ? "light" : "dark"; applyTheme();
});
$("#langBtn").addEventListener("click",()=>{
  state.lang = state.lang==="vi" ? "en" : "vi";
  applyLangStrings(); buildSearchIndex();
  const r = parseHash(); renderLesson(r.id, r.idea);
});
$("#searchBtn").addEventListener("click", openSearch);
$("#searchOverlay").addEventListener("click", e=>{ if(e.target.id==="searchOverlay") closeSearch(); });
$("#searchInput").addEventListener("input", e=>renderSearch(e.target.value));
$("#searchInput").addEventListener("keydown", e=>{
  if(e.key==="Enter"){ const first = $("#searchResults .sr-item"); if(first) first.click(); }
});
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#searchOverlay").classList.contains("open") ? closeSearch() : openSearch(); }
  if(e.key==="Escape"){ closeSearch(); closeSidebarMobile(); }
});
window.addEventListener("scroll", ()=>{ updateProgress(); railSpy(); }, {passive:true});

/* ---------- init ---------- */
(function init(){
  state.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  applyTheme(); applyLangStrings(); buildSearchIndex();
  lastHash = location.hash;
  const r = parseHash(); renderLesson(r.id, r.idea);
})();
</script>
</body>
