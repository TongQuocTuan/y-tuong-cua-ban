<h2>Who this book is for</h2>
<p>For people who <strong>don't code</strong> but have real jobs to solve: a work tracker, a payroll calculator for the team, a game for their kid, a survey form for a class. You don't need to learn programming first. You need to learn how to <strong>describe the job precisely to an AI</strong>, test with your own eyes, and iterate in small steps until the tool actually works.</p>
<p>Also for the mildly technical who want a lightweight toolbox: tools you build once, use daily, and never have to deploy anywhere.</p>
<h2>How to use this book</h2>
<ul>
<li><strong>Read Part 0 first</strong> (lessons 00–06): what one HTML file can and cannot do, and the four-stage process for working with AI. This part decides whether you finish or give up halfway.</li>
<li><strong>Part 1 is a menu of 50 ideas</strong> (lessons 07–12). Don't read it linearly: pick the one idea closest to your real need and start building.</li>
<li><strong>Part 2</strong> (lessons 13–16) makes you better: reusable design patterns, testing when you can't read code, getting tools into users' hands, and the roadmap beyond one file.</li>
<li><strong>Appendix C</strong> is the master table of all 50 ideas with group and difficulty filters — the best place to choose a starting point.</li>
<li>Every chapter lesson (00–16) ends with <strong>2 quick-check questions</strong>.</li>
</ul>
<h2>The six-part template behind every idea</h2>
<ol>
<li><strong>Problem &amp; who it's for</strong> — the concrete pain and the person who has it.</li>
<li><strong>What users can do</strong> — the feature list from the user's side.</li>
<li><strong>Why one file is enough</strong> — matched against browser capabilities.</li>
<li><strong>Approach &amp; architecture</strong> — screens, data, flow.</li>
<li><strong>Working with AI</strong> — four stages: Frame → Core → Storage → Polish, with a test for each stage.</li>
<li><strong>Pitfalls &amp; upgrades</strong> — where it usually breaks, and where to grow later.</li>
</ol>
<h2>What "difficulty" means here</h2>
<p>Difficulty is rated for <strong>a non-coder working with AI</strong>, not for programmers: <strong>Easy</strong> — one sitting, few iterations; <strong>Medium</strong> — a few sittings, patient testing needed; <strong>Hard</strong> — touches genuinely hard parts (encryption, generation algorithms, complex drag-and-drop) and many AI iterations. Beginners should start with Ideas 5, 13, 30 or 39 to learn the process first.</p>
<h2>A note on reliability</h2>
<p>Browser capabilities and AI tools change quarterly. Every technical claim here is "true as of the 2026 update and may change" — the right habit is to always verify with your own eyes on a real device, in the spirit of Chapter 14. Something you are told works is different from something you have seen working.</p>
</script>

<script type="text/html" id="body-en-00">
<h2>A short story</h2>
<p>A team lead needs a board to track assignments for 28 people. The "proper" route — buy software, wait for approval, wait for rollout — takes weeks. The one-file route: one afternoon, about an hour with an AI, and a single HTML file exists. Send it in the group chat; everyone who receives it opens it and works, data living on each person's own machine. Not perfect — but <strong>the job was done that day</strong>, and that was what mattered.</p>
<p>Stories like this repeat everywhere: a teacher making quizzes for class, a shop owner printing invoices, a parent building a math game. The common thread: the maker is not a programmer.</p>
<h2>Two waves meeting</h2>
<p><strong>Wave one: the browser became a small operating system.</strong> Graphics, sound, persistent storage, file read/write, encryption, printing — all built into a single HTML file that just opens and works, nothing to install (Chapter 1 opens this treasure chest).</p>
<p><strong>Wave two: AI writes code from descriptions.</strong> By 2026, AI assistants don't merely answer questions — as coding agents they read your file, edit it, run it and fix it. But the spec still comes from you: the clearer the description and the smaller the loop, the more trustworthy the result. This book teaches exactly the human half of that partnership.</p>
<h2>Why <em>one</em> file, not a "proper" app?</h2>
<ul>
<li><strong>Zero friction:</strong> no install, no sign-up, no server to maintain. Send the file and you're done.</li>
<li><strong>Zero running cost:</strong> no hosting bills. The file sits quietly on disk; open it in ten years and it still runs.</li>
<li><strong>Private by default:</strong> data never leaves the user's machine, because there is nowhere for it to go.</li>
<li><strong>Easy to share, easy to retire:</strong> ideal for personal and small-team tools, and seasonal one-offs.</li>
</ul>
<h2>What this book does and doesn't teach</h2>
<p>It teaches you to recognise which jobs fit one file, brief an AI in four stages, test like a demanding user, and share the result decently. It does <strong>not</strong> teach programming syntax, and it doesn't replace real foundations if you later go professional — Chapter 16 maps that road.</p>
<h2>The working mindset</h2>
<p>Three sentences worth memorising: <strong>small first, working first, pretty later</strong>. Every idea in this book starts as an ugly version that runs, then grows. People who quit rarely lose to a hard idea — they lose to demanding a perfect first version.</p>
</script>

<script type="text/html" id="body-en-01">
<h2>Three layers in one file</h2>
<ul>
<li><strong>HTML — the skeleton:</strong> content blocks — headings, text, buttons, inputs, tables.</li>
<li><strong>CSS — the appearance:</strong> colour, type, spacing, layout, dark mode.</li>
<li><strong>JavaScript — the behaviour:</strong> what happens on a click, calculations, storage, animation.</li>
</ul>
<p>Keeping the layers separate in your head makes your briefs to AI sharper: "keep the behaviour, restyle to a dark theme" beats "make it nicer" every time.</p>
<h2>The built-in superpower inventory — nothing to install</h2>
<h3>Graphics — Canvas &amp; SVG</h3>
<p>Canvas is a pixel drawing board: games, charts, drawing tools, PNG export. SVG is vector graphics: diagrams, icons, mind maps that scale without blurring.</p>
<h3>Sound — Web Audio API</h3>
<p>The browser synthesises sound itself: alarm chimes, metronomes, even a beat maker — no audio files needed.</p>
<h3>Memory — localStorage &amp; IndexedDB</h3>
<p>localStorage: a small drawer (roughly 5–10 MB) for text and simple structures. IndexedDB: a much larger store (potentially hundreds of MB) for structured data and image blobs. Chapter 5 covers how to choose.</p>
<h3>Reading &amp; writing files</h3>
<p>Users can pick files to load (CSV, images, JSON) and download results (CSV, PNG, print-to-PDF). Chrome/Edge add the File System Access API for saving directly into a chosen file — as of 2026 still a conditional, mostly-Chromium capability, so always keep plain download as the fallback.</p>
<h3>Encryption — Web Crypto API</h3>
<p>Standard hashing and encryption (AES-GCM, PBKDF2) run in the browser — the foundation of the offline password vault (Idea 7). Note: Web Crypto requires a secure context (HTTPS, or treat file-opened pages with care depending on the browser) — test it the way you'll actually distribute the file.</p>
<h3>Printing &amp; PDF</h3>
<p>The browser's print dialog is a free, decent PDF exporter when print CSS is cared for — invoices, CVs and quotes all use this route.</p>
<h3>Voice</h3>
<p>Text-to-speech is built in; speech recognition depends on the browser and usually on a network — class it as "verify before you promise".</p>
<h3>Newer capabilities worth knowing in 2026</h3>
<ul>
<li><strong>WebGPU</strong> — much stronger graphics and parallel compute than classic WebGL, now present across major browsers; treat as an upgrade path for heavy visualisation (Idea 25), not the default.</li>
<li><strong>Popover, the <code>&lt;dialog&gt;</code> element, View Transitions</strong> — dialogs, popups and smooth view changes are now plain HTML/CSS, less library needed.</li>
<li><strong>OPFS (Origin Private File System)</strong> — a fast private file store complementing IndexedDB for large binary data.</li>
</ul>
<h2>One important warning about browser support</h2>
<p>Not every capability exists in every browser, or in every way of opening a file. Working rule: build the core on safe capabilities (Canvas, localStorage, printing); use conditional ones (File System Access, speech recognition, WebGPU) only with a fallback. Appendix A is the quick lookup for this.</p>
<h2>Why this changes the game for you</h2>
<p>It used to take a whole pipeline to make one tool: environments, frameworks, a server. Now the pipeline collapses to <strong>a browser (everyone has one) + an AI (you're using one) + one file</strong>. What's left is your job: describing and testing — learnable in a few sittings.</p>
</script>

<script type="text/html" id="body-en-02">
<h2>What one file does <strong>very well</strong></h2>
<ul>
<li>Single-user tools with data on one machine: notes, trackers, calculators, references.</li>
<li>Things that produce an output: PNG images, print/PDF, CSV files, .ics calendar files.</li>
<li>Games and interactive experiences that run entirely locally.</li>
<li>Sharing by "handing over an artefact": the file itself, a state-carrying link, a QR code.</li>
</ul>
<h2>What one file <strong>cannot</strong> do (alone)</h2>
<h3>1. Live shared data between many people, in real time</h3>
<p>No server means no shared source of truth for simultaneous editing. Practical routes: one copy each, or share state snapshots via file/link (Ideas 44 and 49 state this limit honestly, with workarounds).</p>
<h3>2. Keep secrets</h3>
<p>Everything inside the file is readable — including any API key you were tempted to embed. Never place secret keys, shared passwords or sensitive data in clear text inside a file.</p>
<h3>3. Send email, messages, or "run in the background"</h3>
<p>A file lives only while it's open. It won't wake at 7 a.m. to remind anyone; reminders happen when the user opens the tool.</p>
<h3>4. Freely call every internet service</h3>
<p>Browsers block most cross-origin calls (CORS). Public APIs that opt in are usable; otherwise, load data through files the user picks.</p>
<h3>5. "Install like a real app" when opened from disk</h3>
<p>Service Workers and full PWA behaviour require HTTPS serving. From file://, treat the tool as "a web page in one file" and don't promise an installable-app experience.</p>
<h3>6. Local data can be lost</h3>
<p>Clearing browser data, switching machines, system cleanup — localStorage/IndexedDB data goes with it. So <strong>Export/Import backup is not an extra feature; it's a survival condition</strong> (Chapter 5).</p>
<h3>7. Size and power limits</h3>
<p>A few MB is comfortable; tens of MB of embedded images will crawl. Heavy compute and complex 3D are possible at moderate scale — don't expect parity with dedicated software.</p>
<h2>Quick decision table: does my idea fit one file?</h2>
<div class="table-scroll"><table>
<tr><th>Question</th><th>If "yes"</th><th>If "no"</th></tr>
<tr><td>One main user, on their own machine?</td><td>Great fit for one file</td><td>Consider a server, or the workarounds of Ideas 44/49</td></tr>
<tr><td>Can the data be backed up and restored?</td><td>Build it, with Export/Import</td><td>Don't keep losable data in one file</td></tr>
<tr><td>Must it work offline?</td><td>One file is a strong choice</td><td>—</td></tr>
<tr><td>Does it need secrets / API keys?</td><td><strong>Never</strong> embed them in the file</td><td>Proceed</td></tr>
<tr><td>Is the final product an image / PDF / CSV?</td><td>Great fit</td><td>—</td></tr>
</table></div>
<h2>The right spirit</h2>
<p>Stating limits plainly doesn't weaken an idea; it makes users trust you. Every idea in this book names the spot where one file falls short and gives the practical route instead — keep that habit in your own tools.</p>
</script>

<script type="text/html" id="body-en-03">
<h2>"Small software" — a choice, not a shortcoming</h2>
<p>The software industry defaults to "if you build it, build it big": more features, more users, growth forever. But most real needs are small and specific: one tracker for one team, one calculator for one contract type, one game for one child. For those, big software is <strong>overkill</strong> — expensive, slow, and it makes users serve the tool instead of the reverse.</p>
<h2>Four core values</h2>
<h3>1. Local-first — your machine is the centre</h3>
<p>Data stays where it's born. No forced sync, no cloud holding the original. The user controls everything: back it up, carry it away, delete it for good.</p>
<h3>2. No-build — no production line</h3>
<p>No compilation, no packaging, no deployment. Edit and it runs; send it and it works. The feedback loop is short enough that you dare to experiment constantly.</p>
<h3>3. Ownership &amp; immortality</h3>
<p>An HTML file depends on no company's survival and no service staying online. It can't be "sunsetted". In ten years, a browser will still open it.</p>
<h3>4. Privacy by design</h3>
<p>Not a promise of "we don't collect your data" — an architecture with nowhere for data to go. Here, privacy is a physical consequence, not a marketing line.</p>
<h2>The aesthetics of "enough"</h2>
<p>A one-file tool is beautiful differently: it does <strong>exactly one job</strong>, is understood the moment it opens, has no welcome screen and no long manual. Torn between one more feature and staying lean, remember your user opens it in the middle of a busy day — "enough" is the feature.</p>
<h2>When one file is <em>no longer</em> enough</h2>
<p>When many people must edit one live dataset together; when data becomes an asset that must never be lost; when you need push notifications, background jobs, real payments. Recognising that boundary is not failure — Chapter 16 lays out the steps up, and your one-file tool then becomes the perfect living prototype for the bigger system.</p>
<h2>The spirit to carry</h2>
<p>Small is not sloppy. If anything, with no server to patch later, a one-file tool demands decency in the basics — backable-up data, clear errors, empty states that speak. The rest of this book is how you deliver that decency.</p>
</script>

<script type="text/html" id="body-en-04">
<div class="callout"><p class="co-t">The most important chapter in the book</p><p>If you read only one chapter, read this one. All 50 ideas behind it run on the same four-stage process described here.</p></div>
<h2>Which AI, and how do they differ?</h2>
<p>By 2026 there are three main ways to build with AI:</p>
<ul>
<li><strong>Chat AI</strong> (a conversation window): you describe, it returns a file, you save and open it. Simplest; best for beginners and small tools.</li>
<li><strong>AI in an editor / coding agent</strong>: the AI reads your current file, edits the right place, runs and reports back. Much faster loops once a tool grows — in exchange, you must manage context tightly (see "Context engineering" below).</li>
<li><strong>Prompt-to-UI builders</strong> on rapid web platforms: handy for layout inspiration, but the final product should still be a file you hold in your hand.</li>
</ul>
<p>Whichever you use, this chapter's principles hold: <strong>small steps, test every rung, keep the last working version safe</strong>.</p>
<h2>The core mindset: you are the director, not the camera operator</h2>
<p>AI writes code fast, but it doesn't know your job: who uses the tool, what real data looks like, what "correct" means in your domain. Only you know that. Your job: brief clearly, look at results with your own eyes, judge right from wrong, and direct the next step. Never accept a file that "looks done" before you've clicked every button yourself.</p>
<h2>The four-stage process</h2>
<ol class="stage-list">
<li><span class="st-n">1</span><div><strong>FRAME — a shell that runs.</strong> Ask for static layout: screens, headings, some sample data, no real features yet. Test with your eyes: is the layout what you meant? Is text readable on a phone? This stage's goal is to <em>see</em> the tool, not use it.</div></li>
<li><span class="st-n">2</span><div><strong>CORE — make it work.</strong> Add exactly one main behaviour (add a card, count down, compute a total…). Test that behaviour until it's right, including odd cases: empty input, negative numbers, deleting everything. One behaviour per loop.</div></li>
<li><span class="st-n">3</span><div><strong>STORAGE — make it remember.</strong> Connect storage (localStorage/IndexedDB) plus the Export/Import backup pair. Test the full life cycle: enter data → close the tab → reopen → export → wipe → import back.</div></li>
<li><span class="st-n">4</span><div><strong>POLISH — make it pleasant.</strong> Dark mode, empty states, friendly error messages, phone-sized type, printing. Also the moment to have the AI audit quality (Chapter 14).</div></li>
</ol>
<h2>The art of describing an idea to AI</h2>
<ul>
<li><strong>Name the user and the main job:</strong> "A tool for primary-school teachers; the main job is generating a 20-question math sheet in one minute."</li>
<li><strong>List screens and data:</strong> what's on each screen, which fields each data item has.</li>
<li><strong>Give real examples:</strong> paste 3–5 rows of sample data in the exact format you use daily.</li>
<li><strong>State constraints:</strong> "one single HTML file, no external libraries, data in localStorage, must have Export/Import buttons".</li>
<li><strong>One change per instruction:</strong> smaller instructions mean the AI breaks less of what already works.</li>
</ul>
<h2>Context engineering — the 2026 update</h2>
<p>The biggest shift in working with AI by 2026: result quality depends more on <strong>the context you supply</strong> than on any magic phrase. Current good practice:</p>
<ul>
<li>Always give the AI the <strong>entire current file</strong> (or let the agent read it) instead of describing from memory — this kills the "AI edited a version that doesn't exist" class of bugs.</li>
<li>Keep a fixed <strong>project brief</strong>: purpose, users, technical constraints, decisions already made. Paste it into every new session.</li>
<li>When your AI connects to tools via MCP (Model Context Protocol), the agent can read files, consult docs and run checks itself — use that, but keep the four-stage discipline: more editing power doesn't mean less testing.</li>
<li>For long tasks, have the AI <strong>write a plan before editing</strong>; approve the plan, then let it execute.</li>
</ul>
<h2>When something breaks: reporting bugs well</h2>
<p>A good bug report has four parts: <strong>what you did</strong> (step by step), <strong>what you saw</strong> (screenshot, or the exact red error line from the Console), <strong>what you expected</strong>, and <strong>what must not change</strong> ("fix only this; keep everything else"). Vague reports like "it doesn't work" are the number-one cause of endless loops.</p>
<h2>Save versions: never lose a working state</h2>
<p>Before any big change, save a dated copy: <code>kanban-2026-11-10-v3.html</code>. AI breaking things isn't scary — losing the last working version is. Iron rule: <strong>never edit the only working copy directly</strong>.</p>
<h2>Five common mistakes (and how to avoid them)</h2>
<ol>
<li>Demanding every feature in the first instruction → follow the four stages.</li>
<li>Stacking requests without testing → every loop ends with you clicking through it.</li>
<li>Forgetting data backup and version backup → Chapter 5 and the naming rule above.</li>
<li>Letting the AI decide your domain rules → you're the director; numbers and formulas are yours.</li>
<li>Quitting at loop three → most tools become "working" somewhere between loop four and eight.</li>
</ol>
<h2>A sample loop in practice</h2>
<p>"Stage 2 for Idea 5: make the Calculate Salary button work. Formula: take-home = base + allowances − insurance 10.5% of base − tax per the table pasted below. No storage yet. After editing, list 3 cases I should test myself, with the expected correct results." An instruction like that beats "make me a salary calculator" by miles: it has a stage, a formula, and acceptance criteria.</p>
</script>

<script type="text/html" id="body-en-05">
<h2>Three "drawers" for data</h2>
<h3>1. The small, handy drawer — localStorage</h3>
<p>Key–value text storage, synchronous and extremely simple. Good for settings, moderate lists (a few hundred items), UI state. Limit around 5–10 MB, text only — structured data goes through JSON. The default choice for most ideas in this book.</p>
<h3>2. The big drawer with compartments — IndexedDB</h3>
<p>A real database inside the browser: objects, image blobs, far more volume. In return it's more complex to use — let the AI handle the mechanics; your job is to specify "store what, retrieve by what". Use it for images (Idea 16) or data that grows over years.</p>
<h3>3. The real-world drawer — files on disk</h3>
<p>Export data to a file (JSON/CSV) the user keeps themselves: in a backup folder, on personal cloud storage, sent to someone else. The only drawer that survives every browser accident — and why every serious tool needs an Export button.</p>
<h2>The golden rule: ALWAYS have Backup &amp; Restore</h2>
<div class="callout"><p class="co-t">The inseparable pair: Export / Import</p><p>Every data-keeping tool must have both buttons, and you must personally test the full circle at least once: export → wipe everything → import → data returns intact. A tool that hasn't passed this test is not finished (Chapter 14).</p></div>
<h2>A powerful pattern: share by embedding data in the link</h2>
<p>A signature trick of the one-file world: encode state into the URL itself (or into a paste-able code block). The recipient opens the link and sees exactly that content — invitations (Idea 47) and polls (Idea 44) live on this pattern. Limits: links hold only small amounts of data, and data in a link is readable — never route anything sensitive this way.</p>
<h2>Loading data in from outside</h2>
<p>Letting users pick a CSV/JSON file from their machine is the safe, server-free way to load data. Ask the AI to validate format on import, report errors clearly by line, and never delete old data before new data has loaded successfully.</p>
<h2>When data needs more privacy: encryption</h2>
<p>For journals (Idea 10) or password vaults (Idea 7), data is encrypted with the user's password via Web Crypto before it's stored. Understand the principle clearly: <strong>a forgotten password means the data is gone forever</strong> — no server exists to "reset" it. A decent tool says this out loud on its very first screen.</p>
<h2>How to think about data, in short</h2>
<p>Ask three questions for every idea: what is the data and how big will it get (choose the drawer), what happens if it's lost (design Export/Import from day one), and does it need to travel to another machine (file or link). Answer those three and you've designed the hardest part of the tool.</p>
</script>

<script type="text/html" id="body-en-06">
<h2>Route 1 — Send the file itself (simplest)</h2>
<p>Attach the .html file to email, Zalo, Messenger… The recipient downloads it and opens it in a browser. Practical note: some chat platforms block or rename .html files — fall back to zipping the file, or use Route 2.</p>
<h2>Route 2 — Put it at a web address (free static hosting)</h2>
<p>Put the file on a free static host (GitHub Pages, Netlify Drop, Cloudflare Pages…) and you get a clean link that opens on any device, plus you unlock HTTPS-only capabilities. As of 2026 this remains the least-effort "proper" sharing route: drag-and-drop one file, receive one link. Remember that a public web address means anyone with the link can open it — don't host tools containing personal data there; user data still lives on the viewer's machine, but <em>the tool itself and any sample data embedded in it</em> are public.</p>
<h2>Route 3 — QR codes (for in-person moments)</h2>
<p>Print a QR code pointing at the tool's link on flyers, notice boards, event backdrops. Attendees scan and use it instantly — no typing, no app install. The classic pairing with Idea 46 (notice board) and Idea 45 (events).</p>
<h2>Route 4 — Share <em>content</em> via "state in the URL"</h2>
<p>For invitations, polls and availability matching: the content rides inside the link, and each recipient opens the link to see their part. This is how one file fakes a multi-person experience without a server — within the limits set out in Chapters 2 and 5.</p>
<h2>Don't forget: it must work well on phones</h2>
<p>Most recipients will open your tool on a phone. Before sharing, open it on yours: is the type big enough, are buttons easy to tap (at least roughly 36–44 px), does the layout survive a narrow screen? Asking the AI to "re-check everything at 360 px width" is a cheap, effective instruction.</p>
<h2>Quick choice table</h2>
<div class="table-scroll"><table>
<tr><th>Situation</th><th>Use</th></tr>
<tr><td>Sending to a few people you know</td><td>The file itself (Route 1)</td></tr>
<tr><td>Wide sharing, long-lived tool</td><td>Static hosting + link (Route 2)</td></tr>
<tr><td>Event, class, point of sale</td><td>QR code (Route 3)</td></tr>
<tr><td>Content tailored per recipient</td><td>State in the URL (Route 4)</td></tr>
</table></div>
<h2>A word on sharing kindly</h2>
<p>Send one line of guidance with the tool: what to open it with, where the data lives, how to back up. Those three lines decide whether recipients succeed or give up — Chapter 15 goes deeper.</p>
</script>

<script type="text/html" id="body-en-13">
<p>The ten patterns below are the building blocks that recur across all 50 ideas. Learning their names makes briefing an AI dramatically faster: instead of a long description, you call the pattern by name — "add Pattern 2, Export/Import, to this screen" — and ask the AI to apply it.</p>
<h2>Pattern 1 — "State + auto-save"</h2>
<p>The tool's entire condition lives in one state object; every change passes through a single point: update state → save → re-render. This kills the whole family of "saved one thing, showed another" bugs.</p>
<h2>Pattern 2 — "Export / Import backup" (the inseparable pair)</h2>
<p>Export all data to a dated JSON file; on import, validate format, ask before overwriting, and only swap data when the file is valid. No storage tool counts as finished without this pair.</p>
<h2>Pattern 3 — "Two modes in one file" (edit ↔ view)</h2>
<p>One mode for editing (forms, editors), one for viewing/presenting (clean, large, clear). Markdown notes (Idea 4), notice boards (Idea 46) and visual novels (Idea 38) all use it.</p>
<h2>Pattern 4 — "State in the URL"</h2>
<p>Encode small state into the address hash; opening the link restores exactly that state. For invitations, polls, sharing a palette — things that should "just open and show".</p>
<h2>Pattern 5 — "List + detail layout"</h2>
<p>List on the left (or top); select an item to view/edit its detail. Personal CRM (Idea 14), the collection cabinet (Idea 16) and the offline reference (Idea 24) are all variations.</p>
<h2>Pattern 6 — "Canvas + loop" (for games and animation)</h2>
<p>One loop only: update state by time → redraw onto Canvas. Every Group E game and the visualisations of Idea 25 stand on this pattern; keeping "update" separate from "draw" is the key to staying sane.</p>
<h2>Pattern 7 — "Dark mode &amp; responsive layout"</h2>
<p>Colours declared as CSS variables, two palettes (light/dark); layout adapts to width, checked at 360 px. Doing this from the Frame stage is far cheaper than patching at the end.</p>
<h2>Pattern 8 — "Empty states that speak"</h2>
<p>When there's no data yet, the screen must not be a confusing blank: it says "nothing here yet" and points at exactly the right button to start. The empty state is the first screen users see — treat it like a homepage.</p>
<h2>Pattern 9 — "Undo &amp; confirm"</h2>
<p>Destructive actions (delete, overwrite) must either ask for confirmation or be undoable. Cheapest form: a temporary trash holding deleted items for the session, plus an Undo toast for a few seconds after deleting.</p>
<h2>Pattern 10 — "Export a product" (image / PDF / CSV / .ics)</h2>
<p>Many tools' value lies in the file they produce, not in themselves: PNG from Canvas, PDF via print, CSV for Excel, .ics for calendars. Test the exported file in the real destination app (open the CSV in Excel, import the .ics into a calendar), not just inside the tool.</p>
<h2>How to use these patterns with AI</h2>
<p>Three effective uses: name the pattern in your instruction ("apply Pattern 8 to all three columns"); ask the AI to audit against them ("review this file against the 10 patterns in Chapter 13 and list which ones fall short"); and when studying a new idea, ask yourself which patterns it's assembled from — the fastest way to read this book.</p>
</script>

<script type="text/html" id="body-en-14">
<h2>The founding principle: "Trust, but verify"</h2>
<p>When the AI says "done", that's a claim, not evidence. The only evidence is you clicking it yourself and watching it work. This chapter turns testing into a checklist habit, so people who can't read code can still control quality.</p>
<h2>The "click everything" method</h2>
<p>Open the tool and click <strong>every</strong> button, open <strong>every</strong> screen, try <strong>every</strong> input. It sounds trivial, but this is how most bugs surface: dead buttons, broken layouts, inputs that reject your language's diacritics. Do it on both desktop and phone.</p>
<h2>The "strange cases" list to try</h2>
<ul>
<li>Leave every field empty and press the main button.</li>
<li>Enter 0, negatives, huge numbers, text into number fields.</li>
<li>Type text with diacritics, special characters, very long paragraphs.</li>
<li>Create lots of items (50–100) and check speed and layout.</li>
<li>Delete everything — does the empty state speak?</li>
<li>Close the tab mid-work and reopen — is data intact?</li>
<li>Turn the network fully off and use it — does the tool promise anything that needs a network?</li>
</ul>
<h2>The backup test (never skip it)</h2>
<p>Export data → wipe it inside the tool → import the file you just exported → compare item by item. If this circle doesn't close perfectly, the tool is not ready to hand to anyone, including your future self.</p>
<h2>Test on multiple devices</h2>
<p>At minimum: your desktop browser and your phone. If you're sharing it, have one person on the other operating system open it once. Browser differences are the classic bug source of the one-file world.</p>
<h2>The "hidden control panel": the debugger's friend</h2>
<p>Every browser has a Console (usually F12) where errors appear as red lines. You don't need to understand them; just <strong>copy them verbatim</strong> to the AI with a description of what you did. One red error line is worth ten paragraphs of feelings.</p>
<h2>Have the AI raise quality itself</h2>
<p>Once the tool runs, issue audit instructions: "play a demanding user and list this file's 10 weaknesses"; "check the edge cases from Chapter 14 and fix them one at a time, giving me a re-test for each fix". This is where the Polish stage earns its keep.</p>
<h2>A word on "the feel of quality"</h2>
<p>Beyond right/wrong there's pleasant/annoying: are buttons big enough, contrast strong enough, actions instantly acknowledged, bad input reported in human words instead of silence? Users abandon tools over "feel" more than over missing features — test with both eyes.</p>
</script>

<script type="text/html" id="body-en-15">
<h2>Stand in the recipient's shoes</h2>
<p>Your recipient wasn't there while you built it. They don't know the four stages or where data lives. They have one file and about three seconds of initial patience. Every decision in this chapter follows from that fact.</p>
<h2>Write one kind line of guidance</h2>
<p>Send exactly one short message with the file: which browser to open it with, what to click first, that data lives on their machine, and which button backs up. Example: "Open it in Chrome. Your data stays on your machine; press Export at the top right once a week to back up." One line like that halves your support questions.</p>
<h2>Gentle onboarding inside the tool</h2>
<p>Ship sample data users can poke immediately (and delete easily), an empty state that points at exactly one starting action, and a short in-interface note about backup. Don't write a long manual — let the tool explain itself in place, at the moment of need.</p>
<h2>Collect feedback and iterate</h2>
<p>Ask users exactly two questions: "where did you get stuck most?" and "what do you wish it also did?". The first gives your fix list in pain order; the second gives a roadmap — but remember Chapter 3's aesthetics of "enough" before accepting every request.</p>
<h2>Trust: your biggest asset</h2>
<p>Your tool runs on other people's machines and holds their data. Say it plainly: where data is, whether it goes anywhere, what happens if it's lost. That frankness — the same way this book states one file's limits — is what makes people trust your tool with real work.</p>
<h2>Naming &amp; presentation</h2>
<p>Clear filenames, no confusing spaces: <code>team-uad-okr-tracker.html</code> beats <code>new-file-2.html</code>. Inside the tool, a decent title and one short description line help someone reopening it months later remember what it is.</p>
<h2>When the tool serves a whole community</h2>
<p>For wide release (a class, a club, an event), ship a QR code (Chapter 6), a feedback channel, and the awareness that you are now "the maintainer": users' bugs are your job until you clearly state how far support goes.</p>
<h2>The toolmaker's spirit</h2>
<p>One small tool, made decently and placed in real hands, is worth more than a grand system that forever lives as an idea. Ship it, listen, fix the most painful spot — that is the whole craft at your scale.</p>
</script>

<script type="text/html" id="body-en-16">
<h2>Signs you've outgrown one file</h2>
<ul>
<li>Many people need to edit one dataset and see each other's changes immediately.</li>
<li>Data becomes an asset: losing it causes real damage; you need automatic backup and permissions.</li>
<li>You need push notifications, scheduled background jobs, payments, multi-role sign-in.</li>
<li>The file bloats until it opens slowly and every edit risks breaking three other places.</li>
</ul>
<h2>The steps up</h2>
<ol>
<li><strong>Organised multi-file:</strong> still static web, but split HTML/CSS/JS and data into files, with Git managing versions instead of manual naming.</li>
<li><strong>Add a small backend:</strong> a minimal storage/sync service (backend-as-a-service platforms, for example) for shared data and user accounts — add only what one file can't do.</li>
<li><strong>A proper PWA:</strong> serve over HTTPS, add a Service Worker for installability and controlled offline behaviour.</li>
<li><strong>Frameworks and a team:</strong> when the product has a long life and many developers — the moment to consider learning programming properly or hiring, with your one-file version as the living spec.</li>
</ol>
<h2>AI walks with you at every step</h2>
<p>The four-stage process doesn't expire as you climb: still Frame → Core → Storage → Polish, just with more specialised tooling per step. By 2026, coding agents can carry you through most of the engineering at steps 1–3, provided you keep the director's role from Chapter 4: brief in small steps, verify with evidence, keep versions safe — with Git instead of manual copies.</p>
<h2>Keep the lean spirit even when building big</h2>
<p>Many large systems die from accumulating features nobody uses. Carry the aesthetics of "enough" with you: every added feature must answer "whose real job, and how much does it hurt?". One file teaches that better than any product-management course.</p>
<h2>Closing: start today</h2>
<p>Don't wait until you've "finished learning". Pick one Easy idea in Appendix C, open your AI, and walk all four stages in a single sitting. Your first file will be ugly — every first file is. But from the second one on, you're someone who can make their own tools, and that's a completely different position to be in.</p>
</script>

<script type="text/html" id="body-en-A">
<p>This table answers "I want to do X → which browser capability do I use", with a safety level. Reading rule: <strong>Safe</strong> = build the core on it freely; <strong>Conditional</strong> = check the target browser and prepare a fallback.</p>
<h2>Interface &amp; display</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>Responsive layout</td><td>CSS Flex/Grid, media queries</td><td>Safe</td></tr>
<tr><td>Dark mode</td><td>CSS variables + prefers-color-scheme</td><td>Safe</td></tr>
<tr><td>Dialogs, popups</td><td>dialog element, popover attribute</td><td>Safe (modern browsers)</td></tr>
<tr><td>Smooth view changes</td><td>View Transitions</td><td>Conditional</td></tr>
</table></div>
<h2>Graphics &amp; drawing</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>2D drawing, games, charts</td><td>Canvas 2D</td><td>Safe</td></tr>
<tr><td>Scalable diagrams, icons</td><td>SVG</td><td>Safe</td></tr>
<tr><td>Export a drawing as an image</td><td>Canvas → PNG (toBlob)</td><td>Safe</td></tr>
<tr><td>3D / heavy GPU compute</td><td>WebGPU (or WebGL)</td><td>Conditional</td></tr>
</table></div>
<h2>Sound</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>Chimes, beats, simple instruments</td><td>Web Audio API</td><td>Safe (needs one tap/click before sound plays)</td></tr>
<tr><td>Read text aloud</td><td>SpeechSynthesis</td><td>Safe (voices vary by device)</td></tr>
<tr><td>Speech recognition</td><td>SpeechRecognition</td><td>Conditional (usually needs network)</td></tr>
</table></div>
<h2>Storage &amp; data</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>Settings, moderate lists</td><td>localStorage</td><td>Safe</td></tr>
<tr><td>Lots of data / images</td><td>IndexedDB, OPFS</td><td>Safe / Conditional</td></tr>
<tr><td>Share state via a link</td><td>Encode into URL hash</td><td>Safe (small, non-sensitive data)</td></tr>
</table></div>
<h2>Reading &amp; writing files</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>Load CSV/JSON/images from the user's machine</td><td>File input + FileReader</td><td>Safe</td></tr>
<tr><td>Download results</td><td>Blob download</td><td>Safe</td></tr>
<tr><td>Save straight into a chosen file</td><td>File System Access API</td><td>Conditional (mostly Chromium)</td></tr>
<tr><td>Drag files onto the page</td><td>Drag &amp; Drop API</td><td>Safe (phones need a fallback button)</td></tr>
</table></div>
<h2>Security &amp; printing</h2>
<div class="table-scroll"><table>
<tr><th>Goal</th><th>Capability</th><th>Level</th></tr>
<tr><td>Encrypt data with a password</td><td>Web Crypto (AES-GCM, PBKDF2)</td><td>Safe in secure contexts (HTTPS/localhost; verify when opening from file)</td></tr>
<tr><td>Print / export PDF</td><td>CSS @media print + print dialog</td><td>Safe</td></tr>
<tr><td>Copy to clipboard</td><td>Clipboard API</td><td>Safe in secure contexts</td></tr>
</table></div>
<h2>The golden rule for "Conditional" labels</h2>
<p>Don't drop the feature — design the <strong>way back</strong>: no File System Access → plain download; no speech → type it; no WebGPU → Canvas 2D. And tell users about the fallback right there in the interface, instead of letting them meet a dead button.</p>
</script>

<script type="text/html" id="body-en-B">
<p>This checklist packs the book's whole discipline onto one page. Use it at three moments: before starting an idea, while building, and before sharing the result. (On paper, tick with a pen; on screen, read it as a cross-check list.)</p>
<h2>Before starting (shape the idea)</h2>
<ul class="check-list">
<li>Who is the main user and what is the main job — statable in one sentence.</li>
<li>Checked against Chapter 2: does the idea hit any limit of a single file?</li>
<li>Data fields listed, size estimated (choose localStorage vs IndexedDB).</li>
<li>Constraints settled for the AI: one file, external libraries allowed or not, UI language.</li>
<li>Three to five rows of real sample data prepared.</li>
</ul>
<h2>While building (the four stages)</h2>
<ul class="check-list">
<li>Frame stage: layout right on a phone too (360 px) before moving on.</li>
<li>Core stage: one behaviour per loop; strange cases tested within that same loop.</li>
<li>Before every big change: a dated version copy saved.</li>
<li>Storage stage: the full backup test passed (Chapter 14).</li>
<li>Bug reports to the AI carry all four parts: steps — symptom — expectation — what must not change.</li>
</ul>
<h2>"Strange cases" testing (Chapter 14)</h2>
<ul class="check-list">
<li>Empty input, 0, negatives, huge numbers, text in number fields.</li>
<li>Diacritics and special characters in every input.</li>
<li>Create 50–100 items, then delete all — the empty state guides the next step.</li>
<li>Close/reopen, network off, on a phone and in a second browser.</li>
<li>Open the Console (F12): no unhandled red error lines remain.</li>
</ul>
<h2>Before sharing</h2>
<ul class="check-list">
<li>Clear filename; no personal data inside the shipped sample data.</li>
<li>No secret keys or shared passwords anywhere in the file.</li>
<li>One guidance line attached: what to open it with, where data lives, how to back up.</li>
<li>If the tool holds sensitive data: the loss risks (forgotten password, browser-data wipe) stated plainly.</li>
</ul>
<h2>If the tool holds sensitive data</h2>
<ul class="check-list">
<li>Data encrypted with the user's password before storage (Ideas 7, 10).</li>
<li>An encrypted backup copy exists somewhere only the user controls.</li>
<li>You have rehearsed the forgotten-password scenario and accepted its consequence.</li>
</ul>
</script>

 a:"A central screen: big clock plus controls; below it, today's stats and a few days of history. The core is a timer that knows its state (working / resting / paused); at zero it chimes and switches state. Each completed session adds one mark to that day's log.",
 ai:["Frame: static screen with a large 25:00 and Start / Pause / Reset buttons. Check the digits are readable from across the room.","Core: a real countdown that pauses and resumes; at zero, chime and switch to break. Test with 10-second sessions to move fast.","Storage: log each completed session by day; Export/Import backup and test the close–reopen cycle.","Polish: adjustable session lengths, a progress ring, dark mode, a gentle notice when a session ends while the user is on another tab."],
 x:"The key technical pitfall: browsers throttle timers in background tabs to save power. The reliable fix is computing remaining time from the real start timestamp instead of adding seconds. Sound also needs one user interaction before the browser allows it. Upgrades: per-day session charts, daily goals, naming the task for each session."}},

{n:3,g:"A",d:"mid",tech:"print / PDF · forms",
 vi:{t:"Hoá đơn & báo giá → PDF",p:"Người làm tự do, chủ tiệm nhỏ, hộ kinh doanh phải gửi báo giá và hoá đơn thường xuyên, nhưng phần mềm kế toán thì nặng và tốn phí, còn làm tay trên Word thì dễ tính nhầm tổng. Một biểu mẫu gọn, tự cộng tiền, tự tính thuế, cho ra trang in sạch sẽ là quá đủ.",
 f:["Nhập thông tin bên bán / bên mua, số hoá đơn, ngày tháng","Thêm nhiều dòng hàng: mô tả, số lượng, đơn giá — tự tính thành tiền","Tự cộng tổng, tính VAT theo tỉ lệ chọn, ra số tiền cuối","Xem trước dạng in A4 sạch sẽ, in hoặc lưu PDF qua hộp thoại in","Lưu các hoá đơn đã tạo trong máy; xuất/nhập sao lưu"],
 w:"Đây là bài toán biểu mẫu + công thức + in ấn — ba việc trình duyệt làm sẵn rất tốt. PDF không cần thư viện: hộp thoại in của trình duyệt chính là máy xuất PDF, miễn CSS in được tách riêng cẩn thận.",
 a:"Hai vùng: form nhập liệu bên trái, bản xem trước giống hệt tờ A4 bên phải, cập nhật trực tiếp khi gõ. Dòng hàng là một mảng dữ liệu; tổng tiền là hàm tính lại từ mảng mỗi lần thay đổi. Khi in, CSS @media print chỉ để lại vùng xem trước.",
 ai:["Khung: form và bản xem trước A4 tĩnh với một hoá đơn mẫu. Kiểm tra tỉ lệ A4 và độ dễ đọc.","Cốt lõi: thêm/xoá dòng hàng, tự tính thành tiền, tổng và VAT. Kiểm thử với số lẻ, số lượng 0 và dòng trống.","Lưu trữ: lưu danh sách hoá đơn vào localStorage, mở lại hoá đơn cũ để sửa/in lại; Xuất/Nhập sao lưu.","Đánh bóng: CSS in chuẩn (mất nút bấm, đúng lề), logo đơn giản, đánh số hoá đơn tự tăng, mẫu điều khoản thanh toán."],
 x:"Cạm bẫy: làm tròn tiền — hãy chốt một quy tắc làm tròn duy nhất và nói rõ với AI ngay từ đầu, kẻo tổng dòng và tổng hoá đơn lệch nhau vài đồng. Cạm bẫy hai: quên CSS in khiến bản PDF dính cả form nhập liệu. Nâng cấp: nhiều mẫu hoá đơn, lưu danh bạ khách để chọn nhanh, xuất CSV tổng hợp doanh thu theo tháng."},
 en:{t:"Invoices & quotes → PDF",p:"Freelancers, small shops and household businesses send quotes and invoices constantly, but accounting software is heavy and paid, while hand-made Word documents invite arithmetic mistakes. A lean form that adds up line items, applies tax and produces a clean printed page is entirely sufficient.",
 f:["Enter seller / buyer details, invoice number, dates","Add many line items — description, quantity, unit price — with automatic line totals","Automatic subtotal, VAT at a chosen rate, grand total","Preview a clean A4 page; print or save as PDF via the print dialog","Keep created invoices on the machine; export/import backup"],
 w:"This is a forms + formulas + printing problem — three things browsers do well out of the box. PDF needs no library: the browser's print dialog is the PDF exporter, provided print CSS is kept separate and careful.",
 a:"Two regions: the entry form on the left, a live A4-looking preview on the right that updates as you type. Line items are a data array; totals are a function recomputed from the array on every change. When printing, @media print CSS leaves only the preview visible.",
 ai:["Frame: static form and A4 preview with one sample invoice. Check A4 proportions and readability.","Core: add/remove line items, automatic line totals, subtotal and VAT. Test with decimals, zero quantity and blank rows.","Storage: save the invoice list to localStorage; reopen an old invoice to edit/reprint; Export/Import backup.","Polish: proper print CSS (no buttons, correct margins), a simple logo, auto-incrementing invoice numbers, payment-terms boilerplate."],
 x:"Pitfall: rounding money — settle on one rounding rule and tell the AI up front, or line totals and the grand total will drift by a few units. Pitfall two: forgetting print CSS so the PDF includes the entry form. Upgrades: multiple invoice templates, a customer address book, monthly revenue CSV export."}},

{n:4,g:"A",d:"mid",tech:"localStorage · live preview",
 vi:{t:"Ghi chú Markdown xem trước",p:"Người viết, sinh viên, kỹ sư ghi chú hằng ngày thường kẹt giữa hai cực: trình soạn thảo nặng nề nhiều tính năng, hoặc file text trần trụi khó đọc lại. Một ô soạn Markdown với bản xem trước trực tiếp, lưu tự động và không cần tài khoản là điểm giữa vừa đủ.",
 f:["Soạn Markdown bên trái, xem trước đã định dạng bên phải, cập nhật theo từng phím gõ","Danh sách ghi chú: tạo, đổi tên, xoá, tìm kiếm theo tiêu đề và nội dung","Lưu tự động khi gõ, mở lại là thấy đúng chỗ đang viết dở","Tải ghi chú ra file .md hoặc sao chép HTML đã render","Xuất/nhập toàn bộ ghi chú để sao lưu"],
 w:"Markdown là chữ thuần, dung lượng nhỏ — localStorage giữ hàng trăm ghi chú dễ dàng. Việc chuyển Markdown thành HTML là một hàm thuần tuý chạy tại chỗ; có thể nhờ AI viết bộ chuyển đổi tối thiểu cho các cú pháp hay dùng thay vì nhúng thư viện lớn.",
 a:"Mẫu 'hai chế độ trong một file': vùng soạn và vùng xem cạnh nhau (trên điện thoại thì chuyển tab). Mỗi ghi chú là một mục {tiêu đề, nội dung, thời gian sửa} trong một mảng; ô soạn sửa trực tiếp mục đang chọn và lưu sau mỗi thay đổi ngắn.",
 ai:["Khung: hai vùng soạn/xem tĩnh và danh sách ghi chú mẫu. Kiểm tra trên điện thoại: chuyển qua lại hai vùng có thuận tay không.","Cốt lõi: xem trước cập nhật trực tiếp cho các cú pháp chính — tiêu đề, đậm, nghiêng, danh sách, link, code, bảng. Kiểm thử bằng một ghi chú thật của bạn.","Lưu trữ: lưu tự động vào localStorage; tạo/đổi tên/xoá ghi chú; Xuất/Nhập sao lưu và qua phép thử vòng tròn.","Đánh bóng: đếm từ, chế độ tập trung chỉ hiện vùng soạn, phím tắt in đậm/nghiêng, giao diện tối."],
 x:"Cạm bẫy an toàn kinh điển: chèn HTML thô từ nội dung người dùng vào bản xem trước có thể tạo lỗ hổng XSS khi ghi chú đến từ nguồn lạ — hãy yêu cầu AI 'làm sạch HTML đầu ra'. Cạm bẫy hai: mất dữ liệu khi hai tab cùng mở một ghi chú. Nâng cấp: gắn thẻ và lọc theo thẻ, ghim ghi chú quan trọng, đồng bộ qua file khi đổi máy."},
 en:{t:"Markdown notes with live preview",p:"Writers, students and engineers who take daily notes are stuck between two extremes: heavyweight editors with endless features, or bare text files that are painful to re-read. A Markdown editor with live preview, auto-save and no account is the sufficient middle.",
 f:["Write Markdown on the left, formatted preview on the right, updating per keystroke","Note list: create, rename, delete, search by title and content","Auto-save as you type; reopen to find your draft exactly where you left it","Download a note as a .md file or copy the rendered HTML","Export/import all notes for backup"],
 w:"Markdown is plain text and tiny — localStorage easily holds hundreds of notes. Converting Markdown to HTML is a pure local function; the AI can write a minimal converter for the syntax you actually use instead of embedding a large library.",
 a:"The 'two modes in one file' pattern: editor and preview side by side (tabbed on phones). Each note is an item {title, content, edited time} in one array; the editor edits the selected item directly and saves shortly after each change.",
 ai:["Frame: static editor/preview panes and a sample note list. On a phone, check switching between panes feels natural.","Core: live preview for the main syntax — headings, bold, italic, lists, links, code, tables. Test with one of your real notes.","Storage: auto-save to localStorage; create/rename/delete notes; Export/Import and pass the full-circle test.","Polish: word count, a focus mode showing only the editor, bold/italic shortcuts, dark theme."],
 x:"The classic safety pitfall: injecting raw HTML from user content into the preview can open an XSS hole when notes come from elsewhere — ask the AI to sanitise the rendered HTML. Pitfall two: data clashes when two tabs edit the same note. Upgrades: tags and tag filters, pinned notes, file-based sync when changing machines."}},

{n:5,g:"A",d:"easy",tech:"forms + formulas",
 vi:{t:"Máy tính linh hoạt (lương / thuế / chia bill)",p:"Những phép tính lặp lại mỗi tháng — lương thực nhận sau bảo hiểm và thuế, chia tiền ăn theo đầu người, lãi vay theo dư nợ — thường bị làm lại từ đầu trên máy tính cầm tay hoặc bảng tính mở vội. Một máy tính chuyên cho đúng vài phép tính của bạn, có sẵn công thức đúng quy định, sẽ nhanh và ít sai hơn nhiều.",
 f:["Chọn chế độ tính: lương gross→net, chia bill, hoặc một phép tính tuỳ biến của bạn","Nhập các khoản: lương cơ bản, phụ cấp, số người, phần trăm thuế…","Kết quả tách từng dòng: trừ gì, còn gì — không chỉ một con số cuối","Sao chép kết quả dạng văn bản để dán vào chat/email","Lưu các kịch bản tính thường dùng"],
 w:"Đây là dạng bài thuần biểu mẫu + công thức: không cần lưu trữ lớn, không cần đồ hoạ. Mọi con số tính tại chỗ, tức thì. Một file là đủ vì 'nghiệp vụ' của nó nằm gọn trong vài công thức bạn cung cấp.",
 a:"Một màn hình duy nhất gồm: bộ chọn chế độ, các ô nhập thay đổi theo chế độ, và bảng kết quả từng dòng. Mỗi chế độ là một hàm tính độc lập nhận dữ liệu từ form và trả về danh sách dòng kết quả — thêm chế độ mới không đụng chế độ cũ.",
 ai:["Khung: bố cục một chế độ tính (lương) với ô nhập và bảng kết quả tĩnh. Kiểm tra nhãn ô nhập có đúng thuật ngữ bạn dùng.","Cốt lõi: công thức chạy thật. Bạn phải đưa AI bảng thuế/bảo hiểm chính xác và 2–3 ví dụ có đáp án đúng để đối chiếu.","Lưu trữ: lưu kịch bản tính thường dùng và lần tính gần nhất; chưa cần sao lưu phức tạp.","Đánh bóng: định dạng tiền có dấu phân cách nghìn, nút sao chép kết quả, cảnh báo khi nhập số âm hoặc để trống."],
 x:"Cạm bẫy nguy hiểm nhất: công thức thuế và bảo hiểm thay đổi theo thời gian và tuỳ trường hợp (vùng lương tối thiểu, người phụ thuộc). Hãy để công cụ ghi rõ 'công thức áp dụng theo dữ kiện bạn nhập' và cho phép sửa các tỉ lệ ngay trong giao diện. Nâng cấp: thêm chế độ tính ngược net→gross, lưu lịch sử các lần tính, xuất kết quả ra ảnh."},
 en:{t:"Flexible calculator (salary / tax / bill split)",p:"The calculations repeated every month — take-home pay after insurance and tax, splitting a dinner bill, loan interest — usually get redone from scratch on a pocket calculator or a hastily opened spreadsheet. A calculator specialised for exactly your few formulas, with the correct rules built in, is faster and far less error-prone.",
 f:["Pick a mode: gross→net salary, bill splitting, or a custom calculation of yours","Enter the components: base salary, allowances, headcount, tax rates…","Results broken down line by line — what was deducted, what remains — not just one final number","Copy the result as text to paste into chat/email","Save frequently used calculation scenarios"],
 w:"This is a pure forms + formulas problem: no big storage, no graphics. Every number is computed locally and instantly. One file suffices because its whole 'business logic' fits in a few formulas you supply.",
 a:"A single screen: a mode picker, inputs that change per mode, and a line-by-line result table. Each mode is an independent function taking form data and returning result rows — adding a new mode never touches the old ones.",
 ai:["Frame: one mode's layout (salary) with inputs and a static result table. Check input labels use your real terminology.","Core: make the formula truly run. You must give the AI the exact tax/insurance tables and 2–3 worked examples with known-correct answers to check against.","Storage: save common scenarios and the latest calculation; no complex backup needed yet.","Polish: thousand separators for money, a copy-result button, warnings for negative or empty inputs."],
 x:"The most dangerous pitfall: tax and insurance formulas change over time and by case (regional minimum wages, dependants). Have the tool state clearly 'formulas follow the figures you entered' and let rates be editable in the UI. Upgrades: reverse net→gross mode, calculation history, exporting results as an image."}},

{n:6,g:"A",d:"mid",tech:"Canvas charts · localStorage",
 vi:{t:"Theo dõi mục tiêu & OKR",p:"Mục tiêu quý của team thường nằm trong một file slide trình bày một lần rồi bị quên, hoặc trong phần mềm OKR đắt tiền mà cả team ngại mở. Một bảng theo dõi nhẹ — mục tiêu, kết quả then chốt, phần trăm tiến độ vẽ thành biểu đồ — mở lên trong một giây, là đủ để nhịp review hằng tuần không đứt.",
 f:["Tạo mục tiêu (Objective) và các kết quả then chốt (KR) bên dưới","Cập nhật số liệu KR, phần trăm hoàn thành tự tính","Biểu đồ cột/vòng cho tiến độ từng mục tiêu và toàn quý","Đánh dấu trạng thái: đang tốt / có rủi ro / trễ, kèm ghi chú review tuần","Lưu theo quý; xuất báo cáo dạng in được; xuất/nhập sao lưu"],
 w:"Dữ liệu OKR của một team nhỏ là vài chục mục có cấu trúc cây đơn giản — localStorage xử lý tốt. Biểu đồ vẽ bằng Canvas thuần, không cần thư viện. Không cần đồng bộ thời gian thực vì nhịp cập nhật là theo tuần, chia sẻ bằng file hoặc ảnh chụp báo cáo là đủ.",
 a:"Cấu trúc cây hai cấp: Objective chứa nhiều KR, mỗi KR có giá trị hiện tại, giá trị đích, đơn vị. Tiến độ KR = hiện tại/đích; tiến độ Objective = trung bình các KR. Màn hình chính là danh sách cây kèm thanh tiến độ; biểu đồ tổng hợp vẽ riêng một vùng ở đầu trang.",
 ai:["Khung: danh sách mục tiêu mẫu với thanh tiến độ tĩnh. Kiểm tra cấu trúc cây có dễ quét mắt không.","Cốt lõi: thêm/sửa Objective và KR, tiến độ tự tính đúng, kể cả KR dạng 'giảm xuống' (đích nhỏ hơn hiện tại).","Lưu trữ: lưu theo quý vào localStorage, chuyển quý không mất dữ liệu cũ; Xuất/Nhập sao lưu.","Đánh bóng: biểu đồ tổng hợp, chế độ in báo cáo tuần, lọc chỉ hiện mục tiêu 'có rủi ro / trễ'."],
 x:"Cạm bẫy tư duy: biến công cụ thành nơi 'làm đẹp số' — hãy giữ trường ghi chú review trung thực cạnh mỗi KR. Cạm bẫy kỹ thuật: KR dạng phần trăm và dạng số tuyệt đối dễ nhầm công thức; kiểm thử cả hai. Nâng cấp: liên kết OKR cấp team với cấp cá nhân, nhắc review bằng trang tổng kết cuối tuần."},
 en:{t:"Goal & OKR tracker",p:"A team's quarterly goals usually live in a slide deck shown once and forgotten, or in expensive OKR software the whole team dreads opening. A light tracker — objectives, key results, progress drawn as charts — that opens in one second is enough to keep the weekly review rhythm alive.",
 f:["Create objectives (O) with key results (KR) beneath them","Update KR figures; completion percentages compute automatically","Bar/ring charts for each objective and the whole quarter","Status flags: on track / at risk / late, with weekly review notes","Save per quarter; printable report view; export/import backup"],
 w:"A small team's OKR data is a few dozen items in a simple tree — localStorage handles it fine. Charts are plain Canvas, no library needed. No real-time sync is required because the update rhythm is weekly; sharing by file or report screenshot suffices.",
 a:"A two-level tree: an Objective holds several KRs, each KR having current value, target value and unit. KR progress = current/target; Objective progress = the average of its KRs. The main screen is the tree list with progress bars; a summary chart sits in its own region at the top.",
 ai:["Frame: a sample objective list with static progress bars. Check the tree structure scans well.","Core: add/edit Objectives and KRs with correct auto-progress, including 'decrease' KRs (target lower than current).","Storage: save per quarter in localStorage; switching quarters never loses old data; Export/Import backup.","Polish: summary chart, a printable weekly report mode, a filter showing only 'at risk / late' objectives."],
 x:"The mindset pitfall: turning the tool into a place to 'beautify numbers' — keep an honest review-note field beside every KR. The technical pitfall: percentage KRs and absolute KRs are easy to confuse in formulas; test both. Upgrades: link team OKRs to personal ones, an end-of-week summary page as the review reminder."}},

{n:7,g:"A",d:"hard",tech:"Web Crypto · localStorage",
 vi:{t:"Két mật khẩu offline mã hoá",p:"Ai cũng có vài chục tài khoản, và việc tái dùng một mật khẩu khắp nơi là rủi ro bảo mật lớn nhất của người thường. Các trình quản lý mật khẩu đám mây tốt nhưng đòi hỏi tin vào một dịch vụ và trả phí. Một két offline — dữ liệu mã hoá bằng một mật khẩu chủ, không rời khỏi máy — là lựa chọn cho người muốn tự kiểm soát hoàn toàn.",
 f:["Đặt mật khẩu chủ; mọi dữ liệu được mã hoá trước khi lưu","Thêm mục: tên dịch vụ, tài khoản, mật khẩu, ghi chú","Tìm kiếm theo tên dịch vụ; sao chép mật khẩu vào clipboard (tự xoá clipboard sau vài giây)","Trình tạo mật khẩu ngẫu nhiên mạnh theo độ dài và ký tự chọn","Xuất bản sao lưu đã mã hoá; tự khoá két sau vài phút không dùng"],
 w:"Web Crypto cung cấp mã hoá chuẩn (AES-GCM) và hàm dẫn xuất khoá từ mật khẩu (PBKDF2) ngay trong trình duyệt — đủ nền tảng cho một két cá nhân. Dữ liệu đã mã hoá thì lưu ở localStorage an toàn tương đối, vì kẻ có file cũng chỉ thấy bản mã.",
 a:"Luồng bắt buộc: nhập mật khẩu chủ → dẫn xuất khoá → giải mã toàn bộ kho dữ liệu vào bộ nhớ → thao tác → mã hoá lại khi lưu. Khi khoá két, xoá khoá và dữ liệu rõ khỏi bộ nhớ. Tuyệt đối không lưu mật khẩu chủ hay khoá ở bất cứ đâu.",
 ai:["Khung: màn hình khoá/mở két và danh sách mục mẫu (chưa mã hoá). Kiểm tra luồng mở két có rõ ràng với người mới không.","Cốt lõi: thêm/sửa/xoá mục, tìm kiếm, sao chép mật khẩu. Kiểm thử kỹ trường hợp nhập sai mật khẩu chủ.","Lưu trữ: nối mã hoá Web Crypto; xuất/nhập bản sao lưu đã mã hoá; tự kiểm thử quên mật khẩu sẽ mất dữ liệu như thiết kế.","Đánh bóng: trình tạo mật khẩu mạnh, tự khoá theo thời gian, cảnh báo rõ ràng ngay từ đầu: 'quên mật khẩu chủ là mất toàn bộ dữ liệu'."],
 x:"Đây là ý tưởng mà cạm bẫy có hậu quả thật: Web Crypto cần ngữ cảnh an toàn, hãy kiểm thử đúng cách bạn phân phối file; mật khẩu chủ yếu thì mã hoá mạnh cũng vô ích — hãy bắt mật khẩu chủ tối thiểu đủ dài; và không có 'quên mật khẩu' — công cụ phải nói thẳng điều đó. Nâng cấp: kiểm tra độ mạnh mật khẩu từng mục, cảnh báo mật khẩu trùng lặp, mục yêu thích ghim đầu."},
 en:{t:"Encrypted offline password vault",p:"Everyone has dozens of accounts, and reusing one password everywhere is the biggest security risk for ordinary people. Cloud password managers are good but demand trust in a service and a subscription. An offline vault — data encrypted with one master password, never leaving the machine — suits those who want total self-control.",
 f:["Set a master password; all data is encrypted before storage","Add entries: service name, account, password, notes","Search by service name; copy passwords to the clipboard (auto-cleared after a few seconds)","Strong random password generator with chosen length and character sets","Export an encrypted backup; auto-lock after a few idle minutes"],
 w:"Web Crypto provides standard encryption (AES-GCM) and password-based key derivation (PBKDF2) right in the browser — a sufficient foundation for a personal vault. Encrypted data can sit in localStorage with reasonable safety: whoever gets the file sees only ciphertext.",
 a:"A mandatory flow: enter master password → derive key → decrypt the whole store into memory → work → re-encrypt on save. On lock, wipe the key and plaintext from memory. Never store the master password or the key anywhere.",
 ai:["Frame: lock/unlock screens and a sample entry list (not yet encrypted). Check the unlock flow is obvious to a newcomer.","Core: add/edit/delete entries, search, copy password. Test the wrong-master-password case thoroughly.","Storage: wire in Web Crypto encryption; export/import the encrypted backup; self-test that a forgotten password loses data by design.","Polish: strong password generator, timed auto-lock, and a blunt first-screen warning: 'forget the master password and all data is gone'."],
 x:"This is the idea whose pitfalls have real consequences: Web Crypto needs a secure context, so test exactly how you'll distribute the file; a weak master password makes strong encryption pointless — enforce a sane minimum length; and there is no 'forgot my password' — the tool must say so plainly. Upgrades: per-entry password strength checks, duplicate-password warnings, pinned favourites."}},

{n:8,g:"A",d:"mid",tech:"file read/write · CSV",
 vi:{t:"Xưởng xử lý CSV",p:"Ai làm việc với dữ liệu cũng từng nhận một file CSV 'bẩn': thừa cột, sai định dạng ngày, trùng dòng, mã hoá chữ lỗi font. Mở Excel sửa tay thì lâu và dễ hỏng thêm. Một xưởng nhỏ chuyên các thao tác dọn CSV lặp lại — chọn cột, lọc, gộp, tách, đổi định dạng — biến việc nửa giờ thành hai phút.",
 f:["Kéo-thả hoặc chọn file CSV để nạp; xem trước dạng bảng","Ẩn/hiện và đổi thứ tự cột; đổi tên cột","Lọc dòng theo điều kiện (chứa, bằng, lớn hơn…); xoá dòng trùng theo cột chọn","Tách một cột thành hai theo dấu phân cách, hoặc gộp nhiều cột thành một","Tải kết quả ra CSV mới, đúng mã hoá UTF-8 có BOM để Excel đọc đúng tiếng Việt"],
 w:"CSV là chữ thuần; trình duyệt đọc file người dùng chọn và xử lý tại chỗ bằng JavaScript, không cần gửi đi đâu — riêng tư tuyệt đối với dữ liệu công việc. File vài MB xử lý tức thì; giới hạn thực tế là bộ nhớ của tab.",
 a:"Quy trình ba bước cố định: Nạp (parse CSV thành bảng trong bộ nhớ) → Biến đổi (mỗi thao tác là một nút áp dụng lên bảng hiện tại, có hoàn tác một bước) → Xuất (ghi lại thành CSV). Màn hình gồm thanh công cụ thao tác và bảng xem trước cuộn được.",
 ai:["Khung: vùng kéo-thả và bảng xem trước với dữ liệu mẫu. Kiểm tra bảng cuộn ngang/dọc có mượt với 10 cột không.","Cốt lõi: nạp CSV thật của bạn (cố tình lấy file bẩn), ẩn cột, lọc, xoá trùng. Đối chiếu số dòng trước/sau từng thao tác.","Lưu trữ: lưu 'đơn thuốc' — chuỗi thao tác hay dùng — để áp lại cho file tháng sau; chưa cần lưu dữ liệu bảng.","Đánh bóng: hoàn tác một bước, hiển thị số dòng đã lọc, nút xuất UTF-8 BOM, cảnh báo khi file quá lớn."],
 x:"Cạm bẫy kinh điển của CSV: dấu phân cách lúc là phẩy lúc là chấm phẩy (Excel theo locale), và chữ trong ô chứa dấu phẩy phải được bọc ngoặc kép — yêu cầu AI tự nhận diện dấu phân cách và xử lý ngoặc kép đúng chuẩn. Cạm bẫy hai: ngày tháng DD/MM và MM/DD hoán đổi âm thầm; hãy để công cụ hiển thị vài dòng mẫu sau khi nạp để bạn xác nhận. Nâng cấp: lưu nhiều 'đơn thuốc', gộp nhiều file CSV cùng cấu trúc thành một."},
 en:{t:"CSV workshop",p:"Anyone who works with data has received a 'dirty' CSV: extra columns, wrong date formats, duplicated rows, broken text encoding. Fixing it by hand in Excel is slow and risks more damage. A small workshop for the repeated CSV chores — pick columns, filter, merge, split, reformat — turns a half-hour job into two minutes.",
 f:["Drag-and-drop or pick a CSV to load; preview it as a table","Show/hide and reorder columns; rename columns","Filter rows by conditions (contains, equals, greater than…); remove duplicates by a chosen column","Split one column into two by a delimiter, or merge several columns into one","Download the result as a new CSV, UTF-8 with BOM so Excel reads Vietnamese correctly"],
 w:"CSV is plain text; the browser reads the user-picked file and processes it locally in JavaScript — nothing is sent anywhere, which is absolute privacy for work data. Files of a few MB process instantly; the practical limit is the tab's memory.",
 a:"A fixed three-step pipeline: Load (parse CSV into an in-memory table) → Transform (each operation is a button applied to the current table, with one-step undo) → Export (write back to CSV). The screen is an operations toolbar plus a scrollable preview table.",
 ai:["Frame: drop zone and preview table with sample data. Check the table scrolls smoothly with 10 columns.","Core: load one of your real (deliberately dirty) CSVs; hide columns, filter, dedupe. Verify row counts before/after every operation.","Storage: save a 'recipe' — your usual chain of operations — to reapply to next month's file; no need to store table data itself.","Polish: one-step undo, filtered-row counts, a UTF-8 BOM export button, a warning for oversized files."],
 x:"The classic CSV pitfalls: the delimiter is sometimes a comma, sometimes a semicolon (locale-dependent Excel), and text containing commas must be quoted — ask the AI to auto-detect the delimiter and handle quotes to spec. Pitfall two: DD/MM vs MM/DD dates swapping silently; show sample rows after loading for the user to confirm. Upgrades: multiple saved recipes, merging many same-structure CSVs into one."}},
