<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>50 Ý Tưởng Cho Một File HTML — Bản viết lại &amp; cập nhật 2026</title>
    <meta name="description" content="Sách tương tác song ngữ Việt–Anh: 50 ý tưởng xây tool, game, app thật chỉ với một file HTML, bằng cách làm việc với AI. Viết lại và cập nhật tới năm 2026." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#faf8f4; --bg-soft:#f3efe7; --surface:#ffffff; --surface-2:#f7f3ec;
        --ink:#1d1a15; --ink-2:#45403a; --muted:#7a7264; --line:#e4ddd0; --line-2:#d4cbb9;
        --accent:#e05206; --accent-ink:#c24303; --accent-soft:#fdeee3;
        --green:#1e7d46; --amber:#a86a00; --red:#c22f2f;
        --green-bg:#e5f4ec; --amber-bg:#fdf3dd; --red-bg:#fdeaea;
        --code-bg:#f1ece1; --shadow:0 10px 34px rgba(50,35,10,.13);
        --topbar-h:57px; --side-w:284px; --rail-w:224px;
        color-scheme:light;
      }
      html[data-theme="dark"]{
        --bg:#131109; --bg-soft:#1a1712; --surface:#1d1a14; --surface-2:#242019;
        --ink:#efe9dc; --ink-2:#cfc7b4; --muted:#9a917e; --line:#322d23; --line-2:#453e30;
        --accent:#ff7a2f; --accent-ink:#ffa06b; --accent-soft:#3a2413;
        --green:#4cc07c; --amber:#e0aa3e; --red:#ef6a6a;
        --green-bg:#173325; --amber-bg:#3a2f12; --red-bg:#3c1d1d;
        --code-bg:#26221a; --shadow:0 12px 38px rgba(0,0,0,.5);
        color-scheme:dark;
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{margin:0;background:var(--bg);color:var(--ink);
        font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
      button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
      a{color:var(--accent-ink);text-decoration:none}
      a:hover{text-decoration:underline}
      ::selection{background:var(--accent);color:#fff}

      /* ---------- Topbar ---------- */
      .topbar{position:fixed;inset:0 0 auto 0;height:var(--topbar-h);z-index:60;
        display:flex;align-items:center;gap:.5rem;padding:0 .9rem;
        background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
        border-bottom:1px solid var(--line)}
      .tb-brand{display:flex;align-items:center;gap:.6rem;min-width:0;margin-right:auto}
      .tb-mark{flex:none;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
        display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:.82rem}
      .tb-title{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .tb-title small{display:block;font-weight:500;font-size:.68rem;color:var(--muted);letter-spacing:.02em}
      .tb-btn{display:inline-flex;align-items:center;gap:.45rem;padding:.42rem .7rem;border-radius:9px;
        border:1px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--ink-2)}
      .tb-btn:hover{border-color:var(--line-2);color:var(--ink)}
      .tb-btn svg{width:16px;height:16px;flex:none}
      .tb-btn .kbd{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:var(--muted)}
      .tb-progress{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--ink-2);white-space:nowrap}
      .tb-progress b{color:var(--accent-ink)}
      .icon-btn{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
      .icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
      .icon-btn svg{width:17px;height:17px}
      #menuBtn{display:none}
      .progress-line{position:fixed;top:var(--topbar-h);left:0;height:3px;background:var(--accent);width:0;z-index:61;transition:width .12s linear}

      /* ---------- Layout ---------- */
      .layout{display:flex;max-width:1560px;margin:0 auto;padding-top:var(--topbar-h)}
      .sidebar{position:fixed;top:var(--topbar-h);bottom:0;left:0;width:var(--side-w);z-index:50;
        overflow-y:auto;padding:1.1rem .8rem 2rem;background:var(--bg);border-right:1px solid var(--line)}
      .side-sec{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:1.15rem .55rem .45rem}
      .side-sec:first-child{margin-top:.1rem}
      .nav-item{display:flex;align-items:flex-start;gap:.55rem;width:100%;text-align:left;padding:.48rem .55rem;border-radius:9px;color:var(--ink-2);font-size:.86rem;line-height:1.4}
      .nav-item:hover{background:var(--bg-soft);color:var(--ink)}
      .nav-item.active{background:var(--accent-soft);color:var(--ink);font-weight:600}
      .nav-item .num{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--muted);padding-top:.18rem;min-width:1.7rem}
      .nav-item.active .num{color:var(--accent-ink)}
      .nav-item .done-dot{margin-left:auto;flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:.12rem;display:grid;place-items:center;color:#fff}
      .nav-item .done-dot svg{width:10px;height:10px;opacity:0}
      .nav-item.done .done-dot{background:var(--green);border-color:var(--green)}
      .nav-item.done .done-dot svg{opacity:1}
      .side-note{margin:1.4rem .55rem 0;padding:.8rem .85rem;border:1px dashed var(--line-2);border-radius:10px;font-size:.76rem;color:var(--muted);line-height:1.55}
      .scrim{display:none}

      main{flex:1;min-width:0;margin-left:var(--side-w)}
      .reader-wrap{display:flex;justify-content:center;gap:2.2rem;padding:0 1.2rem}
      .reader{width:100%;max-width:780px;padding:2.4rem 0 3rem;min-width:0}
      .rail{display:none;width:var(--rail-w);flex:none;padding:2.6rem 0}
      @media(min-width:1280px){.rail{display:block}}
      .rail-inner{position:sticky;top:calc(var(--topbar-h) + 1.4rem)}
      .rail h4{font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 0 .6rem}
      .rail a{display:block;padding:.32rem 0 .32rem .7rem;font-size:.8rem;color:var(--ink-2);border-left:2px solid var(--line);line-height:1.45}
      .rail a:hover{color:var(--ink);text-decoration:none}
      .rail a.on{color:var(--accent-ink);border-color:var(--accent);font-weight:600}

      /* ---------- Lesson header ---------- */
      .lesson-kicker{font-family:"JetBrains Mono",monospace;font-size:.74rem;color:var(--accent-ink);letter-spacing:.06em;text-transform:uppercase}
      .reader h1{font-size:2.05rem;line-height:1.22;font-weight:800;margin:.45rem 0 .4rem;letter-spacing:-.01em}
      .lesson-sub{font-size:1.06rem;color:var(--ink-2);margin:0 0 1rem;line-height:1.55}
      .lesson-meta{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.85rem 0 1.3rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:1.7rem}
      .meta-chip{font-size:.76rem;color:var(--muted);font-family:"JetBrains Mono",monospace}
      .meta-chip + .meta-chip::before{content:"·";margin-right:.5rem}
      .complete-btn{margin-left:auto;display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .95rem;border-radius:999px;
        border:1.5px solid var(--line-2);font-size:.84rem;font-weight:600;color:var(--ink-2);background:var(--surface)}
      .complete-btn:hover{border-color:var(--green);color:var(--green)}
      .complete-btn.is-done{background:var(--green);border-color:var(--green);color:#fff}
      .complete-btn svg{width:15px;height:15px}

      /* ---------- Prose ---------- */
      .prose h2{font-size:1.38rem;font-weight:700;line-height:1.3;margin:2.1rem 0 .7rem;letter-spacing:-.01em;scroll-margin-top:calc(var(--topbar-h) + 14px)}
      .prose h3{font-size:1.08rem;font-weight:700;margin:1.6rem 0 .5rem;scroll-margin-top:calc(var(--topbar-h) + 14px)}
      .prose p{margin:.65rem 0;color:var(--ink-2)}
      .prose p strong,.prose li strong{color:var(--ink)}
      .prose ul,.prose ol{margin:.5rem 0 .9rem;padding-left:1.35rem;color:var(--ink-2)}
      .prose li{margin:.32rem 0}
      .prose code{font-family:"JetBrains Mono",monospace;font-size:.84em;background:var(--code-bg);padding:.12em .38em;border-radius:5px;color:var(--ink)}
      .prose pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:.95rem 1.05rem;overflow-x:auto;margin:1rem 0}
      .prose pre code{background:none;padding:0;font-size:.83rem;line-height:1.6;display:block}
      .code-wrap{position:relative}
      .copy-code{position:absolute;top:.5rem;right:.5rem;padding:.3rem .65rem;border-radius:7px;background:var(--surface);border:1px solid var(--line-2);font-size:.72rem;font-weight:600;color:var(--ink-2)}
      .copy-code:hover{color:var(--ink)}
      .callout{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:.95rem 1.1rem;margin:1.1rem 0}
      .callout p{margin:.3rem 0}
      .callout .co-t{font-weight:700;color:var(--ink);font-size:.9rem;margin-bottom:.25rem}
      .prose table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:.9rem}
      .prose th{text-align:left;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:.5rem .6rem;border-bottom:2px solid var(--line-2)}
      .prose td{padding:.55rem .6rem;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
      .prose td strong{color:var(--ink)}
      .table-scroll{overflow-x:auto;margin:1rem 0}
      .table-scroll table{margin:0;min-width:520px}
      .check-list{list-style:none;padding:0;margin:.6rem 0 1.1rem}
      .check-list li{display:flex;gap:.65rem;padding:.5rem .2rem;border-bottom:1px solid var(--line);color:var(--ink-2)}
      .check-list li::before{content:"";flex:none;width:16px;height:16px;margin-top:.28rem;border:1.5px solid var(--line-2);border-radius:4px}
      .stage-list{list-style:none;padding:0;margin:.6rem 0 1rem;counter-reset:stage}
      .stage-list li{display:flex;gap:.8rem;padding:.65rem 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
      .stage-list .st-n{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-family:"JetBrains Mono",monospace;font-size:.78rem;font-weight:600;display:grid;place-items:center;margin-top:.1rem}

      /* ---------- Hero (README) ---------- */
      .hero{padding:.4rem 0 1.6rem;border-bottom:1px solid var(--line);margin-bottom:1.8rem}
      .hero .term{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--muted);margin-bottom:1rem}
      .hero .term .prompt{color:var(--accent-ink)}
      .hero .term .caret{display:inline-block;width:8px;height:1.05em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1.05s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .hero h1{font-size:2.6rem;line-height:1.14;margin:.2rem 0 .7rem}
      .hero .lede{font-size:1.13rem;color:var(--ink-2);line-height:1.6;margin:0 0 1.3rem;max-width:34rem}
      .hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin:1.2rem 0}
      .hstat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.85rem .95rem}
      .hstat b{display:block;font-size:1.55rem;font-weight:800;line-height:1.1}
      .hstat span{font-size:.76rem;color:var(--muted)}
      .attrib{font-size:.86rem;color:var(--ink-2);border-top:1px dashed var(--line-2);padding-top:.9rem;margin-top:1.1rem}
      .attrib strong{color:var(--ink)}

      /* ---------- Idea cards ---------- */
      .idea{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:1.25rem 1.3rem 1.1rem;margin:0 0 1.3rem;scroll-margin-top:calc(var(--topbar-h) + 14px)}
      .idea-head{display:flex;align-items:flex-start;gap:.8rem;flex-wrap:wrap}
      .idea-num{flex:none;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:.8rem;background:var(--ink);color:var(--bg);border-radius:8px;padding:.32rem .55rem;margin-top:.15rem}
      .idea h3{margin:0;font-size:1.16rem;flex:1;min-width:180px}
      .badges{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
      .badge{display:inline-flex;align-items:center;gap:.38rem;font-size:.72rem;font-weight:600;padding:.28rem .6rem;border-radius:999px}
      .badge .dot{width:8px;height:8px;border-radius:50%}
      .badge.easy{background:var(--green-bg);color:var(--green)} .badge.easy .dot{background:var(--green)}
      .badge.mid{background:var(--amber-bg);color:var(--amber)} .badge.mid .dot{background:var(--amber)}
      .badge.hard{background:var(--red-bg);color:var(--red)} .badge.hard .dot{background:var(--red)}
      .badge.tech{background:var(--bg-soft);color:var(--ink-2);font-family:"JetBrains Mono",monospace;font-weight:400;font-size:.7rem}
      .idea-sec{margin-top:.95rem}
      .idea-sec .lbl{font-size:.7rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:.3rem}
      .idea-sec p{margin:.2rem 0;color:var(--ink-2);font-size:.94rem}
      .idea-sec ul{margin:.25rem 0;padding-left:1.25rem;color:var(--ink-2);font-size:.94rem}
      .idea-sec li{margin:.22rem 0}
      .idea-sec ol{margin:.25rem 0;padding-left:1.25rem;color:var(--ink-2);font-size:.94rem}
      .idea-sec ol li{margin:.3rem 0}
      .idea-foot{margin-top:1rem;padding-top:.85rem;border-top:1px dashed var(--line);display:flex;justify-content:flex-end}
      .copy-idea{display:inline-flex;align-items:center;gap:.45rem;padding:.45rem .85rem;border-radius:8px;border:1px solid var(--line-2);font-size:.8rem;font-weight:600;color:var(--ink-2);background:var(--surface)}
      .copy-idea:hover{color:var(--ink);border-color:var(--accent);color:var(--accent-ink)}
      .copy-idea svg{width:14px;height:14px}
      .group-intro{margin-bottom:1.6rem}
      .filter-note{font-size:.85rem;color:var(--muted)}

      /* ---------- Quiz ---------- */
      .quiz{border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);padding:1.2rem 1.3rem;margin:2.2rem 0 0}
      .quiz h2{margin:0 0 .3rem;font-size:1.15rem}
      .quiz .q-sub{font-size:.85rem;color:var(--muted);margin:0 0 1rem}
      .q-block{padding:1rem 0;border-top:1px solid var(--line)}
      .q-block:first-of-type{border-top:0;padding-top:.2rem}
      .q-text{font-weight:600;margin:0 0 .7rem;color:var(--ink)}
      .q-opts{display:grid;gap:.5rem}
      .q-opt{display:flex;gap:.65rem;align-items:flex-start;text-align:left;width:100%;padding:.62rem .8rem;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:.92rem;color:var(--ink-2);line-height:1.5}
      .q-opt:hover{border-color:var(--accent)}
      .q-opt .ol{flex:none;font-family:"JetBrains Mono",monospace;font-size:.75rem;font-weight:600;width:22px;height:22px;border-radius:6px;background:var(--bg-soft);display:grid;place-items:center;margin-top:.05rem}
      .q-opt.right{border-color:var(--green);background:var(--green-bg);color:var(--ink)}
      .q-opt.right .ol{background:var(--green);color:#fff}
      .q-opt.wrong{border-color:var(--red);background:var(--red-bg);color:var(--ink)}
      .q-opt.wrong .ol{background:var(--red);color:#fff}
      .q-opt:disabled{cursor:default;opacity:.92}
      .q-exp{display:none;margin-top:.7rem;font-size:.88rem;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-2);border-radius:9px;padding:.65rem .8rem}
      .q-exp.show{display:block}
      .quiz-score{margin-top:1rem;font-weight:700;font-size:.95rem;color:var(--ink)}
      .quiz-score:empty{display:none}

      /* ---------- Prev / next ---------- */
      .pn-nav{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:2.4rem}
      .pn-card{border:1px solid var(--line);border-radius:12px;padding:.9rem 1.05rem;background:var(--surface);text-align:left;width:100%}
      .pn-card:hover{border-color:var(--accent)}
      .pn-card .pn-lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
      .pn-card .pn-t{display:block;font-weight:700;margin-top:.25rem;color:var(--ink);line-height:1.4}
      .pn-card.next{text-align:right}
      .pn-card.disabled{opacity:.38;pointer-events:none}

      /* ---------- Master table & filters ---------- */
      .filters{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:0 0 1.1rem}
      .filters .f-lbl{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:.2rem}
      .chip{padding:.42rem .85rem;border-radius:999px;border:1px solid var(--line-2);font-size:.82rem;font-weight:600;color:var(--ink-2);background:var(--surface)}
      .chip:hover{border-color:var(--accent)}
      .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
      .mrow{display:grid;grid-template-columns:3rem 1fr auto;gap:.8rem;align-items:center;padding:.68rem .8rem;border:1px solid var(--line);border-radius:11px;background:var(--surface);margin-bottom:.5rem;width:100%;text-align:left}
      .mrow:hover{border-color:var(--accent)}
      .mrow .mn{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--muted);font-size:.85rem}
      .mrow .mt{font-weight:600;color:var(--ink);font-size:.94rem}
      .mrow .mt small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;font-family:"JetBrains Mono",monospace;margin-top:.1rem}
      .mrow.hidden-row{display:none}
      .group-head{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin:1.4rem 0 .6rem}

      /* ---------- Search overlay ---------- */
      .search-overlay{position:fixed;inset:0;z-index:90;background:rgba(15,12,6,.5);display:none;padding:9vh 1rem 1rem}
      .search-overlay.open{display:block}
      .search-box{max-width:620px;margin:0 auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line-2)}
      .search-box input{width:100%;border:0;outline:0;background:var(--surface);color:var(--ink);font:inherit;font-size:1.02rem;padding:1rem 1.15rem;border-bottom:1px solid var(--line)}
      .search-results{max-height:52vh;overflow-y:auto;padding:.5rem}
      .sr-item{display:block;width:100%;text-align:left;padding:.65rem .75rem;border-radius:10px}
      .sr-item:hover,.sr-item.sel{background:var(--bg-soft)}
      .sr-item .sr-t{font-weight:600;font-size:.92rem;color:var(--ink)}
      .sr-item .sr-s{font-size:.78rem;color:var(--muted);margin-top:.1rem;line-height:1.45}
      .sr-empty{padding:1.1rem;text-align:center;color:var(--muted);font-size:.88rem}

      /* ---------- Footer ---------- */
      footer{border-top:1px solid var(--line);margin-top:1rem;padding:1.6rem 0 .5rem;font-size:.83rem;color:var(--muted);line-height:1.7}
      footer strong{color:var(--ink-2)}

      .toast{position:fixed;bottom:1.2rem;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;font-size:.85rem;font-weight:600;z-index:120;transition:transform .25s ease,opacity .25s ease,visibility 0s linear .25s;box-shadow:var(--shadow);opacity:0;visibility:hidden}
      .toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .25s ease,opacity .25s ease}

      @media(max-width:1023px){
        .sidebar{display:none}
        .sidebar.open{display:block;box-shadow:var(--shadow)}
        .scrim{display:none;position:fixed;inset:0;top:var(--topbar-h);background:rgba(15,12,6,.45);z-index:49}
        .scrim.show{display:block}
        main{margin-left:0}
        #menuBtn{display:grid}
        .tb-title small{display:none}
      }
      @media(max-width:640px){
        .reader{padding:1.5rem 0 2.4rem}
        .reader-wrap{padding:0 .95rem}
        .hero h1{font-size:2rem}
        .reader h1{font-size:1.62rem}
        .hero-stats{grid-template-columns:repeat(2,1fr)}
        .pn-nav{grid-template-columns:1fr}
        .tb-progress{display:none}
        .tb-btn .lbl{display:none}
        .complete-btn{margin-left:0}
        .mrow{grid-template-columns:2.2rem 1fr;grid-template-rows:auto auto}

<script type="text/html" id="body-vi-readme">
<div class="hero">
  <div class="term"><span class="prompt">tong@uad</span>:~$ ai build mot-file.html<span class="caret"></span></div>
  <h1>50 Ý Tưởng Cho Một File HTML</h1>
  <p class="lede">Xây tool, game và app thật — chỉ với một file duy nhất, bằng cách làm việc với AI. Không cài đặt, không máy chủ, không tài khoản: một file mở là chạy, gửi ai cũng dùng được.</p>
  <div class="hero-stats">
    <div class="hstat"><b>50</b><span>Ý tưởng thực hành</span></div>
    <div class="hstat"><b>6</b><span>Nhóm chủ đề</span></div>
    <div class="hstat"><b>21</b><span>Bài học</span></div>
    <div class="hstat"><b>2</b><span>Ngôn ngữ VI · EN</span></div>
  </div>
  <p class="attrib"><strong>Sưu tầm &amp; tổng hợp: Tống Quốc Tuấn — Kỹ Sư RnD, thời điểm cập nhật là vào năm 2026.</strong><br>Ấn bản này được viết lại toàn bộ và cập nhật theo hiện trạng năm 2026: công cụ AI dạng tác tử (agent) đã phổ biến, trình duyệt có thêm nhiều năng lực mới, và cách làm việc với AI đã dịch chuyển từ "gõ một câu lệnh" sang "quản lý ngữ cảnh".</p>
</div>
<h2>Cuốn sách này dành cho ai</h2>
<p>Cho người <strong>không rành code</strong> nhưng có việc thật cần giải quyết: một bảng theo dõi việc, một máy tính lương cho team, một trò chơi cho con, một form khảo sát cho lớp học. Bạn không cần học lập trình trước. Bạn cần học cách <strong>mô tả đúng việc cho AI</strong>, kiểm thử bằng mắt mình, và lặp lại từng bước nhỏ cho tới khi công cụ chạy đúng.</p>
<p>Cho cả người đã biết chút ít kỹ thuật và muốn một "xưởng đồ nghề" nhẹ: những công cụ dùng một lần rồi bỏ, hoặc dùng hằng ngày nhưng không đáng để dựng cả một hệ thống.</p>
<h2>Cách dùng sách</h2>
<ul>
<li><strong>Đọc Phần 0 trước</strong> (bài 00–06): nền tảng về một file HTML làm được gì, ranh giới ở đâu, và quy trình bốn giai đoạn làm việc với AI. Đây là phần quyết định bạn thành công hay bỏ cuộc giữa chừng.</li>
<li><strong>Phần 1 là thực đơn 50 ý tưởng</strong> (bài 07–12). Đừng đọc tuyến tính: chọn đúng một ý gần với việc bạn đang cần nhất và bắt tay làm ngay.</li>
<li><strong>Phần 2</strong> (bài 13–16) giúp bạn làm tốt hơn: mẫu thiết kế dùng lại, cách kiểm thử khi không đọc được code, cách đưa công cụ tới tay người dùng, và lộ trình đi tiếp khi một file không còn đủ.</li>
<li><strong>Phụ lục C</strong> là bảng tổng hợp 50 ý tưởng, có lọc theo nhóm và độ khó — nơi tốt nhất để chọn điểm bắt đầu.</li>
<li>Mỗi bài chương (00–16) có <strong>2 câu kiểm tra nhanh</strong> ở cuối để tự chấm mức hiểu trước khi sang bài mới.</li>
</ul>
<h2>Khuôn mẫu trình bày mỗi ý tưởng</h2>
<p>Cả 50 ý đều đi theo cùng một khuôn sáu mục, để bạn so sánh và chọn nhanh:</p>
<ol>
<li><strong>Vấn đề &amp; ai dùng</strong> — nỗi đau cụ thể và người gặp nó.</li>
<li><strong>Người dùng làm được gì</strong> — danh sách tính năng nhìn từ phía người dùng.</li>
<li><strong>Vì sao một file là đủ</strong> — đối chiếu với năng lực trình duyệt.</li>
<li><strong>Hướng đi &amp; kiến trúc</strong> — màn hình nào, dữ liệu nào, chảy ra sao.</li>
<li><strong>Làm việc với AI</strong> — bốn giai đoạn: Khung → Cốt lõi → Lưu trữ → Đánh bóng, kèm cách kiểm thử từng giai đoạn.</li>
<li><strong>Cạm bẫy &amp; nâng cấp</strong> — chỗ hay gãy nhất và hướng mở rộng sau này.</li>
</ol>
<h2>Độ khó nghĩa là gì</h2>
<p>Độ khó trong sách đo cho <strong>người không rành code làm việc cùng AI</strong>, không phải độ khó lập trình: <strong>Dễ</strong> — làm trong một buổi, ít vòng lặp; <strong>Vừa</strong> — vài buổi, cần kiên nhẫn kiểm thử; <strong>Khó</strong> — đụng phần "hóc" như mã hoá, thuật toán sinh bài, kéo-thả phức tạp, cần nhiều vòng lặp với AI. Người mới nên bắt đầu ở các ý Dễ như Ý 5, Ý 13, Ý 30, Ý 39 để quen quy trình trước.</p>
<h2>Một lưu ý về độ tin cậy</h2>
<p>Năng lực trình duyệt và công cụ AI thay đổi theo từng quý. Mọi tuyên bố kỹ thuật trong sách đều thuộc loại "đúng ở thời điểm cập nhật 2026 và có thể thay đổi" — thói quen đúng là luôn kiểm thử bằng chính mắt mình trên thiết bị thật, đúng tinh thần của Chương 14. Một việc được kể là làm được khác với một việc bạn thấy nó chạy.</p>
</script>

<script type="text/html" id="body-vi-00">
<h2>Một câu chuyện ngắn</h2>
<p>Một trưởng nhóm cần bảng theo dõi tiến độ giao việc cho 28 người. Phương án "đàng hoàng" là xin mua phần mềm, chờ phê duyệt, chờ triển khai — vài tuần. Phương án một-file: chiều hôm đó, ngồi với AI khoảng một giờ, ra một file HTML duy nhất. Gửi file qua chat, ai nhận cũng mở lên dùng ngay, dữ liệu nằm trên máy của từng người. Không hoàn hảo, nhưng <strong>việc xong trong ngày</strong>, và đó mới là thứ đang cần.</p>
<p>Câu chuyện kiểu này đang lặp lại ở khắp nơi: giáo viên làm quiz cho lớp, chủ tiệm nhỏ làm trình in hoá đơn, phụ huynh làm game luyện toán cho con. Điểm chung: người làm không phải lập trình viên.</p>
<h2>Hai làn sóng gặp nhau</h2>
<p><strong>Làn sóng thứ nhất: trình duyệt đã trở thành một hệ điều hành thu nhỏ.</strong> Vẽ đồ hoạ, phát âm thanh, lưu dữ liệu bền vững, đọc/ghi file, mã hoá, in ấn — tất cả có sẵn trong một file HTML mở lên là dùng, không cài thêm gì (Chương 1 sẽ mở kho này ra).</p>
<p><strong>Làn sóng thứ hai: AI viết code theo mô tả.</strong> Tới 2026, các trợ lý AI không chỉ trả lời câu hỏi mà còn tự đọc file, sửa file, chạy thử và sửa tiếp — dạng "tác tử lập trình" (coding agent). Nhưng dù AI mạnh tới đâu, người ra đề vẫn là bạn: mô tả càng rõ, vòng lặp càng nhỏ, kết quả càng đáng tin. Cuốn sách này dạy đúng phần việc của con người trong cặp đôi đó.</p>
<h2>Vì sao lại là <em>một</em> file, mà không phải một ứng dụng "đàng hoàng"?</h2>
<ul>
<li><strong>Không ma sát:</strong> không cài đặt, không đăng ký, không máy chủ phải duy trì. Gửi file là xong.</li>
<li><strong>Không chi phí chạy:</strong> không thuê server, không phí hằng tháng. File nằm yên trên máy, mười năm sau mở vẫn chạy.</li>
<li><strong>Riêng tư mặc định:</strong> dữ liệu không rời khỏi máy người dùng, vì không có nơi nào để nó đi.</li>
<li><strong>Dễ chia sẻ và dễ bỏ:</strong> hợp với công cụ cá nhân, công cụ nội bộ nhỏ, đồ dùng một mùa vụ.</li>
</ul>
<h2>Cuốn sách này dạy bạn điều gì (và không dạy gì)</h2>
<p>Sách dạy: nhận diện việc nào hợp với một file, mô tả việc cho AI theo bốn giai đoạn, kiểm thử như một người dùng khó tính, và chia sẻ sản phẩm tử tế. Sách <strong>không</strong> dạy cú pháp lập trình, không thay thế được việc học nền tảng nếu bạn muốn đi xa theo nghề — Chương 16 sẽ chỉ đường cho chặng đó.</p>
<h2>Cách tiếp cận tinh thần</h2>
<p>Ba câu nên thuộc nằm lòng: <strong>nhỏ trước, chạy được trước, đẹp sau</strong>. Mọi ý tưởng trong sách đều bắt đầu từ phiên bản xấu xí nhưng chạy được, rồi mới thêm dần. Người bỏ cuộc thường không thua vì ý tưởng khó, mà vì đòi phiên bản đầu tiên phải hoàn hảo.</p>
</script>

<script type="text/html" id="body-vi-01">
<h2>Ba lớp trong một file</h2>
<p>Một file HTML chứa ba lớp xếp chồng nhau, và bạn chỉ cần hiểu chúng ở mức "biết nó tồn tại để mô tả cho AI":</p>
<ul>
<li><strong>HTML — khung xương:</strong> các khối nội dung: tiêu đề, đoạn văn, nút bấm, ô nhập, bảng.</li>
<li><strong>CSS — diện mạo:</strong> màu sắc, cỡ chữ, khoảng cách, bố cục, chế độ tối.</li>
<li><strong>JavaScript — hành vi:</strong> bấm nút thì việc gì xảy ra, tính toán, lưu trữ, vẽ chuyển động.</li>
</ul>
<p>Khi mô tả cho AI, tách ba lớp này ra trong đầu sẽ giúp câu lệnh của bạn rõ ràng hơn nhiều: "giữ nguyên hành vi, chỉ đổi diện mạo sang tông tối" là một yêu cầu tốt hơn hẳn "làm cho đẹp hơn".</p>
<h2>Kho "siêu năng lực" có sẵn — không cần cài gì</h2>
<h3>Vẽ &amp; đồ hoạ — Canvas và SVG</h3>
<p>Canvas là tấm bảng vẽ pixel: game, biểu đồ, trình vẽ, xuất ảnh PNG đều từ đây. SVG là đồ hoạ vector: sơ đồ, biểu tượng, mind map co giãn không vỡ nét.</p>
<h3>Âm thanh — Web Audio API</h3>
<p>Trình duyệt tự tổng hợp được âm thanh: tiếng chuông báo giờ, nhịp metronome, cả một hộp nhịp (beat maker) — không cần nhúng file nhạc.</p>
<h3>Ghi nhớ dữ liệu — localStorage và IndexedDB</h3>
<p>localStorage: ngăn nhỏ (khoảng 5–10 MB) cho dữ liệu chữ và cấu trúc đơn giản. IndexedDB: ngăn lớn hơn nhiều (có thể tới hàng trăm MB tuỳ trình duyệt và dung lượng máy) cho dữ liệu có cấu trúc và cả file ảnh. Chi tiết và cách chọn ở Chương 5.</p>
<h3>Đọc &amp; ghi file</h3>
<p>Người dùng chọn file để nạp vào (CSV, ảnh, JSON), và tải file kết quả về (CSV, PNG, PDF qua in). Trên Chrome/Edge còn có File System Access API cho phép lưu thẳng vào một file đã chọn — đến 2026 đây vẫn là năng lực "có điều kiện" (chủ yếu Chromium), nên luôn cần phương án dự phòng là tải-xuống thông thường.</p>
<h3>Mã hoá — Web Crypto API</h3>
<p>Băm và mã hoá chuẩn (AES-GCM, PBKDF2…) chạy ngay trong trình duyệt — nền tảng cho két mật khẩu offline ở Ý 7. Lưu ý: Web Crypto chỉ hoạt động trong "ngữ cảnh an toàn" (HTTPS hoặc file mở từ máy có thể bị giới hạn tuỳ trình duyệt) — kiểm thử trên đúng cách bạn sẽ phân phối file.</p>
<h3>In ấn &amp; xuất PDF</h3>
<p>Hộp thoại in của trình duyệt chính là máy xuất PDF miễn phí và khá đẹp nếu CSS in được chăm chút — hoá đơn, CV, báo giá đều dùng đường này.</p>
<h3>Giọng nói</h3>
<p>Đọc văn bản thành tiếng (text-to-speech) có sẵn; nhận dạng giọng nói thì phụ thuộc trình duyệt và thường cần mạng — xếp vào nhóm "kiểm chứng trước khi hứa".</p>
<h3>Và những năng lực mới đáng chú ý tới 2026</h3>
<ul>
<li><strong>WebGPU</strong> — đồ hoạ và tính toán song song mạnh hơn Canvas/WebGL, đã có mặt trên các trình duyệt lớn; hữu ích cho trực quan hoá nặng (Ý 25), nhưng hãy coi là "nâng cấp", không phải mặc định.</li>
<li><strong>Popover, thẻ <code>&lt;dialog&gt;</code>, View Transitions</strong> — hộp thoại, menu bật và hiệu ứng chuyển cảnh mượt trở thành việc của CSS/HTML thuần, ít phải nhờ thư viện.</li>
<li><strong>OPFS (Origin Private File System)</strong> — hệ file riêng tốc độ cao cho ứng dụng web, bổ sung cho IndexedDB khi cần lưu nhiều dữ liệu nhị phân.</li>
</ul>
<h2>Một cảnh báo quan trọng về "hỗ trợ trình duyệt"</h2>
<p>Không phải năng lực nào cũng có trên mọi trình duyệt và mọi cách mở file. Quy tắc làm việc: chọn năng lực "an toàn" (Canvas, localStorage, in ấn) cho phần cốt lõi; năng lực "có điều kiện" (File System Access, nhận dạng giọng nói, WebGPU) chỉ dùng khi có phương án dự phòng. Phụ lục A là bảng tra cứu nhanh cho việc này.</p>
<h2>Vì sao điều này thay đổi cuộc chơi cho bạn</h2>
<p>Trước đây, muốn có một công cụ là phải có người biết dựng cả dây chuyền: cài môi trường, chọn framework, thuê máy chủ. Giờ dây chuyền đó co lại thành: <strong>một trình duyệt (ai cũng có) + một AI (bạn đang dùng) + một file</strong>. Phần việc còn lại của bạn là mô tả và kiểm thử — và đó là thứ học được trong vài buổi.</p>
</script>

<script type="text/html" id="body-vi-02">
<h2>Những gì một file <strong>làm rất tốt</strong></h2>
<ul>
<li>Công cụ một người dùng, dữ liệu ở một máy: ghi chú, theo dõi, tính toán, tra cứu.</li>
<li>Sản phẩm "xuất ra" được: ảnh PNG, bản in/PDF, file CSV, file lịch .ics.</li>
<li>Game và trải nghiệm tương tác chạy hoàn toàn tại chỗ.</li>
<li>Chia sẻ kiểu "gửi hiện vật": gửi file, gửi link chứa trạng thái, gửi mã QR.</li>
</ul>
<h2>Những gì một file <strong>không</strong> làm được (một mình)</h2>
<h3>1. Chia sẻ dữ liệu sống giữa nhiều người, theo thời gian thực</h3>
<p>Không máy chủ nghĩa là không có "sự thật chung" cho nhiều người cùng sửa. Phương án thực tế: mỗi người một bản, hoặc chia sẻ qua file/link chụp trạng thái (Ý 44, 49 trình bày thẳng giới hạn này kèm cách vòng qua).</p>
<h3>2. Giữ bí mật</h3>
<p>Mọi thứ trong file đều đọc được bằng mắt — kể cả khoá API nếu bạn lỡ nhúng vào. Tuyệt đối không đặt khoá bí mật, mật khẩu dùng chung hay dữ liệu nhạy cảm dạng rõ trong file.</p>
<h3>3. Tự gửi email, tin nhắn, hay "chạy nền"</h3>
<p>File chỉ sống khi đang mở. Nó không tự thức dậy lúc 7 giờ sáng để nhắc việc; nhắc nhở chỉ xảy ra khi người dùng mở công cụ lên.</p>
<h3>4. Gọi tự do mọi dịch vụ trên internet</h3>
<p>Trình duyệt chặn phần lớn lời gọi chéo nguồn (CORS). API công khai nào cho phép thì dùng được; còn lại, hãy nạp dữ liệu qua file do người dùng chọn.</p>
<h3>5. "Cài đặt như app thật" khi mở từ file trên máy</h3>
<p>Service Worker và tính năng PWA đầy đủ đòi hỏi trang được phục vụ qua HTTPS. Mở bằng file:// thì hãy coi công cụ là "trang web trong một file", đừng hứa hẹn trải nghiệm cài-đặt-như-app.</p>
<h3>6. Dữ liệu cục bộ có thể bị mất</h3>
<p>Xoá dữ liệu trình duyệt, đổi máy, dọn dẹp hệ thống — dữ liệu localStorage/IndexedDB đi theo. Vì vậy <strong>Xuất/Nhập sao lưu không phải tính năng phụ, mà là điều kiện sống còn</strong> (Chương 5).</p>
<h3>7. Giới hạn về kích thước và sức mạnh</h3>
<p>Một file vài MB là thoải mái; vài chục MB ảnh nhúng sẽ ì ạch. Tính toán cực nặng hay đồ hoạ 3D phức tạp vẫn làm được mức vừa, nhưng đừng kỳ vọng ngang phần mềm chuyên dụng.</p>
<h2>Bảng quyết định nhanh: ý tưởng của tôi có khả thi trong một file không?</h2>
<div class="table-scroll"><table>
<tr><th>Câu hỏi</th><th>Nếu "có"</th><th>Nếu "không"</th></tr>
<tr><td>Một người dùng chính, trên máy của họ?</td><td>Rất hợp một file</td><td>Cân nhắc máy chủ / xem Ý 44, 49 để vòng qua</td></tr>
<tr><td>Dữ liệu mất đi có sao lưu lại được?</td><td>Làm luôn, kèm nút Xuất/Nhập</td><td>Đừng lưu thứ không thể mất vào một file</td></tr>
<tr><td>Cần chạy khi không có mạng?</td><td>Một file là lựa chọn mạnh</td><td>—</td></tr>
<tr><td>Cần bí mật / khoá API?</td><td><strong>Không</strong> nhúng vào file</td><td>Tiếp tục</td></tr>
<tr><td>Sản phẩm cuối là ảnh / PDF / CSV?</td><td>Rất hợp</td><td>—</td></tr>
</table></div>
<h2>Tinh thần đúng đắn</h2>
<p>Nói thẳng giới hạn không làm ý tưởng yếu đi; nó làm người dùng tin bạn hơn. Mọi ý trong sách gặp chỗ một file không làm trọn đều ghi rõ kèm phương án thực tế — hãy giữ thói quen đó trong công cụ của chính bạn.</p>
</script>

<script type="text/html" id="body-vi-03">
<h2>"Phần mềm nhỏ" — một lựa chọn, không phải sự thiếu thốn</h2>
<p>Ngành phần mềm quen với tư duy "làm là phải lớn": nhiều tính năng, nhiều người dùng, tăng trưởng mãi. Nhưng phần lớn nhu cầu thật trong đời lại nhỏ và cụ thể: một bảng theo dõi cho một team, một máy tính cho một loại hợp đồng, một trò chơi cho một đứa trẻ. Với những nhu cầu đó, phần mềm lớn là <strong>quá tay</strong> — đắt, chậm, và bắt người dùng phục vụ nó thay vì ngược lại.</p>
<h2>Bốn giá trị cốt lõi</h2>
<h3>1. Local-first — máy của bạn là trung tâm</h3>
<p>Dữ liệu sinh ra ở đâu thì nằm ở đó. Không đồng bộ ép buộc, không "đám mây" nào nắm giữ bản gốc. Người dùng kiểm soát hoàn toàn: sao lưu, mang đi, xoá hẳn.</p>
<h3>2. No-build — không có "dây chuyền sản xuất"</h3>
<p>Không bước biên dịch, không đóng gói, không triển khai. Sửa xong là dùng, gửi đi là chạy. Vòng phản hồi ngắn tới mức bạn dám thử nghiệm liên tục.</p>
<h3>3. Sở hữu &amp; bất tử</h3>
<p>Một file HTML không phụ thuộc công ty nào còn sống hay dịch vụ nào còn mở. Nó không bị "khai tử" khi nhà cung cấp đổi chiến lược. Mười năm nữa, trình duyệt vẫn mở được nó.</p>
<h3>4. Riêng tư theo thiết kế</h3>
<p>Không phải cam kết "chúng tôi không thu thập dữ liệu" — mà là kiến trúc không có chỗ nào để dữ liệu đi. Riêng tư ở đây là hệ quả vật lý, không phải lời hứa marketing.</p>
<h2>Mỹ học của sự vừa đủ</h2>
<p>Công cụ một-file đẹp theo cách khác: nó làm <strong>đúng một việc</strong>, mở lên là hiểu ngay, không màn hình chào, không hướng dẫn dài. Khi phân vân giữa thêm một tính năng và giữ sự gọn gàng, hãy nhớ người dùng của bạn mở nó lên giữa một ngày bận — sự vừa đủ chính là tính năng.</p>
<h2>Khi nào một file <em>không</em> còn đủ</h2>
<p>Khi nhiều người phải cùng sửa một dữ liệu sống; khi dữ liệu là tài sản không được phép mất; khi cần thông báo đẩy, chạy nền, thanh toán thật. Nhận ra ranh giới đó không phải thất bại — Chương 16 vạch sẵn các nấc thang đi lên, và công cụ một-file của bạn khi ấy trở thành bản nháp sống hoàn hảo cho hệ thống lớn hơn.</p>
<h2>Tinh thần mang theo</h2>
<p>Làm nhỏ không phải làm ẩu. Ngược lại: vì không có máy chủ để "vá" sau, công cụ một-file đòi hỏi sự tử tế ở những chỗ căn bản — sao lưu được, báo lỗi rõ, trạng thái rỗng biết nói. Phần còn lại của sách là để bạn làm được sự tử tế đó.</p>
</script>

<script type="text/html" id="body-vi-04">
<div class="callout"><p class="co-t">Chương quan trọng nhất của sách</p><p>Nếu chỉ đọc một chương, hãy đọc chương này. 50 ý tưởng phía sau đều dùng chung một quy trình bốn giai đoạn được trình bày ở đây.</p></div>
<h2>AI nào, và chúng khác gì nhau?</h2>
<p>Tới 2026, bạn có ba kiểu làm việc chính với AI khi dựng công cụ:</p>
<ul>
<li><strong>Chat AI</strong> (cửa sổ hội thoại): bạn mô tả, AI trả về một file, bạn lưu lại và mở thử. Đơn giản nhất, hợp với người mới và công cụ nhỏ.</li>
<li><strong>AI trong trình soạn thảo / tác tử lập trình (coding agent)</strong>: AI tự đọc file hiện tại, sửa đúng chỗ, chạy thử và báo lại. Vòng lặp nhanh hơn nhiều khi công cụ đã lớn; đổi lại bạn phải quản lý ngữ cảnh chặt hơn (xem mục "Kỹ thuật ngữ cảnh" bên dưới).</li>
<li><strong>AI tạo giao diện theo mô tả</strong> trong các nền tảng dựng web nhanh: tiện để lấy cảm hứng bố cục, nhưng sản phẩm cuối vẫn nên là file bạn cầm được trong tay.</li>
</ul>
<p>Dù kiểu nào, nguyên tắc của chương này không đổi: <strong>chia nhỏ, kiểm thử từng nấc, giữ phiên bản đang chạy tốt</strong>.</p>
<h2>Tư duy nền: bạn là đạo diễn, không phải người quay phim</h2>
<p>AI giỏi viết code nhanh, nhưng nó không biết việc của bạn: ai dùng, dữ liệu thật trông thế nào, chỗ nào là "đúng" theo nghiệp vụ. Bạn là người duy nhất biết những điều đó. Việc của bạn là: ra đề rõ, xem kết quả bằng mắt, phán đoán đúng/sai, và ra lệnh tiếp theo. Đừng bao giờ nhận một file "trông có vẻ xong" mà chưa bấm thử từng nút.</p>
<h2>Quy trình bốn giai đoạn</h2>
<ol class="stage-list">
<li><span class="st-n">1</span><div><strong>KHUNG — cái vỏ chạy được.</strong> Yêu cầu AI dựng bố cục tĩnh: các màn hình, tiêu đề, vài dữ liệu mẫu, chưa cần tính năng thật. Kiểm thử bằng mắt: bố cục có đúng ý? chữ có đọc được trên điện thoại không? Mục tiêu của giai đoạn này là <em>nhìn thấy</em> công cụ, không phải dùng nó.</div></li>
<li><span class="st-n">2</span><div><strong>CỐT LÕI — làm cho nó chạy.</strong> Thêm đúng một hành vi chính (thêm thẻ, đếm ngược, tính tiền…). Kiểm thử hành vi đó tới khi đúng, kể cả các trường hợp lạ: nhập rỗng, số âm, xoá hết. Chỉ một hành vi mỗi vòng.</div></li>
<li><span class="st-n">3</span><div><strong>LƯU TRỮ — làm cho nó nhớ.</strong> Nối lưu trữ (localStorage/IndexedDB) và cặp nút Xuất/Nhập sao lưu. Kiểm thử vòng đời đầy đủ: nhập dữ liệu → đóng tab → mở lại → xuất file → xoá → nhập lại.</div></li>
<li><span class="st-n">4</span><div><strong>ĐÁNH BÓNG — làm cho nó dễ chịu.</strong> Chế độ tối, trạng thái rỗng, thông báo lỗi thân thiện, cỡ chữ trên điện thoại, in ấn. Đây cũng là lúc nhờ AI tự rà soát chất lượng (Chương 14).</div></li>
</ol>
<h2>Nghệ thuật mô tả ý tưởng cho AI</h2>
<ul>
<li><strong>Nói rõ người dùng và việc chính:</strong> "Công cụ cho giáo viên tiểu học, việc chính là tạo đề toán 20 câu trong 1 phút."</li>
<li><strong>Liệt kê màn hình và dữ liệu:</strong> mỗi màn hình có gì, mỗi mục dữ liệu gồm những trường nào.</li>
<li><strong>Cho ví dụ thật:</strong> dán 3–5 dòng dữ liệu mẫu đúng định dạng bạn dùng hằng ngày.</li>
<li><strong>Nêu ràng buộc:</strong> "chỉ một file HTML, không thư viện ngoài, dữ liệu lưu localStorage, phải có nút Xuất/Nhập".</li>
<li><strong>Chỉ sửa một việc mỗi lệnh:</strong> lệnh càng nhỏ, AI càng ít phá vỡ phần đang chạy tốt.</li>
</ul>
<h2>Kỹ thuật ngữ cảnh — cập nhật 2026</h2>
<p>Điểm khác lớn nhất của làm việc với AI năm 2026 so với vài năm trước: chất lượng kết quả phụ thuộc vào <strong>ngữ cảnh bạn cấp</strong> hơn là vào một "câu thần chú". Thực hành tốt hiện nay:</p>
<ul>
<li>Luôn đưa AI <strong>toàn bộ file hiện tại</strong> (hoặc để tác tử tự đọc file), thay vì mô tả lại từ trí nhớ — tránh lỗi "AI sửa một bản không tồn tại".</li>
<li>Giữ một đoạn <strong>mô tả dự án cố định</strong>: mục đích, người dùng, ràng buộc kỹ thuật, các quyết định đã chốt. Dán kèm mỗi phiên làm việc mới.</li>
<li>Khi AI hỗ trợ kết nối công cụ qua MCP (Model Context Protocol), tác tử có thể tự đọc file, tra tài liệu và chạy kiểm thử — hãy tận dụng, nhưng vẫn giữ kỷ luật bốn giai đoạn: quyền sửa nhiều hơn không có nghĩa là bước kiểm thử được ít đi.</li>
<li>Với tác vụ dài, yêu cầu AI <strong>viết kế hoạch trước khi sửa</strong>, bạn duyệt kế hoạch rồi mới cho thực thi.</li>
</ul>
<h2>Khi có lỗi: cách báo lỗi hiệu quả</h2>
<p>Báo lỗi tốt gồm bốn mảnh: <strong>làm gì</strong> (thao tác từng bước), <strong>thấy gì</strong> (chụp màn hình hoặc chép đúng dòng báo lỗi trong Console), <strong>mong đợi gì</strong>, và <strong>đừng đổi gì khác</strong> ("chỉ sửa lỗi này, giữ nguyên phần còn lại"). Báo lỗi mơ hồ kiểu "nó không chạy" là nguyên nhân số một khiến vòng lặp kéo dài vô tận.</p>
<h2>Lưu phiên bản: đừng đánh mất thứ đang chạy tốt</h2>
<p>Trước mỗi thay đổi lớn, lưu một bản sao có ngày tháng: <code>kanban-2026-11-10-v3.html</code>. AI sửa hỏng không đáng sợ — mất phiên bản đang chạy tốt mới đáng sợ. Quy tắc thép: <strong>không bao giờ sửa trực tiếp trên bản duy nhất đang chạy tốt</strong>.</p>
<h2>Năm sai lầm thường gặp (và cách tránh)</h2>
<ol>
<li>Đòi tất cả tính năng trong một lệnh đầu tiên → hãy đi theo bốn giai đoạn.</li>
<li>Không kiểm thử mà cứ tích lũy yêu cầu → mỗi vòng lặp phải kết thúc bằng việc bấm thử.</li>
<li>Quên sao lưu dữ liệu và sao lưu phiên bản → Chương 5 và quy tắc đặt tên ở trên.</li>
<li>Để AI tự quyết định nghiệp vụ → bạn là đạo diễn; số liệu, quy tắc tính là của bạn.</li>
<li>Bỏ cuộc ở vòng lặp thứ ba → phần lớn công cụ "chạy được" nằm ở vòng lặp thứ tư đến thứ tám.</li>
</ol>
<h2>Một vòng lặp mẫu trong thực tế</h2>
<p>"Giai đoạn 2 cho Ý 5: hãy làm cho nút Tính lương hoạt động. Công thức: lương thực nhận = lương cơ bản + phụ cấp − bảo hiểm 10,5% trên lương cơ bản − thuế theo bảng tôi dán kèm. Chưa cần lưu trữ. Sau khi sửa, liệt kê 3 trường hợp tôi nên tự kiểm thử, kèm kết quả đúng kỳ vọng." — Một lệnh như vậy cho kết quả tốt hơn hẳn "làm máy tính lương cho tôi", vì nó có giai đoạn, có công thức, có tiêu chuẩn nghiệm thu.</p>
</script>

<script type="text/html" id="body-vi-05">
<h2>Ba "ngăn" để cất dữ liệu</h2>
<h3>1. Ngăn nhỏ, tiện — localStorage</h3>
<p>Lưu cặp khoá–giá trị dạng chữ, đồng bộ và cực kỳ dễ dùng. Hợp với: cài đặt, danh sách vừa (vài trăm mục), trạng thái giao diện. Giới hạn khoảng 5–10 MB và chỉ lưu được chữ — dữ liệu có cấu trúc phải chuyển qua JSON. Đây là lựa chọn mặc định cho đa số ý tưởng trong sách.</p>
<h3>2. Ngăn lớn, có ngăn kéo — IndexedDB</h3>
<p>Cơ sở dữ liệu ngay trong trình duyệt: lưu được đối tượng, ảnh (blob), lượng lớn hơn nhiều. Đổi lại, cách dùng phức tạp hơn — hãy để AI lo phần kỹ thuật, việc của bạn là mô tả rõ "lưu cái gì, tìm lại bằng gì". Dùng khi có ảnh (Ý 16) hoặc dữ liệu phình to theo năm tháng.</p>
<h3>3. Ngăn ngoài đời — file trên máy</h3>
<p>Xuất dữ liệu ra file (JSON/CSV) để người dùng tự cất: vào thư mục sao lưu, lên đám mây cá nhân, gửi cho người khác. Đây là ngăn duy nhất sống sót qua mọi sự cố trình duyệt — và là lý do mọi công cụ nghiêm túc đều cần nút Xuất.</p>
<h2>Nguyên tắc vàng: LUÔN có Sao lưu &amp; Khôi phục</h2>
<div class="callout"><p class="co-t">Cặp đôi bất ly thân: Xuất / Nhập</p><p>Mọi công cụ lưu dữ liệu đều phải có cả hai nút, và bạn phải tự kiểm thử vòng tròn đầy đủ ít nhất một lần: xuất → xoá sạch → nhập lại → dữ liệu trở về nguyên vẹn. Công cụ chưa qua phép thử này chưa được coi là xong (Chương 14).</p></div>
<h2>Mẫu mạnh mẽ: chia sẻ bằng cách "nhúng dữ liệu vào link"</h2>
<p>Một mẹo đặc trưng của thế giới một-file: nén trạng thái vào chính địa chỉ URL (hoặc một đoạn mã để dán). Người nhận mở link là thấy đúng nội dung — thiệp mời (Ý 47), bình chọn (Ý 44) đều sống nhờ mẫu này. Giới hạn: link chỉ chứa được lượng dữ liệu nhỏ, và dữ liệu trong link là đọc được — đừng để lộ thông tin nhạy cảm theo cách này.</p>
<h2>Nạp dữ liệu từ ngoài vào</h2>
<p>Cho người dùng chọn file CSV/JSON từ máy của họ là cách nạp dữ liệu an toàn và không cần máy chủ. Hãy yêu cầu AI: kiểm tra định dạng khi nạp, báo lỗi rõ ràng theo dòng, và không bao giờ xoá dữ liệu cũ trước khi dữ liệu mới nạp thành công.</p>
<h2>Khi dữ liệu cần riêng tư hơn nữa: mã hoá</h2>
<p>Với nhật ký (Ý 10) hay két mật khẩu (Ý 7), dữ liệu được mã hoá bằng mật khẩu của người dùng qua Web Crypto trước khi lưu. Nguyên tắc phải hiểu rõ: <strong>quên mật khẩu là mất dữ liệu vĩnh viễn</strong> — không có máy chủ nào để "đặt lại mật khẩu" hộ. Công cụ tử tế sẽ nói thẳng điều này ngay từ màn hình đầu tiên.</p>
<h2>Tóm tắt cách nghĩ về dữ liệu</h2>
<p>Hỏi ba câu cho mọi ý tưởng: dữ liệu gồm những gì và lớn tới đâu (chọn ngăn), mất dữ liệu thì sao (thiết kế Xuất/Nhập ngay từ đầu), dữ liệu có cần đi sang máy khác không (file hoặc link). Trả lời được ba câu này là bạn đã thiết kế xong phần khó nhất của công cụ.</p>
</script>

<script type="text/html" id="body-vi-06">
<h2>Cách 1 — Gửi thẳng file (đơn giản nhất)</h2>
<p>Đính kèm file .html vào email, Zalo, Messenger… Người nhận tải về và mở bằng trình duyệt. Lưu ý thực tế: một số nền tảng chat chặn hoặc đổi tên file .html — phương án dự phòng là nén file vào .zip, hoặc dùng Cách 2.</p>
<h2>Cách 2 — Đưa lên một địa chỉ web (host tĩnh miễn phí)</h2>
<p>Đưa file lên các host tĩnh miễn phí (GitHub Pages, Netlify Drop, Cloudflare Pages…) là bạn có một đường link gọn gàng, mở được trên mọi thiết bị, lại mở khoá thêm các năng lực cần HTTPS. Đến 2026 đây vẫn là đường chia sẻ "đàng hoàng" ít tốn công nhất: kéo-thả một file, nhận một link. Nhớ rằng đặt lên web công khai nghĩa là ai có link cũng mở được — đừng đưa công cụ chứa dữ liệu cá nhân lên đó; dữ liệu vẫn nằm ở máy người xem, nhưng <em>bản thân công cụ và dữ liệu mẫu nhúng trong nó</em> thì công khai.</p>
<h2>Cách 3 — Mã QR (cho buổi gặp trực tiếp)</h2>
<p>In mã QR trỏ tới link của công cụ lên tờ rơi, bảng tin, backdrop sự kiện. Người tham dự quét là dùng ngay, không gõ địa chỉ, không cài app. Cặp đôi kinh điển với Ý 46 (bảng tin) và Ý 45 (sự kiện).</p>
<h2>Cách 4 — Chia sẻ <em>nội dung</em> qua "trạng thái trong URL"</h2>
<p>Với thiệp mời, bình chọn, so giờ rảnh: nội dung nằm ngay trong link, người nhận mở link là thấy phần dành cho mình. Đây là cách một file "giả lập" được trải nghiệm nhiều người mà không cần máy chủ — với giới hạn đã nói ở Chương 2 và 5.</p>
<h2>Đừng quên: làm cho nó chạy tốt trên điện thoại</h2>
<p>Phần lớn người nhận sẽ mở công cụ trên điện thoại. Trước khi chia sẻ, tự mở thử trên máy của mình: chữ có đủ to, nút có đủ lớn để chạm (ít nhất khoảng 36–44 px), bố cục có vỡ khi màn hình hẹp không. Yêu cầu AI "kiểm tra lại toàn bộ ở chiều rộng 360 px" là một lệnh rẻ mà hiệu quả.</p>
<h2>Một bảng chọn nhanh</h2>
<div class="table-scroll"><table>
<tr><th>Tình huống</th><th>Cách nên dùng</th></tr>
<tr><td>Gửi cho vài người quen</td><td>Gửi thẳng file (Cách 1)</td></tr>
<tr><td>Chia sẻ rộng, dùng lâu dài</td><td>Host tĩnh + link (Cách 2)</td></tr>
<tr><td>Sự kiện, lớp học, điểm bán</td><td>Mã QR (Cách 3)</td></tr>
<tr><td>Nội dung riêng cho từng người nhận</td><td>Trạng thái trong URL (Cách 4)</td></tr>
</table></div>
<h2>Một lời về sự tử tế khi chia sẻ</h2>
<p>Kèm theo công cụ, hãy gửi một dòng hướng dẫn: mở bằng gì, dữ liệu nằm ở đâu, sao lưu ra sao. Ba dòng đó quyết định người nhận dùng được hay bỏ cuộc — Chương 15 nói kỹ hơn về việc này.</p>
</script>

<script type="text/html" id="body-vi-07">
<div class="group-intro"><p>Tám công cụ nhỏ cho một ngày làm việc gọn gàng: quản trị việc, thời gian, tiền bạc và giấy tờ — những thứ dân văn phòng và người làm tự do chạm vào mỗi ngày. Nhóm này là nơi tốt nhất để bắt đầu, vì nhu cầu rõ, dữ liệu nhỏ, và kết quả nhìn thấy ngay. Mỗi ý bên dưới đi theo khuôn sáu mục chung của sách; nút <strong>Sao chép bản tóm tắt</strong> ở cuối mỗi ý sẽ chép một bản mô tả gọn để bạn dán thẳng cho AI khi bắt đầu làm.</p></div>
</script>

<script type="text/html" id="body-vi-08">
<div class="group-intro"><p>Tám công cụ cho đời sống cá nhân: tiền, sức khoẻ, thói quen, kỷ niệm và những bộ sưu tập chỉ mình bạn quan tâm. Đây là nhóm thể hiện rõ nhất triết lý local-first — dữ liệu đời tư nằm trên máy của bạn, không tài khoản, không đồng bộ ép buộc, không ai khác nhìn thấy. Hai ý dùng mã hoá (Ý 10) là bài tập tốt về sự tin cậy: hãy đọc kỹ phần cạm bẫy trước khi lưu điều gì thật sự nhạy cảm.</p></div>
</script>

<script type="text/html" id="body-vi-09">
<div class="group-intro"><p>Chín công cụ cho việc học và dạy: từ flashcard lặp lại ngắt quãng tới bảng trắng vẽ tay. Nhóm này có hai khách hàng rất khác nhau — người tự học cần sự bền bỉ (lịch ôn, thống kê), giáo viên và phụ huynh cần sự nhanh (tạo đề, tạo game trong vài phút). Điểm chung: nội dung học phải tách khỏi khung công cụ, để sửa nội dung không cần đụng vào code — hãy nhắc AI điều đó ngay từ giai đoạn Khung.</p></div>
</script>

<script type="text/html" id="body-vi-10">
<div class="group-intro"><p>Tám công cụ cho người làm sáng tạo và cho bất cứ ai cần "một tấm ảnh đẹp để đăng": bảng màu, social card, meme, mã QR, CV. Sản phẩm của nhóm này chủ yếu là <strong>file xuất ra</strong> (PNG, PDF, đoạn CSS) nên mẫu "Xuất ra sản phẩm" (Chương 13) xuất hiện dày đặc. Tiêu chuẩn chất lượng ở đây là thẩm mỹ: hãy dành giai đoạn Đánh bóng nhiều thời gian hơn thường lệ, và luôn xuất thử ở kích thước thật trước khi kết luận "đẹp".</p></div>
</script>

<script type="text/html" id="body-vi-11">
<div class="group-intro"><p>Chín ý tưởng giải trí, trong đó có những game cổ điển ai cũng từng chơi. Game là bài kiểm tra khắt khe nhất của một file HTML: vòng lặp thời gian thực, xử lý phím/chạm, trạng thái thắng-thua — nhưng cũng là nơi "mẫu khung vẽ + vòng lặp" (Chương 13) phát huy rõ nhất. Người mới nên đi từ Ý 39 và Ý 40 (nhẹ, vui ngay), để dành Snake/2048/Tetris và Sudoku cho khi đã quen quy trình bốn giai đoạn.</p></div>
</script>

<script type="text/html" id="body-vi-12">
<div class="group-intro"><p>Tám công cụ cho nhóm và cộng đồng — nhóm khó nhất về mặt khái niệm, vì một file vốn không có máy chủ để nối mọi người lại. Các ý trong nhóm này sống nhờ ba mẹo: chia sẻ qua file, nhúng trạng thái vào link, và xuất ảnh/in để phát hành. Hãy đọc kỹ mục "Vì sao một file là đủ" của từng ý: chỗ nào sách nói "đủ" là đủ thật, chỗ nào là phương án vòng qua thì giới hạn cũng được nói thẳng. Trung thực ở đây chính là chất lượng.</p></div>
</script>

<script type="text/html" id="body-vi-13">
<p>Mười mẫu dưới đây là những "khối xây" lặp đi lặp lại trong cả 50 ý tưởng. Học thuộc tên của chúng giúp bạn nói chuyện với AI nhanh hơn hẳn: thay vì mô tả dài dòng, bạn chỉ cần gọi tên mẫu — "thêm Mẫu 2 Xuất/Nhập cho màn hình này" — và yêu cầu AI áp dụng.</p>
<h2>Mẫu 1 — "Trạng thái + lưu tự động"</h2>
<p>Toàn bộ tình trạng công cụ nằm trong một đối tượng trạng thái duy nhất; mỗi thay đổi đều đi qua một điểm: cập nhật trạng thái → lưu → vẽ lại. Mẫu này giết chết cả họ lỗi "lưu một đằng, hiện một nẻo".</p>
<h2>Mẫu 2 — "Xuất / Nhập sao lưu" (cặp đôi bất ly thân)</h2>
<p>Xuất toàn bộ dữ liệu ra một file JSON có ngày tháng; nhập vào thì kiểm tra định dạng, hỏi xác nhận ghi đè, và chỉ thay dữ liệu khi file hợp lệ. Không công cụ lưu trữ nào được coi là xong nếu thiếu cặp này.</p>
<h2>Mẫu 3 — "Hai chế độ trong một file" (soạn ↔ xem)</h2>
<p>Một chế độ để soạn (form, trình sửa), một chế độ để xem/trình diễn (sạch, to, rõ). Ghi chú Markdown (Ý 4), bảng tin (Ý 46), visual novel (Ý 38) đều dùng mẫu này.</p>
<h2>Mẫu 4 — "Trạng thái trong URL"</h2>
<p>Mã hoá trạng thái nhỏ vào phần hash của địa chỉ; mở link là khôi phục đúng trạng thái đó. Dùng cho thiệp mời, bình chọn, chia sẻ một bảng màu — những thứ "gửi đi là xem được ngay".</p>
<h2>Mẫu 5 — "Bố cục danh sách + chi tiết"</h2>
<p>Phía trái (hoặc phía trên) là danh sách, chọn một mục thì xem/sửa chi tiết của nó. CRM cá nhân (Ý 14), tủ sưu tập (Ý 16), sổ tra cứu (Ý 24) đều là biến thể của mẫu này.</p>
<h2>Mẫu 6 — "Khung vẽ + vòng lặp" (cho game và hoạt hình)</h2>
<p>Một vòng lặp duy nhất: cập nhật trạng thái theo thời gian → vẽ lại lên Canvas. Mọi game ở nhóm E và các trực quan hoá ở Ý 25 đều đứng trên mẫu này; tách rõ "cập nhật" khỏi "vẽ" là chìa khoá để không rối.</p>
<h2>Mẫu 7 — "Chế độ tối &amp; giao diện co giãn"</h2>
<p>Màu sắc khai báo bằng biến CSS, hai bảng màu sáng/tối; bố cục co giãn theo chiều rộng, kiểm tra ở 360 px. Làm từ giai đoạn Khung sẽ rẻ hơn nhiều so với vá ở cuối.</p>
<h2>Mẫu 8 — "Trạng thái rỗng biết nói"</h2>
<p>Khi chưa có dữ liệu, màn hình không được trống trơn khó hiểu: nó phải nói "chưa có gì ở đây" và chỉ đúng nút để bắt đầu. Trạng thái rỗng là màn hình đầu tiên người dùng thấy — đối xử với nó như trang chủ.</p>
<h2>Mẫu 9 — "Hoàn tác &amp; xác nhận"</h2>
<p>Hành động phá huỷ (xoá, ghi đè) hoặc phải hỏi xác nhận, hoặc phải hoàn tác được. Rẻ nhất: thùng rác tạm giữ mục đã xoá trong phiên, kèm nút Hoàn tác vài giây sau khi xoá.</p>
<h2>Mẫu 10 — "Xuất ra sản phẩm" (ảnh / PDF / CSV / .ics)</h2>
<p>Giá trị của nhiều công cụ nằm ở file nó sinh ra chứ không phải ở chính nó: ảnh PNG từ Canvas, PDF qua in, CSV cho Excel, .ics cho lịch. Hãy kiểm thử file xuất ra trên ứng dụng đích thật (mở CSV bằng Excel, nhập .ics vào lịch) chứ không chỉ nhìn trong công cụ.</p>
<h2>Dùng các mẫu này thế nào với AI</h2>
<p>Ba cách dùng hiệu quả: gọi tên mẫu khi ra lệnh ("áp dụng Mẫu 8 cho cả ba cột"); yêu cầu AI tự đối chiếu ("rà soát file này theo 10 mẫu ở Chương 13, mẫu nào chưa đạt thì liệt kê"); và khi học một ý tưởng mới, tự hỏi nó được ghép từ những mẫu nào — đó là cách đọc sách này nhanh nhất.</p>
</script>

<script type="text/html" id="body-vi-14">
<h2>Nguyên tắc nền: "Tin nhưng phải kiểm"</h2>
<p>AI nói "đã xong" là một tuyên bố, không phải bằng chứng. Bằng chứng duy nhất là bạn tự tay bấm và thấy nó chạy đúng. Chương này biến việc kiểm thử thành một thói quen có danh sách, để người không đọc được code vẫn kiểm soát được chất lượng.</p>
<h2>Phương pháp "bấm hết mọi thứ"</h2>
<p>Mở công cụ ra và bấm <strong>mọi</strong> nút, mở <strong>mọi</strong> màn hình, thử <strong>mọi</strong> ô nhập. Nghe đơn giản, nhưng đây là cách phần lớn lỗi lộ mặt: nút không phản ứng, màn hình vỡ, ô nhập không nhận ký tự tiếng Việt có dấu. Hãy làm việc này trên cả máy tính lẫn điện thoại.</p>
<h2>Danh sách "trường hợp lạ" cần thử</h2>
<ul>
<li>Để trống mọi ô rồi bấm nút chính.</li>
<li>Nhập số 0, số âm, số rất lớn, chữ vào ô số.</li>
<li>Nhập tiếng Việt có dấu, ký tự đặc biệt, đoạn văn rất dài.</li>
<li>Tạo thật nhiều mục (50–100) rồi xem tốc độ và bố cục.</li>
<li>Xoá hết mọi mục — trạng thái rỗng có "biết nói" không?</li>
<li>Đóng tab giữa chừng rồi mở lại — dữ liệu còn nguyên không?</li>
<li>Tắt mạng hoàn toàn rồi dùng thử — công cụ có hứa hẹn gì cần mạng không?</li>
</ul>
<h2>Phép thử sao lưu (đừng bao giờ bỏ qua)</h2>
<p>Xuất dữ liệu → xoá sạch trong công cụ → nhập lại từ file vừa xuất → đối chiếu từng mục. Nếu vòng tròn này không khép kín hoàn hảo, công cụ chưa sẵn sàng để giao cho ai, kể cả chính bạn dùng lâu dài.</p>
<h2>Thử trên nhiều thiết bị</h2>
<p>Ít nhất: trình duyệt trên máy tính của bạn và điện thoại của bạn. Nếu chia sẻ cho người khác, nhờ một người dùng hệ điều hành khác mở thử một lần. Sự khác biệt trình duyệt là nguồn lỗi kinh điển của thế giới một-file.</p>
<h2>"Bảng điều khiển ẩn": người bạn của việc sửa lỗi</h2>
<p>Mọi trình duyệt đều có Console (thường mở bằng phím F12) — nơi các lỗi hiện thành dòng chữ đỏ. Bạn không cần hiểu chúng; chỉ cần <strong>chép nguyên văn</strong> gửi cho AI kèm mô tả thao tác. Một dòng lỗi đỏ đáng giá hơn mười câu mô tả cảm tính.</p>
<h2>Nhờ AI tự nâng chất lượng</h2>
<p>Khi công cụ đã chạy, hãy ra những lệnh rà soát: "đóng vai người dùng khó tính, liệt kê 10 điểm yếu của file này"; "kiểm tra các trường hợp biên theo Chương 14 và sửa lần lượt từng lỗi, mỗi lần sửa xong cho tôi cách kiểm thử lại". Đây là lúc giai đoạn Đánh bóng phát huy giá trị nhất.</p>
<h2>Một chút về "cảm giác chất lượng"</h2>
<p>Ngoài đúng/sai còn có dễ chịu/khó chịu: nút có đủ lớn, chữ có đủ tương phản, thao tác có phản hồi tức thì không, lỗi nhập liệu có được báo bằng lời người thay vì im lặng. Người dùng bỏ công cụ vì "cảm giác" nhiều hơn vì thiếu tính năng — hãy kiểm thử bằng cả hai con mắt đó.</p>
</script>

<script type="text/html" id="body-vi-15">
<h2>Đặt mình vào người nhận</h2>
<p>Người nhận công cụ của bạn không có mặt trong quá trình làm, không biết bốn giai đoạn, không biết dữ liệu lưu ở đâu. Họ chỉ có một file và ba giây kiên nhẫn đầu tiên. Mọi quyết định ở chương này đều xuất phát từ sự thật đó.</p>
<h2>Viết một dòng hướng dẫn tử tế</h2>
<p>Kèm file, gửi đúng một tin nhắn ngắn: mở bằng trình duyệt nào, bấm gì đầu tiên, dữ liệu nằm trên máy của họ, muốn sao lưu thì bấm nút nào. Ví dụ: "Anh mở file bằng Chrome nhé. Dữ liệu lưu trên máy của anh, cuối tuần bấm nút Xuất ở góc phải để sao lưu." Một dòng như vậy giảm một nửa số câu hỏi hỗ trợ.</p>
<h2>Onboarding nhẹ nhàng ngay trong công cụ</h2>
<p>Dữ liệu mẫu có sẵn để người dùng bấm thử ngay (và xoá dễ dàng), trạng thái rỗng chỉ đúng một hành động bắt đầu, và một ghi chú ngắn ngay trong giao diện về sao lưu. Đừng viết tài liệu dài — hãy để công cụ tự giải thích tại chỗ, đúng lúc cần.</p>
<h2>Thu thập phản hồi và lặp lại</h2>
<p>Hỏi người dùng đúng hai câu: "chỗ nào làm anh/chị vướng nhất?" và "anh/chị ước nó làm thêm được gì?". Câu thứ nhất cho bạn danh sách sửa theo thứ tự đau nhất; câu thứ hai cho lộ trình — nhưng hãy nhớ mỹ học vừa đủ ở Chương 3 trước khi nhận mọi yêu cầu.</p>
<h2>Niềm tin: tài sản lớn nhất</h2>
<p>Công cụ của bạn chạy trên máy người khác và giữ dữ liệu của họ. Hãy nói thẳng: dữ liệu ở đâu, có gửi đi đâu không, mất thì sao. Sự thẳng thắn này — giống cách sách nói thẳng giới hạn của một file — là thứ khiến người ta dám giao việc thật cho công cụ của bạn.</p>
<h2>Đặt tên &amp; trình bày</h2>
<p>Tên file rõ ràng, không dấu cách rối rắm: <code>theo-doi-okr-team-uad.html</code> tốt hơn <code>file-moi-2.html</code>. Trong công cụ, một tiêu đề tử tế và một dòng mô tả ngắn ở đầu trang giúp người mở lại sau vài tháng vẫn nhớ đây là gì.</p>
<h2>Khi công cụ dành cho cả cộng đồng</h2>
<p>Nếu phát hành rộng (lớp học, câu lạc bộ, sự kiện), hãy kèm mã QR (Chương 6), một kênh nhận phản hồi, và ý thức rằng bạn đang là "người bảo trì": lỗi của người dùng là việc của bạn cho tới khi bạn tuyên bố rõ phiên bản hỗ trợ tới đâu.</p>
<h2>Tinh thần của người làm công cụ</h2>
<p>Một công cụ nhỏ được làm tử tế và tới tay người dùng thật đáng giá hơn một hệ thống lớn mãi nằm trong ý tưởng. Đưa nó ra, nghe phản hồi, sửa đúng chỗ đau nhất — đó là toàn bộ nghề này ở quy mô của bạn.</p>
</script>

<script type="text/html" id="body-vi-16">
<h2>Dấu hiệu bạn đã "chật" trong một file</h2>
<ul>
<li>Nhiều người cần sửa cùng một dữ liệu và thấy thay đổi của nhau ngay lập tức.</li>
<li>Dữ liệu trở thành tài sản: mất là thiệt hại thật, cần sao lưu tự động và phân quyền.</li>
<li>Cần thông báo đẩy, chạy nền theo lịch, thanh toán, đăng nhập nhiều vai trò.</li>
<li>File phình to tới mức mở chậm, sửa một chỗ là sợ vỡ ba chỗ.</li>
</ul>
<h2>Các nấc thang đi lên</h2>
<ol>
<li><strong>Tách file có tổ chức:</strong> vẫn là web tĩnh, nhưng chia HTML/CSS/JS và dữ liệu thành nhiều file, dùng Git để quản lý phiên bản thay cho đặt tên thủ công.</li>
<li><strong>Thêm một backend nhỏ:</strong> một dịch vụ lưu trữ/đồng bộ tối thiểu (ví dụ các nền tảng backend-as-a-service) để có dữ liệu chung và tài khoản người dùng — chỉ thêm đúng phần một-file không làm được.</li>
<li><strong>PWA đúng nghĩa:</strong> phục vụ qua HTTPS, thêm Service Worker để cài đặt như app và chạy offline có kiểm soát.</li>
<li><strong>Framework và đội ngũ:</strong> khi sản phẩm có vòng đời dài và nhiều người cùng phát triển — đây là lúc cân nhắc học lập trình bài bản hoặc thuê người, với bản một-file của bạn làm bản đặc tả sống.</li>
</ol>
<h2>AI vẫn đồng hành ở mọi nấc</h2>
<p>Quy trình bốn giai đoạn không mất giá trị khi lên nấc: vẫn Khung → Cốt lõi → Lưu trữ → Đánh bóng, chỉ là mỗi nấc có thêm công cụ chuyên môn. Tới 2026, các tác tử lập trình đã đủ sức dẫn bạn qua phần lớn kỹ thuật ở nấc 1–3, miễn là bạn giữ vai đạo diễn như Chương 4: ra đề theo nấc nhỏ, kiểm thử bằng bằng chứng, giữ phiên bản an toàn bằng Git thay cho bản sao thủ công.</p>
<h2>Giữ tinh thần gọn nhẹ ngay cả khi làm lớn</h2>
<p>Nhiều hệ thống lớn chết vì tích lũy tính năng không ai dùng. Hãy mang theo mỹ học vừa đủ: mỗi tính năng thêm vào phải trả lời được "việc thật nào, của ai, đau tới đâu". Một file dạy bạn điều đó tốt hơn bất kỳ giáo trình quản trị sản phẩm nào.</p>
<h2>Lời kết: bắt đầu ngay hôm nay</h2>
<p>Đừng chờ học xong mới làm. Chọn một ý Dễ ở Phụ lục C, mở AI lên, và đi hết bốn giai đoạn trong một buổi. File đầu tiên của bạn sẽ xấu — mọi file đầu tiên đều xấu. Nhưng từ file thứ hai trở đi, bạn là người có công cụ tự làm được, và đó là một vị thế hoàn toàn khác.</p>
</script>

<script type="text/html" id="body-vi-A">
<p>Bảng này trả lời câu hỏi "tôi muốn làm X → dùng năng lực nào của trình duyệt", kèm mức độ an toàn. Quy tắc đọc: <strong>An toàn</strong> = dùng thoải mái cho phần cốt lõi; <strong>Có điều kiện</strong> = kiểm tra trình duyệt đích và chuẩn bị phương án dự phòng.</p>
<h2>Giao diện &amp; hiển thị</h2>
<div class="table-scroll"><table>
<tr><th>Muốn làm</th><th>Năng lực</th><th>Mức</th></tr>
<tr><td>Bố cục co giãn theo màn hình</td><td>CSS Flex/Grid, media query</td><td>An toàn</td></tr>

<script type="text/html" id="body-vi-B">
<p>Danh sách kiểm này gói toàn bộ kỷ luật của sách vào một trang. Dùng nó ở ba thời điểm: trước khi bắt đầu một ý tưởng, trong lúc làm, và trước khi chia sẻ sản phẩm. (Trên bản in, đánh dấu bằng bút; trên màn hình, đây là danh sách để đọc đối chiếu.)</p>
<h2>Trước khi bắt đầu (định hình ý tưởng)</h2>
<ul class="check-list">
<li>Người dùng chính là ai, việc chính là gì — nói được trong một câu.</li>
<li>Đối chiếu Chương 2: ý tưởng có đụng giới hạn nào của một file không?</li>
<li>Liệt kê các trường dữ liệu và ước lượng độ lớn (chọn localStorage hay IndexedDB).</li>
<li>Chốt ràng buộc để nói với AI: một file, thư viện ngoài được dùng hay không, ngôn ngữ giao diện.</li>
<li>Chuẩn bị 3–5 dòng dữ liệu mẫu thật.</li>
</ul>
<h2>Trong khi làm (bốn giai đoạn)</h2>
<ul class="check-list">
<li>Giai đoạn Khung: bố cục đúng ý trên cả điện thoại (360 px) trước khi đi tiếp.</li>
<li>Giai đoạn Cốt lõi: một hành vi mỗi vòng; kiểm thử cả trường hợp lạ ngay trong vòng đó.</li>
<li>Trước mỗi thay đổi lớn: lưu bản sao phiên bản có ngày tháng.</li>
<li>Giai đoạn Lưu trữ: qua được phép thử sao lưu đầy đủ (Chương 14).</li>
<li>Báo lỗi cho AI đủ bốn mảnh: thao tác — hiện tượng — kỳ vọng — phần không được đổi.</li>
</ul>
<h2>Kiểm thử "trường hợp lạ" (Chương 14)</h2>
<ul class="check-list">
<li>Nhập rỗng, số 0, số âm, số rất lớn, chữ vào ô số.</li>
<li>Tiếng Việt có dấu và ký tự đặc biệt ở mọi ô nhập.</li>
<li>Tạo 50–100 mục, rồi xoá sạch — trạng thái rỗng có hướng dẫn bước tiếp theo.</li>
<li>Đóng/mở lại, tắt mạng, mở trên điện thoại và trên một trình duyệt khác.</li>
<li>Mở Console (F12): không còn dòng lỗi đỏ chưa được xử lý.</li>
</ul>
<h2>Trước khi chia sẻ</h2>
<ul class="check-list">
<li>Tên file rõ ràng, không chứa dữ liệu cá nhân trong dữ liệu mẫu nhúng sẵn.</li>
<li>Không có khoá bí mật hay mật khẩu dùng chung nào trong file.</li>
<li>Kèm một dòng hướng dẫn: mở bằng gì, dữ liệu ở đâu, sao lưu thế nào.</li>
<li>Nếu công cụ giữ dữ liệu nhạy cảm: đã nói thẳng nguy cơ mất dữ liệu khi quên mật khẩu / xoá dữ liệu trình duyệt.</li>
</ul>
<h2>Nếu giữ dữ liệu nhạy cảm</h2>
<ul class="check-list">
<li>Dữ liệu được mã hoá bằng mật khẩu người dùng trước khi lưu (Ý 7, Ý 10).</li>
<li>Có bản sao lưu đã mã hoá ở một nơi khác mà chỉ người dùng kiểm soát.</li>
<li>Đã tự thử tình huống quên mật khẩu và chấp nhận hệ quả của nó.</li>
</ul>
</script>

  </div>
  <p class="attrib"><strong>Collected &amp; compiled by Tống Quốc Tuấn — R&amp;D Engineer, updated in 2026.</strong><br>This edition is fully rewritten and brought up to date for 2026: agentic AI coding tools are mainstream, browsers have gained new capabilities, and working with AI has shifted from "typing one prompt" to "managing context".</p>
